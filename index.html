<!DOCTYPE html>
<html lang="zh-CN">

<meta name="referrer" content="no-referrer">
<link rel="icon" id="favicon" type="image/jpeg">
<link rel="shortcut icon" id="favicon-shortcut" type="image/jpeg">
<link rel="apple-touch-icon" id="apple-touch-icon">
<meta name="theme-color" content="#f08a9c">
<title>MomoTalk - 自定义聊天</title>
<link rel="stylesheet" href="./resources/momotalk.css">
</head>
<body>

<div class="app-container">

    <div id="list-page">
        <div class="header">
            <div class="header-logo">
                <a href="./index.html"> <img id="app-icon" class="logo-img" alt="" referrerpolicy="no-referrer" style="display:none;"> </a>
                <span id="app-name"></span>
            </div>
            <div class="header-tools">
                <button class="tool-btn" id="btn-import" onclick="document.getElementById('file-import').click()"></button>
                <button class="tool-btn" id="btn-export" onclick="exportData()"></button>
            </div>
        </div>

        <div class="search-bar">

                    <span id="btn-screenshot-text"></span>

        <div class="chat-content" id="chat-content"></div>

                <button class="round-btn" id="btn-more" onclick="toggleMorePanel(event)" title="更多">

                </button>
                <button class="send-btn" id="send-btn" onclick="sendMessage('new')"></button>

            </div>
            <div class="chat-more-panel" id="more-panel">
                <div class="more-tiles" id="more-tiles">
                    <button class="more-tile" data-action="emoji" onclick="onMoreAction('emoji')">

                        <span class="more-tile-label" id="more-label-image"></span>
                    </button>
                    <button class="more-tile" data-action="reply" onclick="onMoreAction('reply')">
                        <span class="more-tile-icon">

                        <span class="more-tile-label" id="more-label-reply"></span>

<script src="./resources/chat_screenshot.js"></script>
<script>
const DATAS_URL = './resources/running_datas.json';

let CONFIG = {
    app: {}, storage: {}, about: {}, contact: {}, donate: {}, texts: {}
};
let configLoaded = false;

function deepMerge(target, source) {
    if (!source || typeof source !== 'object') return target;
    Object.keys(source).forEach(k => {
        const sv = source[k];
        if (sv && typeof sv === 'object' && !Array.isArray(sv)) {
            if (!target[k] || typeof target[k] !== 'object') target[k] = {};
            deepMerge(target[k], sv);
        } else {
            target[k] = sv;
        }
    });
    return target;
}

function normalizeConfig() {
    const a = CONFIG.about || (CONFIG.about = {});
    if (!a.developerName && a.authorName) a.developerName = a.authorName;
    if (!a.developerAvatar && a.authorAvatar) a.developerAvatar = a.authorAvatar;
    if (!a.developerUrl && a.xiaohongshuUrl) a.developerUrl = a.xiaohongshuUrl;
}

function T(key, vars, fallback) {
    const t = (CONFIG.texts && CONFIG.texts[key]) || fallback || key;
    if (vars) {
        return String(t).replace(/\{(\w+)\}/g, (m, k) =>
            vars[k] != null ? vars[k] : m);
    }
    return t;
}

let library = [];
let libraryById = {};
let libraryReady = false;

let studentsBaseUrl = new URL('./resources/students.json', location.href).href;

let myStudents = [];
let chats = {};

// 教程视频（resources/video.json）与本地设置（默认跳转视频网站等）
let videos = [];
let videosLoaded = false;
let videosLoading = false;
let videosError = null;
const VIDEO_SITES = ['channels', 'xiaohongshu'];
let settings = { defaultVideoSite: 'channels', animationTime: 1000, autoBackup: false };

let currentStudentId = null;
let currentRole = 'sensei';
let searchQuery = '';
let longPressFired = false;
let pressTimer = null;
let once_wrong = false;

const reportedImageErrors = new Set();

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function pickString(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number') return String(v);
    if (Array.isArray(v)) {
        for (let i = 0; i < v.length; i++) {
            const t = pickString(v[i]);
            if (t) return t;
        }
        return '';
    }
    if (typeof v === 'object') {
        const keys = ['url', 'Url', 'URL', 'src', 'path', 'cn', 'zh', 'zh_cn', 'nm', 'value', 'text'];
        for (let i = 0; i < keys.length; i++) {
            if (v[keys[i]] != null) {
                const t = pickString(v[keys[i]]);
                if (t) return t;
            }
        }
    }
    return '';
}

function normalizeAvatar(url) {
    let u = pickString(url);
    if (!u) return '';
    if (u.startsWith('data:')) return u;
    u = u.replace(/\\/g, '/');
    // 学生库里 615/796 个头像指向 static.kivo.fun：该域名的 HTTP 入口返回 404，
    // HTTPS 证书又与域名不匹配（浏览器会直接拦截），而同一路径在 static.kivo.wiki 上可用。
    // 这里统一把主机名迁移到可用域名，避免 259 名学生头像全部退化成首字母兜底图。
    u = u.replace(/^\/\/static\.kivo\.fun\//i, '//static.kivo.wiki/')
        .replace(/^https?:\/\/static\.kivo\.fun\//i, 'https://static.kivo.wiki/');
    if (u.startsWith('//')) {
        return (location.protocol === 'https:' ? 'https:' : 'http:') + u;
    }
    if (location.protocol === 'https:' && /^http:\/\//i.test(u)) {
        u = 'https://' + u.slice(7);
    }
    return u;
}

// 学生库里有 3 条 introduction 带 HTML（<br>、<span class="md-hover-text">），
// 直接 escapeHtml 会把标签原样显示成文字，这里先转成纯文本。
function stripHtml(s) {
    return String(s == null ? '' : s)
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p\s*>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/gi, '&');
}

function pickAvatarUrl() {
    for (let i = 0; i < arguments.length; i++) {
        const u = normalizeAvatar(arguments[i]);
        if (u) return u;
    }
    return '';
}

function pickDescription(raw) {
    if (!raw || typeof raw !== 'object') return '';
    const keys = [
        'introduction', 'Introduction',
        'description', 'Description',
        'profile', 'Profile',
        'intro', 'Intro',
        'desc', 'Desc',
        'bio', 'Bio'
    ];
    for (let i = 0; i < keys.length; i++) {
        if (raw[keys[i]] != null) {
            const t = pickString(raw[keys[i]]);
            if (t) return stripHtml(t);
        }
    }
    return '';
}

const _fallbackCache = new Map();
function fallbackAvatar(name) {
    const key = String(name || '?');
    if (_fallbackCache.has(key)) return _fallbackCache.get(key);
    const ch = key.charAt(0) || '?';
    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">` +
        `<rect width="64" height="64" fill="#e8e8e8"/>` +
        `<text x="32" y="41" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#999">${escapeHtml(ch)}</text>` +
        `</svg>`;
    const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    _fallbackCache.set(key, uri);
    return uri;
}

function brokenImage() {
    const txt = escapeHtml(T('imageLoadFail', null, '图片加载失败'));
    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">` +
        `<rect width="200" height="120" fill="#f5f5f5"/>` +
        `<text x="100" y="65" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#bbb">${txt}</text>` +
        `</svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

document.addEventListener('error', function (e) {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;

    const curSrc = img.getAttribute('src') || '';
    if (!curSrc || curSrc.startsWith('data:')) return;

    const fallback = img.dataset.fallback;
    if (fallback && curSrc === fallback) return;

    let retries = parseInt(img.dataset.retries || '0', 10);

    if (retries === 0) {
        img.dataset.retries = '1';
        let newSrc = curSrc;

        newSrc = newSrc.replace(/\/resources\/resources\//gi, '/resources/');

        if (!/^(http|\/\/|data:|blob:)/i.test(newSrc)) {
            if (!newSrc.includes('/resources/') && !newSrc.includes('resources/')) {
                try {
                    newSrc = new URL(newSrc, studentsBaseUrl).href;
                } catch (err) {}
            }
        }

        if (newSrc !== curSrc) {
            img.setAttribute('src', newSrc);
            return;
        }

        const curPolicy = img.getAttribute('referrerpolicy');
        const newPolicy = curPolicy === 'no-referrer' ? 'no-referrer-when-downgrade' : 'unsafe-url';
        img.setAttribute('referrerpolicy', newPolicy);

        img.removeAttribute('src');
        setTimeout(() => { img.setAttribute('src', curSrc); }, 10);
        return;
    }

    if (retries >= 1 && fallback) {
        img.removeAttribute('data-fallback');
        img.setAttribute('src', fallback);

        if (!reportedImageErrors.has(curSrc) && !once_wrong) {
            once_wrong = true;
            reportedImageErrors.add(curSrc);

            showModal(T('imgErrorTitle', null, '图片加载失败'), `
                <div style="font-size:14px;color:#d85c76;margin-bottom:12px;font-weight:bold;word-break:break-all;">
                    ${escapeHtml(T('imgErrorRes', null, '错误资源：'))}${escapeHtml(curSrc)}
                </div>
                <div style="font-size:13px;color:#666;line-height:1.6;text-align:left;">
                    ${escapeHtml(T('imgErrorReasons', null, '可能的原因：服务器文件不存在、路径配置错误、跨域限制或图片损坏。'))}
                </div>
            `, [
                { text: T('imgErrorOk', null, '知道了'), class: 'confirm', onClick: closeModal }
            ]);
        }
    }
}, true);

function isImageUrl(text) {
    if (!text) return false;
    let t = text.trim();
    if (t.startsWith('data:image/')) return true;
    // students.json 里的头像大量使用协议相对 URL（//host/path.png），
    // 这里与 normalizeAvatar 保持一致：先补全协议再判断，否则粘贴这类链接会被当成纯文本。
    if (t.startsWith('//')) t = 'https:' + t;
    if (!/^https?:\/\//i.test(t)) return false;
    return /\.(jpe?g|gif|png|webp|svg|bmp|ico)(\?.*)?(#.*)?$/i.test(t);
}

function now() { return Date.now(); }

function buildDisplayName(familyCn, givenCn) {
    if (familyCn && givenCn) return familyCn + ' ' + givenCn;
    return familyCn || givenCn || '';
}

async function loadConfig() {
    try {
        const res = await fetch(DATAS_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || typeof data !== 'object') throw new Error('running_datas.json 格式错误');

/* ================= 本地设置（默认跳转视频网站等） ================= */
function settingsKey() { return (CONFIG.storage && CONFIG.storage.settingsKey) || 'momotalk_settings_v1'; }

function normalizeVideoSite(v) {
    return VIDEO_SITES.indexOf(v) >= 0 ? v : 'channels';
}

function defaultVideoSite() {
    const d = CONFIG.tutorial && CONFIG.tutorial.defaultSite;
    return VIDEO_SITES.indexOf(d) >= 0 ? d : 'channels';
}

function clampAnimationTime(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return 1000;
    return Math.max(700, Math.min(2000, Math.round(n / 50) * 50));
}

function loadSettings() {
    settings = {
        defaultVideoSite: defaultVideoSite(),
        animationTime: 1000,
        autoBackup: false
    };
    try {
        const raw = localStorage.getItem(settingsKey());
        if (!raw) return;
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
            if (obj.defaultVideoSite) settings.defaultVideoSite = normalizeVideoSite(obj.defaultVideoSite);
            if (obj.animationTime != null) settings.animationTime = clampAnimationTime(obj.animationTime);
            settings.autoBackup = !!obj.autoBackup;
        }
    } catch (e) { console.error('读取设置失败：', e); }
}

function saveSettings() {
    try {
        localStorage.setItem(settingsKey(), JSON.stringify(settings));
        return true;
    } catch (e) {
        console.error('保存设置失败：', e);
        return false;
    }
}

function updateSettingsUI() {
    const range = document.getElementById('anim-time-range');
    const val = document.getElementById('anim-time-value');
    if (range) range.value = String(settings.animationTime);
    if (val) val.textContent = settings.animationTime + 'ms';

    const preview = document.getElementById('anim-preview');
    if (preview) preview.style.setProperty('--typing-dur', settings.animationTime + 'ms');

    const sw = document.getElementById('auto-backup-switch');
    if (sw) sw.checked = !!settings.autoBackup;
}

function setAnimationTime(v) {
    settings.animationTime = clampAnimationTime(v);
    saveSettings();
    updateSettingsUI();
}

function setAutoBackup(on) {
    const prev = settings.autoBackup;
    settings.autoBackup = !!on;
    if (!saveSettings()) {
        settings.autoBackup = prev;
        updateSettingsUI();
        return;
    }
    updateSettingsUI();
}

/* ================= 教程视频（resources/video.json） ================= */
function tutorialUrl() {
    return (CONFIG.tutorial && CONFIG.tutorial.url) || './resources/video.json';
}

// 只放行 http(s) / 协议相对链接，避免 video.json / 配置里出现 javascript: 之类的地址
function safeUrl(u) {
    let s = pickString(u);
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    if (s.startsWith('//')) {
        return (location.protocol === 'https:' ? 'https:' : 'http:') + s;
    }
    return '';
}

function normalizeVideos(data) {
    let list = [];
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object' && Array.isArray(data.videos)) list = data.videos;

    const out = [];
    list.forEach((item, i) => {
        if (!item || typeof item !== 'object') return;
        const links = (item.links && typeof item.links === 'object') ? item.links : item;
        const channels = safeUrl(links.channels || links.wechat || links.shipinhao || links.videoAccount);
        const xhs = safeUrl(links.xiaohongshu || links.redbook || links.xhs || links.red);
        let title = pickString(item.title || item.name);
        let description = pickString(item.description || item.desc || item.text || item.intro);
        if (!description) description = title;
        // 只有 title 没有 description 时，避免同一段文字渲染两遍
        if (title && title === description) title = '';
        if (!description) return;
        out.push({
            id: pickString(item.id) || ('video-' + (i + 1)),
            title: title,
            description: description,
            links: { channels: channels, xiaohongshu: xhs }
        });
    });
    return out;
}

async function loadVideos(force) {
    if (videosLoading) return;
    if (videosLoaded && !force) return;
    videosLoading = true;
    videosError = null;
    renderTutorialList();
    try {
        const res = await fetch(tutorialUrl(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        videos = normalizeVideos(await res.json());
        videosLoaded = true;
    } catch (e) {
        console.error('video.json 加载失败：', e);
        videos = [];
        videosError = e;
    } finally {
        videosLoading = false;
        renderTutorialList();
    }
}

// 按「默认跳转视频网站」选链接；当前网站没有该视频时自动回退到另一个网站
function pickVideoLink(v) {
    const first = settings.defaultVideoSite;
    const second = first === 'channels' ? 'xiaohongshu' : 'channels';
    if (v.links[first]) return { url: v.links[first], site: first };
    if (v.links[second]) return { url: v.links[second], site: second };
    return { url: '', site: '' };
}

function renderTutorialList() {
    const box = document.getElementById('tutorial-list');
    const empty = document.getElementById('tutorial-empty');
    if (!box || !empty) return;

    if (videosLoading) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `<div class="loading-tip" style="height:auto;padding:24px 0;">
            <div class="spinner"></div><span>${escapeHtml(T('tutorialLoading', null, '正在读取教程…'))}</span></div>`;
        return;
    }
    if (videosError) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `
            <div style="font-size:14px;color:#666;margin-bottom:8px;">${escapeHtml(T('tutorialErrorTitle', null, '无法读取教程内容'))}</div>
            <div style="font-size:12px;color:#aaa;line-height:1.7;">${escapeHtml(T('tutorialErrorHint', null, '请确认 resources/video.json 存在且可访问。'))}<br>${escapeHtml(tutorialUrl())}</div>
            <button onclick="loadVideos(true)">${escapeHtml(T('tutorialReload', null, '重新读取'))}</button>`;
        return;
    }
    if (!videos.length) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `${escapeHtml(T('tutorialEmpty', null, '暂无教程内容'))}<br><span style="font-size:12px;color:#c4c4c4;">${escapeHtml(T('tutorialEmptyHint', null, '在 resources/video.json 中填入视频后刷新即可显示'))}</span>`;
        return;
    }

    empty.style.display = 'none';
    box.style.display = '';
    const missing = escapeHtml(T('tutorialLinkMissing', null, '暂无链接'));
    box.innerHTML = videos.map(v => {
        const link = pickVideoLink(v);
        const title = v.title ? `<div class="tutorial-title">${escapeHtml(v.title)}</div>` : '';
        const desc = `<div class="tutorial-desc">${escapeHtml(v.description)}</div>`;
        if (!link.url) {
            return `<div class="tutorial-item disabled">
                <div class="tutorial-info">${title}${desc}</div>
                <span class="tutorial-site muted">${missing}</span>
            </div>`;
        }
        // 只展示默认视频网站的那一个链接，点击文字介绍即跳转
        return `<a class="tutorial-item" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
            <div class="tutorial-info">${title}${desc}</div>
            <span class="tutorial-site">${escapeHtml(siteLabel(link.site))}</span>
            <span class="tutorial-arrow">›</span>
        </a>`;
    }).join('');
}

function expandStudents(rawList) {
    const result = [];
    const usedIds = new Set();

    rawList.forEach(raw => {
        const baseId = Number(raw && raw.id);
        if (!Number.isFinite(baseId)) return;

        const givenCn = (raw.givenName && (raw.givenName.cn || raw.givenName.nm)) || '';
        const familyCn = (raw.familyName && (raw.familyName.cn || raw.familyName.nm)) || '';
        const fullName = buildDisplayName(familyCn, givenCn) || ('学生#' + baseId);
        const shortName = givenCn || familyCn || fullName;

        const introduction = pickDescription(raw);

        const familyName = raw.familyName || {};
        const givenName = raw.givenName || {};

        const baseAvatar = pickAvatarUrl(
            raw.avatar, raw.avatarUrl, raw.avatar_url, raw.avatarURL,
            raw.portrait, raw.portraitUrl,
            raw.image, raw.imageUrl,
            raw.icon, raw.iconUrl
        );

        const skinList = Array.isArray(raw.skinList) ? raw.skinList : [];

        let mainSkinIndex = -1;
        for (let i = 0; i < skinList.length; i++) {
            const s = skinList[i];
            const skinName = String((s && (s.skin_cn || s.skin)) || '').trim();
            if (!skinName) { mainSkinIndex = i; break; }
        }

        let mainAvatar = baseAvatar;
        if (mainSkinIndex >= 0) {
            const ms = skinList[mainSkinIndex];
            mainAvatar = pickAvatarUrl(
                ms && ms.avatar, ms && ms.avatarUrl, ms && ms.avatar_url,
                ms && ms.portrait, ms && ms.portraitUrl,
                ms && ms.image, ms && ms.imageUrl,
                baseAvatar
            ) || baseAvatar;
        }

        let mainId = baseId;
        while (usedIds.has(mainId)) mainId = mainId * 100 + 1;
        usedIds.add(mainId);

        result.push({
            id: mainId,
            baseId: baseId,
            skinIndex: mainSkinIndex,
            displayName: fullName,
            shortName: shortName,
            avatar: mainAvatar,
            introduction: introduction,
            familyName: familyName,
            givenName: givenName,
            skinName: '',
            searchText: [fullName, familyCn, givenCn].filter(Boolean).join(' ').toLowerCase()
        });

        skinList.forEach((skin, idx) => {
            if (idx === mainSkinIndex) return;
            const skinName = String((skin && (skin.skin_cn || skin.skin)) || '').trim();
            if (!skinName) return;

            let entryId = baseId * 100 + idx;
            let guard = 0;
            while ((usedIds.has(entryId) || entryId === mainId) && guard < 20) {
                entryId = entryId * 100 + 1;
                guard++;
            }
            if (usedIds.has(entryId)) return;
            usedIds.add(entryId);

            const skinAvatar = pickAvatarUrl(
                skin && skin.avatar, skin && skin.avatarUrl, skin && skin.avatar_url,
                skin && skin.portrait, skin && skin.portraitUrl,
                skin && skin.image, skin && skin.imageUrl,
                baseAvatar
            ) || baseAvatar;
            const displayName = fullName + '（' + skinName + '）';

            result.push({
                id: entryId,
                baseId: baseId,
                skinIndex: idx,
                displayName: displayName,
                shortName: shortName,
                avatar: skinAvatar,
                introduction: introduction,
                familyName: familyName,
                givenName: givenName,
                skinName: skinName,
                searchText: [fullName, skinName, familyCn, givenCn].filter(Boolean).join(' ').toLowerCase()
            });
        });
    });

    // 学生库里存在同名条目（例如两个「？？？」占位角色），列表/选择器里无法区分，
    // 这里给重名的条目补上 #id 后缀（只影响重名项）。
    const nameCount = {};
    result.forEach(s => { nameCount[s.displayName] = (nameCount[s.displayName] || 0) + 1; });
    result.forEach(s => {
        if (nameCount[s.displayName] > 1) {
            s.displayName = s.displayName + '（#' + s.id + '）';
            s.searchText = (s.searchText + ' #' + s.id).toLowerCase();
        }
    });

    return result;
}

function matchStudent(s, q) {
    if (!q) return true;
    return (s.searchText || '').includes(q);
}

async function loadLibrary() {
    const list = document.getElementById('contact-list');
    list.innerHTML = `<div class="loading-tip"><div class="spinner"></div><span>${escapeHtml(T('loadingLibrary', null, '正在读取学生资料…'))}</span></div>`;

    const url = CONFIG.app.studentsUrl || './resources/students.json';

    try {
        studentsBaseUrl = new URL(url, location.href).href;
    } catch (e) {
        studentsBaseUrl = new URL('./resources/students.json', location.href).href;
    }

    try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('students.json 的顶层结构应为数组');

        library = expandStudents(data);
        libraryById = {};
        library.forEach(s => { libraryById[s.id] = s; });
        libraryReady = true;
        renderContactList();
    } catch (err) {
        libraryReady = false;
        const title = T('loadErrorTitle', null, '无法读取学生资料');
        const hint = T('loadErrorHint', null, '请确认 resources/students.json 与 HTML 位于同一目录。');
        const reload = T('reloadBtn', null, '重新读取');
        list.innerHTML = `
            <div class="empty-tip">
                <div style="font-size:15px;color:#666;margin-bottom:10px;">${escapeHtml(title)}</div>
                <div style="font-size:12px;color:#aaa;">
                    ${escapeHtml(err.message || String(err))}<br>${escapeHtml(hint)}
                </div>
                <button onclick="loadLibrary()">${escapeHtml(reload)}</button>
            </div>`;
    }
}

function renderContactList() {
    const list = document.getElementById('contact-list');
    if (!libraryReady) return;

    let entries = myStudents
        .map(entry => {
            const stu = libraryById[entry.id];
            if (!stu) return null;
            return {
                id: stu.id,
                displayName: stu.displayName,
                shortName: stu.shortName,
                avatar: stu.avatar,
                introduction: stu.introduction,
                skinName: stu.skinName,
                unread: entry.unread || 0,
                addedAt: entry.addedAt || 0
            };
        })
        .filter(Boolean);

    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        entries = entries.filter(s => (s.displayName + ' ' + (s.skinName || '')).toLowerCase().includes(q));
    }

    entries.sort((a, b) => {
        const la = getLastMsg(a.id);
        const lb = getLastMsg(b.id);
        // 缺少/非法的 time 要回退到 addedAt，否则 tb - ta 得到 NaN，列表顺序会随机跳动
        const ta = (la && Number(la.time)) || a.addedAt || 0;
        const tb = (lb && Number(lb.time)) || b.addedAt || 0;
        return tb - ta;
    });

    if (entries.length === 0) {
        list.innerHTML = `
            <div class="empty-tip">
                ${searchQuery
                    ? escapeHtml(T('emptySearch', null, '没有找到匹配的学生形态'))
                    : `${escapeHtml(T('emptyMyStudents', null, '还没有添加学生'))}<br><span style="font-size:12px;color:#c4c4c4;">${escapeHtml(T('emptyHint', null, '点击下方 + 从学生库中选择'))}</span>`}
            </div>`;
        return;
    }

    list.innerHTML = entries.map(s => {
        const name = s.displayName;
        const avatar = s.avatar || fallbackAvatar(name);
        const last = getLastMsg(s.id);

        let preview;
        if (last) {
            // 兜底：即使数据被外部改坏，也保证这里拿到的是字符串
            const rawText = typeof last.text === 'string' ? last.text : String(last.text == null ? '' : last.text);
            const isImg = isImageUrl(rawText);
            let text = isImg ? T('imagePlaceholder', null, '[图片]') : rawText.replace(/\n/g, ' ');
            if (text.length > 40) text = text.slice(0, 40) + '…';
            preview = last.role === 'sensei'
                ? `<span class="prefix-sensei">${escapeHtml(T('mePrefix', null, '[我]'))}</span> ${escapeHtml(text)}`
                : escapeHtml(text);
        } else if (s.skinName) {
            preview = `<span class="skin-tag">${escapeHtml(T('skinPreview', null, '暂无消息'))}</span>`;
        } else {
            const intro = (s.introduction || '').replace(/\n/g, ' ').trim();
            preview = intro
                ? escapeHtml(intro.length > 60 ? intro.slice(0, 60) + '…' : intro)
                : `<span style="color:#ccc;">${escapeHtml(T('startChat', { name: s.shortName }, '开始与 {name} 聊天吧'))}</span>`;
        }

        const unreadHtml = s.unread > 0
            ? `<div class="unread-badge">${s.unread > 99 ? '99+' : s.unread}</div>`
            : '';

        return `<div class="contact-item" data-id="${s.id}">
            <img class="contact-avatar" src="${escapeHtml(avatar)}"
                 data-fallback="${escapeHtml(fallbackAvatar(name))}"
                 referrerpolicy="no-referrer" alt="" loading="lazy">
            <div class="contact-info">
                <div class="contact-name">${escapeHtml(name)}</div>
                <div class="contact-preview">${preview}</div>
            </div>
            ${unreadHtml}
        </div>`;
    }).join('');
}

function onSearch() {

}

(function bindListEvents() {
    const list = document.getElementById('contact-list');

    const clearTimer = () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    let pressStart = null;

    list.addEventListener('pointerdown', e => {
        const item = e.target.closest('.contact-item');
        if (!item) return;
        // 只响应鼠标左键 / 触摸主指针
        if (e.button !== undefined && e.button !== 0) return;
        // 多指同时按下时先清掉上一个计时器，否则会对上一个学生误弹菜单
        clearTimer();
        longPressFired = false;
        pressStart = { x: e.clientX, y: e.clientY };
        const id = Number(item.dataset.id);
        pressTimer = setTimeout(() => {
            pressTimer = null;
            pressStart = null;
            longPressFired = true;
            showListContextMenu(id);
        }, 600);
    });

    ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(ev => {
        list.addEventListener(ev, clearTimer, { passive: true });
    });

    // 原来的 pointermove 有任何抖动就取消长按，导致长按几乎按不出来；改为超过阈值才取消
    list.addEventListener('pointermove', e => {
        if (!pressStart) return;
        const dx = e.clientX - pressStart.x;
        const dy = e.clientY - pressStart.y;
        if (dx * dx + dy * dy > 100) clearTimer();
    }, { passive: true });

    list.addEventListener('click', e => {
        if (longPressFired) { longPressFired = false; return; }
        const item = e.target.closest('.contact-item');
        if (item) openChat(Number(item.dataset.id));
    });

    list.addEventListener('contextmenu', e => {
        const item = e.target.closest('.contact-item');
        if (!item) return;
        e.preventDefault();
        showListContextMenu(Number(item.dataset.id));
    });
})();

function renderPickerList(query) {
    const box = document.getElementById('picker-list');
    if (!box) return;

    const addedSet = new Set(myStudents.map(s => s.id));
    const q = query.toLowerCase();

    let items = library;
    if (q) items = items.filter(s => matchStudent(s, q));

    const MAX = 400;
    const limited = items.slice(0, MAX);

    if (limited.length === 0) {
        box.innerHTML = `<div class="picker-empty">${escapeHtml(T('pickerEmpty', null, '没有匹配的学生形态'))}</div>`;
        return;
    }

    const addedTxt = T('pickerAdded', null, '已添加');
    const addTxt = T('pickerAdd', null, '＋ 添加');

    box.innerHTML = limited.map(s => {
        const added = addedSet.has(s.id);
        const avatar = s.avatar || fallbackAvatar(s.displayName);
        return `<div class="picker-item ${added ? 'added' : ''}" data-id="${s.id}">
            <img class="picker-avatar" src="${escapeHtml(avatar)}"
                 data-fallback="${escapeHtml(fallbackAvatar(s.displayName))}"
                 referrerpolicy="no-referrer" alt="" loading="lazy">
            <div class="picker-name">${escapeHtml(s.displayName)}</div>
            <div class="picker-status">${added ? escapeHtml(addedTxt) : escapeHtml(addTxt)}</div>
        </div>`;
    }).join('') + (items.length > MAX
        ? `<div class="picker-empty">${escapeHtml(T('pickerMore', { n: items.length - MAX }, '还有 {n} 个形态未显示，请输入关键字搜索'))}</div>`
        : '');

    box.querySelectorAll('.picker-item').forEach(el => {
        el.addEventListener('click', () => {
            if (el.classList.contains('added')) return;
            addStudentToMyList(Number(el.dataset.id));
            el.classList.add('added');
            const status = el.querySelector('.picker-status');
            if (status) status.textContent = addedTxt;
            renderContactList();
        });
    });
}

function addStudentToMyList(id) {
    if (!libraryById[id]) return;
    if (myStudents.some(s => s.id === id)) return;
    myStudents.push({ id: id, unread: 0, addedAt: now() });
    saveMyStudents();
}

/* ================= 信息盒子：数据模型与工具 ================= */

let playback = null;
let morePanelOpen = false;

function uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const ITEM_TYPES = ['text', 'image', 'emoji', 'reply', 'story'];

function newItem(type, data) {
    const it = { id: uid('i'), type: type };
    data = data || {};
    if (type === 'text' || type === 'reply' || type === 'story') {
        it.text = String(data.text == null ? '' : data.text);
        if (type === 'reply') it.title = String(data.title == null ? T('replyTitle', null, '回复') : data.title);
        if (type === 'story') it.title = String(data.title == null ? T('storyTitle', null, '好感故事') : data.title);
    }
    if (type === 'image' || type === 'emoji') it.src = String(data.src == null ? '' : data.src);
    return it;
}

function emptyBox(role) {
    return { id: uid('b'), role: role === 'student' ? 'student' : 'sensei', time: now(), items: [] };
}

function itemSignature(it) {
    return (it.type || '') + ':' + (it.text || '') + ':' + (it.src || '') + ':' + (it.title || '');
}

function boxSignature(box) {
    return (box.role || '') + '|' + Number(box.time || 0) + '|' +
        (box.items || []).map(itemSignature).join('\u0001');
}

function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    let type = ITEM_TYPES.indexOf(raw.type) >= 0 ? raw.type : '';
    if (!type) {
        const src = String(raw.src || raw.url || raw.path || '');
        type = src ? (src.indexOf('/emoji/') >= 0 ? 'emoji' : 'image') : 'text';
    }
    const it = { id: (typeof raw.id === 'string' && raw.id) ? raw.id : uid('i'), type: type };
    if (type === 'text' || type === 'reply' || type === 'story') {
        const text = pickString(raw.text != null ? raw.text : raw.content);
        if (!text) return null;
        it.text = text;
        if (type === 'reply') it.title = pickString(raw.title) || T('replyTitle', null, '回复');
        if (type === 'story') it.title = pickString(raw.title) || T('storyTitle', null, '好感故事');
    } else {
        const src = pickString(raw.src || raw.url || raw.path);
        if (!src) return null;
        it.src = src;
    }
    return it;
}

function normalizeBox(raw, fallbackTime) {
    if (!raw || typeof raw !== 'object') return null;
    const role = raw.role === 'student' ? 'student' : (raw.role === 'sensei' ? 'sensei' : '');
    if (!role) return null;
    const items = (Array.isArray(raw.items) ? raw.items : []).map(normalizeItem).filter(Boolean);
    if (!items.length) return null;
    let t = Number(raw.time);
    if (!Number.isFinite(t) || t <= 0) t = fallbackTime || now();
    return {
        id: (typeof raw.id === 'string' && raw.id) ? raw.id : uid('b'),
        role: role,
        time: t,
        items: items
    };
}

// 旧版扁平消息数组 → 信息盒子（连续同角色合并）
function legacyMessagesToBoxes(arr) {
    const boxes = [];
    let cur = null;
    arr.forEach((m, i) => {
        if (!m || typeof m !== 'object') return;
        const role = m.role === 'student' ? 'student' : (m.role === 'sensei' ? 'sensei' : '');
        if (!role) return;
        const rawText = m.text == null ? '' : String(m.text);
        const text = rawText.trim();
        if (!text) return;
        const item = isImageUrl(text)
            ? { id: uid('i'), type: 'image', src: text }
            : { id: uid('i'), type: 'text', text: rawText };
        const rawTime = Number(m.time);
        const time = (Number.isFinite(rawTime) && rawTime > 0) ? rawTime : now() + i;
        if (!cur || cur.role !== role) {
            cur = { id: uid('b'), role: role, time: time, items: [] };
            boxes.push(cur);
        }
        cur.items.push(item);
        cur.time = time;
    });
    return boxes;
}

function sanitizeChats(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    const base = now();
    Object.keys(raw).forEach(k => {
        const arr = raw[k];
        if (!Array.isArray(arr)) return;
        const looksLikeBoxes = arr.some(x => x && typeof x === 'object' && Array.isArray(x.items));
        const boxes = looksLikeBoxes
            ? arr.map((b, i) => normalizeBox(b, base + i)).filter(Boolean)
            : legacyMessagesToBoxes(arr);
        if (boxes.length) {
            boxes.sort((a, b) => a.time - b.time);
            out[k] = boxes;
        }
    });
    return out;
}

function cloneBoxes(boxes) {
    try { return JSON.parse(JSON.stringify(boxes || [])); }
    catch (e) { return []; }
}

// 列表预览 / 排序
function getLastMsg(studentId) {
    const arr = chats[studentId];
    if (!arr || !arr.length) return null;
    const box = arr[arr.length - 1];
    return { role: box.role, text: boxText(box), time: box.time };
}

function boxText(box) {
    if (!box || !Array.isArray(box.items) || !box.items.length) return '';
    const it = box.items[box.items.length - 1];
    if (it.type === 'image') return T('imagePlaceholder', null, '[图片]');
    if (it.type === 'emoji') return T('emojiPlaceholder', null, '[表情]');
    return it.text || '';
}

function itemPreview(it) {
    if (it.type === 'image') return T('imagePlaceholder', null, '[图片]');
    if (it.type === 'emoji') return T('emojiPlaceholder', null, '[表情]');
    return it.text || '';
}

function itemTypeLabel(type) {
    const map = {
        text: T('itemTypeText', null, '文本'),
        image: T('itemTypeImage', null, '图片'),
        emoji: T('itemTypeEmoji', null, '表情'),
        reply: T('itemTypeReply', null, '回复'),
        story: T('itemTypeStory', null, '好感')
    };
    return map[type] || type;
}

function canEditItem(type) {
    return type === 'text' || type === 'reply' || type === 'story';
}

function currentStudent() {
    return currentStudentId ? libraryById[currentStudentId] : null;
}

function chatBoxes() {
    if (!currentStudentId) return [];
    if (!Array.isArray(chats[currentStudentId])) chats[currentStudentId] = [];
    return chats[currentStudentId];
}

/* ================= 聊天页渲染 ================= */

function openChat(studentId) {
    const stu = libraryById[studentId];
    if (!stu) return;

    stopPlayback(true);
    closeMorePanel();

    currentStudentId = studentId;
    currentRole = 'sensei';
    updateRoleUI();

    const headerAvatar = document.getElementById('chat-header-avatar');
    headerAvatar.dataset.fallback = fallbackAvatar(stu.displayName);
    headerAvatar.removeAttribute('data-retries');
    headerAvatar.src = stu.avatar || fallbackAvatar(stu.displayName);
    document.getElementById('chat-header-name').textContent = stu.displayName;

    const entry = myStudents.find(s => s.id === studentId);
    if (entry && entry.unread) {
        entry.unread = 0;
        saveMyStudents();
    }

    document.getElementById('list-page').classList.add('slide-out');
    document.getElementById('chat-page').classList.add('slide-in');
    document.querySelector('.bottom-nav').classList.add('hidden');

    renderChat();
}

function closeChat() {
    if (!currentStudentId) return;

    // 需求 6：自动备份（默认关闭）
    if (settings.autoBackup) autoBackup();

    stopPlayback(true);
    closeMorePanel();
    resetPlayButton();

    const page = document.getElementById('chat-page');
    page.classList.remove('slide-in');
    page.style.transform = '';
    document.getElementById('list-page').classList.remove('slide-out');
    document.querySelector('.bottom-nav').classList.remove('hidden');

    // 清掉输入框：否则给 A 写的草稿会留在框里，打开 B 后一回车就发给了 B
    const input = document.getElementById('chat-input');
    if (input) { input.value = ''; input.style.height = 'auto'; }
    currentStudentId = null;
    renderContactList();
}

function scrollChatToBottom(container) {
    const el = container || document.getElementById('chat-content');
    if (!el) return;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function boxHtml(box) {

    const avatar = stu ? (stu.avatar || fallbackAvatar(stu.displayName)) : fallbackAvatar('?');
    const avatarFallback = stu ? fallbackAvatar(stu.displayName) : fallbackAvatar('?');

        `<div class="msg-item" data-item-id="${escapeHtml(it.id)}">${itemHtml(it)}</div>`
    ).join('');

        `<img class="box-avatar" src="${escapeHtml(avatar)}" data-fallback="${escapeHtml(avatarFallback)}"
              referrerpolicy="no-referrer" alt="">`;
    const nameHtml = isSensei ? '' : `<div class="box-name">${escapeHtml(studentName)}</div>`;

    return `<div class="msg-box ${isSensei ? 'sensei' : 'student'}" data-box-id="${escapeHtml(box.id)}">
        ${avatarHtml}
        <div class="box-body">
            ${nameHtml}
            <div class="box-items">${itemsHtml}</div>
        </div>
    </div>`;
}

function itemHtml(it) {
    if (it.type === 'image') {
        return `<div class="msg-image-wrapper">
            <img class="msg-image" src="${escapeHtml(it.src)}" data-fallback="${escapeHtml(brokenImage())}"
                 referrerpolicy="no-referrer" alt="img" loading="lazy">
        </div>`;
    }
    if (it.type === 'emoji') {
        return `<div class="emoji-bubble">
            <img class="emoji-img" src="${escapeHtml(it.src)}" data-fallback="${escapeHtml(brokenImage())}"
                 referrerpolicy="no-referrer" alt="" loading="lazy">
        </div>`;
    }
    if (it.type === 'reply') {
        return `<div class="reply-panel">
            <div class="reply-label"><span class="reply-bar"></span>${escapeHtml(it.title || T('replyTitle', null, '回复'))}</div>
            <div class="reply-inner">${escapeHtml(it.text)}</div>
        </div>`;
    }
    if (it.type === 'story') {
        return `<div class="story-panel">
            <div class="story-label"><span class="story-bar"></span>${escapeHtml(it.title || T('storyTitle', null, '好感故事'))}</div>
            <div class="story-btn">${escapeHtml(it.text)}</div>
        </div>`;
    }
    return `<div class="msg-bubble">${escapeHtml(it.text)}</div>`;
}

function renderChat() {
    if (!currentStudentId) return;
    if (playback) return;
    const stu = currentStudent();
    if (!stu) return;

    const container = document.getElementById('chat-content');
    const boxes = chatBoxes();

    if (!boxes.length) {
        const intro = (stu.introduction || '').trim();
        container.innerHTML = `<div class="empty-tip" style="margin-top:40px;">
            ${escapeHtml(T('chatEmpty', { name: stu.displayName }, '与 {name} 的聊天从这里开始'))}
            ${intro ? `<div style="margin-top:12px;font-size:13px;color:#bbb;line-height:1.7;white-space:pre-wrap;">${escapeHtml(intro)}</div>` : ''}
        </div>`;
        return;
    }

    container.innerHTML = boxes.map(boxHtml).join('');
    bindImageAutoScroll(container);
    scrollChatToBottom(container);
}

// 图片是懒加载/异步加载的：加载完成后如果用户仍在底部附近，就继续贴底，
// 否则（用户正在往上翻）不要打扰。
function bindImageAutoScroll(container) {
    container.querySelectorAll('img').forEach(img => {
        if (img.complete) return;
        img.addEventListener('load', () => {
            if (!currentStudentId || playback) return;
            const remain = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (remain < 200) container.scrollTop = container.scrollHeight;
        }, { once: true });
    });
}

/* ================= 发送 / 追加 ================= */

function commitSendText(text, append) {
    if (!currentStudentId) return;
    const boxes = chatBoxes();
    if (append && boxes.length) {
        const box = boxes[boxes.length - 1];
        box.items.push(newItem('text', { text: text }));
        box.time = now();
    } else {
        const box = emptyBox(currentRole);
        box.items.push(newItem('text', { text: text }));
        boxes.push(box);
    }
    saveChats();
    renderChat();
}

function sendMessage(mode) {
    if (!currentStudentId || playback) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    closeMorePanel();

    const boxes = chatBoxes();
    const append = mode === 'append';

    if (append && boxes.length) {
        const last = boxes[boxes.length - 1];
        if (last.role !== currentRole) {
            const stu = currentStudent();
            const lastLabel = last.role === 'sensei'
                ? T('roleSensei', null, '老师')
                : (stu ? stu.shortName : T('roleStudent', null, '学生'));
            const curLabel = currentRole === 'sensei'
                ? T('roleSensei', null, '老师')
                : (stu ? stu.shortName : T('roleStudent', null, '学生'));
            showModal(T('appendMismatchTitle', null, '发送者不一致'),
                `<div style="font-size:13px;color:#666;line-height:1.8;text-align:left;">
                    ${escapeHtml(T('appendMismatchBody', { last: lastLabel, cur: curLabel },
                        '上一个信息盒子来自 {last}，当前身份是 {cur}。要怎么做？'))}
                </div>`, [
                    {
                        text: T('appendNewBox', null, '新建盒子'), class: 'cancel',
                        onClick: () => {
                            closeModal();
                            input.value = '';
                            input.style.height = 'auto';
                            commitSendText(text, false);
                        }
                    },
                    {
                        text: T('appendConvert', null, '改身份并追加'), class: 'confirm',
                        onClick: () => {
                            closeModal();
                            last.role = currentRole;
                            input.value = '';
                            input.style.height = 'auto';
                            commitSendText(text, true);
                        }
                    }
                ]);
            return;
        }
    }

    input.value = '';
    input.style.height = 'auto';
    commitSendText(text, append && boxes.length > 0);
}

function handleKeyDown(e) {
    // 中文/日文输入法组字过程中按回车是"确认候选词"，不能当作发送
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage('new');
    }
}

function compressImage(dataUrl, maxSide, quality) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                let w = img.naturalWidth || img.width;
                let h = img.naturalHeight || img.height;
                if (!w || !h) throw new Error('图片尺寸无效');
                const scale = Math.min(1, maxSide / Math.max(w, h));
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('图片解析失败'));
        img.src = dataUrl;
    });
}

function onLocalImage(event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type || '')) {
        showToast(T('localImageInvalid', null, '请选择图片文件'));
        return;
    }
    const reader = new FileReader();
    reader.onload = function (e) {
        compressImage(String(e.target.result), 800, 0.72).then(dataUrl => {
            if (!currentStudentId) return;
            const box = emptyBox(currentRole);
            box.items.push(newItem('image', { src: dataUrl }));
            chatBoxes().push(box);
            saveChats();
            renderChat();
            closeMorePanel();
        }).catch(err => {
            console.error('图片处理失败：', err);
            showToast(T('localImageFail', null, '图片处理失败'));
        });
    };
    reader.onerror = () => showToast(T('localImageFail', null, '图片读取失败'));
    reader.readAsDataURL(file);
}

/* ================= 长按信息盒子：编辑面板 ================= */

function findBox(boxId) {
    return chatBoxes().find(b => b.id === boxId) || null;
}

function findItem(box, itemId) {
    return box ? (box.items.find(it => it.id === itemId) || null) : null;
}

function openBoxEditor(boxId) {
    if (!currentStudentId || playback) return;
    const boxes = chatBoxes();
    const idx = boxes.findIndex(b => b.id === boxId);
    if (idx < 0) return;
    const box = boxes[idx];
    const stu = currentStudent();
    const isSensei = box.role === 'sensei';
    const senderName = isSensei
        ? T('roleSensei', null, '老师')
        : (stu ? stu.displayName : T('roleStudent', null, '学生'));

    const itemsHtml = box.items.map((it, i) => `
        <div class="box-edit-row" data-item-id="${escapeHtml(it.id)}">
            <span class="box-edit-type">${escapeHtml(itemTypeLabel(it.type))}</span>
            <span class="box-edit-preview">${escapeHtml(itemPreview(it))}</span>
            ${canEditItem(it.type)
                ? `<button class="box-edit-op" type="button" data-op="edit" data-index="${i}">${escapeHtml(T('itemEdit', null, '编辑'))}</button>`
                : ''}
            <button class="box-edit-op danger" type="button" data-op="del" data-index="${i}">${escapeHtml(T('itemDelete', null, '删除'))}</button>
        </div>
    `).join('');

    const html = `
        <div class="box-edit-meta">
            ${escapeHtml(senderName)} · ${escapeHtml(T('boxItemCount', { n: box.items.length }, '共 {n} 条信息'))}
        </div>
        <div class="box-edit-list" id="box-edit-list">${itemsHtml}</div>
        <div class="box-edit-actions">
            <button class="box-action-btn" type="button" data-action="append">＋ ${escapeHtml(T('boxAppend', null, '追加信息'))}</button>
            <button class="box-action-btn" type="button" data-action="sender">${escapeHtml(T('boxChangeSender', null, '更换发送者'))}</button>
            <button class="box-action-btn" type="button" data-action="up" ${idx === 0 ? 'disabled' : ''}>↑ ${escapeHtml(T('boxMoveUp', null, '上移'))}</button>
            <button class="box-action-btn" type="button" data-action="down" ${idx === boxes.length - 1 ? 'disabled' : ''}>↓ ${escapeHtml(T('boxMoveDown', null, '下移'))}</button>
            <button class="box-action-btn danger" type="button" data-action="delete" style="grid-column:1 / -1;">${escapeHtml(T('boxDelete', null, '删除信息盒子'))}</button>
        </div>`;

    showModal(T('boxEditTitle', null, '信息盒子'), html, [
        { text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }
    ]);

    const body = document.getElementById('modal-body');
    body.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => {
            const i = Number(btn.dataset.index);
            const it = box.items[i];
            if (!it) return;
            if (btn.dataset.op === 'edit') {
                if (it.type === 'reply') openReplyEditor(box.id, it.id);
                else if (it.type === 'story') openStoryEditor(box.id, it.id);
                else openTextItemEditor(box.id, it.id);
            } else {
                confirmModal(T('itemDeleteTitle', null, '删除信息'),
                    escapeHtml(T('itemDeleteConfirm', null, '确定删除这条信息吗？')),
                    () => {
                        const realBox = findBox(box.id);
                        if (!realBox) { closeModal(); return; }
                        const at = realBox.items.findIndex(x => x.id === it.id);
                        if (at >= 0) realBox.items.splice(at, 1);
                        if (!realBox.items.length) {
                            const arr = chatBoxes();
                            const bi = arr.findIndex(b => b.id === realBox.id);
                            if (bi >= 0) arr.splice(bi, 1);
                            saveChats();
                            renderChat();
                            closeModal();
                            return;
                        }
                        realBox.time = now();
                        saveChats();
                        renderChat();
                        openBoxEditor(realBox.id);
                    });
            }
        });
    });
    body.querySelectorAll('[data-action]').forEach(btn => {
        const action = btn.dataset.action;
        if (btn.disabled) return;
        btn.addEventListener('click', () => {
            const arr = chatBoxes();
            const bi = arr.findIndex(b => b.id === box.id);
            if (bi < 0) { closeModal(); return; }
            const b = arr[bi];
            if (action === 'append') {
                openAppendEditor(b.id);
            } else if (action === 'sender') {
                b.role = b.role === 'sensei' ? 'student' : 'sensei';
                b.time = now();
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'up' && bi > 0) {
                arr.splice(bi - 1, 0, arr.splice(bi, 1)[0]);
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'down' && bi < arr.length - 1) {
                arr.splice(bi + 1, 0, arr.splice(bi, 1)[0]);
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'delete') {
                confirmModal(T('boxDeleteTitle', null, '删除信息盒子'),
                    escapeHtml(T('boxDeleteConfirm', null, '确定删除这个信息盒子吗？')),
                    () => {
                        const realArr = chatBoxes();
                        const at = realArr.findIndex(x => x.id === box.id);
                        if (at >= 0) realArr.splice(at, 1);
                        saveChats();
                        renderChat();
                        closeModal();
                    });
            }
        });
    });
}

    const html = `<textarea class="modal-input" id="item-text-input">${escapeHtml(item.text || '')}</textarea>`;
