<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" id="favicon" type="image/png" href="./resources/MomoTalk_favicon.png">
<link rel="shortcut icon" id="favicon-shortcut" type="image/png" href="./resources/MomoTalk_favicon.png">
<link rel="apple-touch-icon" id="apple-touch-icon">
<meta name="theme-color" content="#f08a9c">
<title>MomoTalk - 自定义聊天</title>
<link rel="stylesheet" href="./resources/momotalk.css">
</head>
<body>

<div class="app-container">

    <div id="list-page">
        <div class="header">
            <div class="header-logo">
                <a href="./index.html"> <img id="app-icon" class="logo-img" alt="" referrerpolicy="no-referrer" style="display:none;"> </a>
                <span id="app-name"></span>
            </div>
            <div class="header-tools">
                <button class="tool-btn" id="btn-groups" onclick="openGroupManager()"></button>
                <button class="tool-btn" id="btn-import" onclick="document.getElementById('file-import').click()"></button>
                <button class="tool-btn" id="btn-export" onclick="exportData()"></button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="search-input" placeholder="" oninput="onSearch()">
        </div>

        <div class="contact-list" id="contact-list">
            <div class="loading-tip"><div class="spinner"></div><span id="loading-text"></span></div>
        </div>

        <input type="file" id="file-import" accept=".json" style="display: none;" onchange="importData(event)">
    </div>

    <div id="chat-page">
        <div class="chat-header">
            <div class="back-btn" onclick="closeChat()">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </div>
            <div class="chat-header-info">
                <img id="chat-header-avatar" class="chat-header-avatar" alt="avatar" referrerpolicy="no-referrer">
                <div id="chat-header-name" class="chat-header-name"></div>
                <span id="chat-mode-badge" class="chat-header-mode" style="display:none;"></span>
            </div>
            <div class="chat-header-tools">
                <button class="chat-tool-btn" id="btn-export-chat" onclick="exportCurrentChat()" title="导出">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v9.17l3.59-3.58L18 10l-6 6-6-6 1.41-1.41L11 12.17V3ZM5 19h14v2H5v-2Z"/></svg>
                    <span id="btn-export-chat-text"></span>
                </button>
                <button class="chat-tool-btn" id="btn-play" onclick="togglePlayback()" title="播放">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <span id="btn-play-text"></span>
                </button>
                <button class="chat-tool-btn" id="btn-screenshot" onclick="takeScreenshot()" title="截图">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.4 4h5.2l1.5 2H20c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2h3.9l1.5-2ZM12 8.5A4.2 4.2 0 1 0 12 16.9a4.2 4.2 0 0 0 0-8.4Zm0 1.8a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 0 1 0-4.8Z"/></svg>
                    <span id="btn-screenshot-text"></span>
                </button>
            </div>
        </div>

        <div class="playback-bar hidden" id="playback-bar">
            <span class="playback-indicator"></span>
            <span id="playback-progress"></span>
            <button class="playback-stop" id="btn-playback-stop" onclick="stopPlayback()"></button>
        </div>

        <div class="chat-content" id="chat-content"></div>

        <div class="chat-input-area" id="chat-input-area">
            <div class="input-row">
                <div class="role-switch sensei" id="role-switch" onclick="toggleRole()">
                    <span id="role-text"></span>
                </div>
                <textarea class="chat-input" id="chat-input" rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="round-btn" id="btn-more" onclick="toggleMorePanel(event)" title="更多">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
                </button>
                <button class="send-btn" id="send-btn" onclick="sendMessage('new')"></button>
                <button class="append-btn" id="append-btn" onclick="sendMessage('append')"></button>
            </div>
            <div class="chat-more-panel" id="more-panel">
                <div class="more-tiles" id="more-tiles">
                    <button class="more-tile" data-action="emoji" onclick="onMoreAction('emoji')">
                        <span class="more-tile-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true" class="emoji-tile-svg">
                                <circle cx="12" cy="12" r="9.2" fill="none" stroke="#4c4c4c" stroke-width="1.9"/>
                                <ellipse cx="8.7" cy="9.9" rx="1.25" ry="1.45" fill="#4c4c4c"/>
                                <ellipse cx="15.3" cy="9.9" rx="1.25" ry="1.45" fill="#4c4c4c"/>
                                <path d="M7.9 13.4h8.2a4.1 4.1 0 0 1-8.2 0Z" fill="none" stroke="#4c4c4c" stroke-width="1.9" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="more-tile-label" id="more-label-emoji"></span>
                    </button>
                    <button class="more-tile" data-action="image" onclick="onMoreAction('image')">
                        <span class="more-tile-icon">

                        </span>
                        <span class="more-tile-label" id="more-label-image"></span>

                    </button>

                <div class="about-card">

<script src="./resources/chat_screenshot.js"></script>

<script>
const DATAS_URL = './resources/running_datas.json';

let CONFIG = {
    app: {}, storage: {}, about: {}, contact: {}, donate: {}, texts: {}
};
let configLoaded = false;

function deepMerge(target, source) {
    if (!source || typeof source !== 'object') return target;
    Object.keys(source).forEach(k => {
        const sv = source[k];
        if (sv && typeof sv === 'object' && !Array.isArray(sv)) {
            if (!target[k] || typeof target[k] !== 'object') target[k] = {};
            deepMerge(target[k], sv);
        } else {
            target[k] = sv;
        }
    });
    return target;
}

function normalizeConfig() {
    const a = CONFIG.about || (CONFIG.about = {});
    if (!a.developerName && a.authorName) a.developerName = a.authorName;
    if (!a.developerAvatar && a.authorAvatar) a.developerAvatar = a.authorAvatar;
    if (!a.developerUrl && a.xiaohongshuUrl) a.developerUrl = a.xiaohongshuUrl;
}

function T(key, vars, fallback) {
    const t = (CONFIG.texts && CONFIG.texts[key]) || fallback || key;
    if (vars) {
        return String(t).replace(/\{(\w+)\}/g, (m, k) =>
            vars[k] != null ? vars[k] : m);
    }
    return t;
}

let library = [];
let libraryById = {};
let libraryReady = false;

let studentsBaseUrl = new URL('./resources/students.json', location.href).href;

let myStudents = [];
let customStudents = [];
let pendingCustomAvatar = '';
let pendingCustomDiffs = [];      // 待添加自定义学生的表情差分：[{ n, src(dataURL) }]
let chats = {};
let groups = [];                  // 聊天分组：[{ id, name, order }]
let progressMap = {};             // 播放模式进度：{ [chatId]: { boxIndex, itemIndex, choices, finished, updatedAt } }

// 教程视频（resources/video.json）与本地设置（默认跳转视频网站等）
let videos = [];
let videosLoaded = false;
let videosLoading = false;
let videosError = null;
const VIDEO_SITES = ['channels', 'xiaohongshu'];
let settings = { defaultVideoSite: 'channels', animationTime: 1000, autoBackup: false };

let currentStudentId = null;
let currentRole = 'sensei';
let searchQuery = '';
let longPressFired = false;
let pressTimer = null;
let once_wrong = false;

const reportedImageErrors = new Set();

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function pickString(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number') return String(v);
    if (Array.isArray(v)) {
        for (let i = 0; i < v.length; i++) {
            const t = pickString(v[i]);
            if (t) return t;
        }
        return '';
    }
    if (typeof v === 'object') {
        const keys = ['url', 'Url', 'URL', 'src', 'path', 'cn', 'zh', 'zh_cn', 'nm', 'value', 'text'];
        for (let i = 0; i < keys.length; i++) {
            if (v[keys[i]] != null) {
                const t = pickString(v[keys[i]]);
                if (t) return t;
            }
        }
    }
    return '';
}

function normalizeAvatar(url) {
    let u = pickString(url);
    if (!u) return '';
    if (u.startsWith('data:')) return u;
    u = u.replace(/\\/g, '/');
    // 学生库里 615/796 个头像指向 static.kivo.fun：该域名的 HTTP 入口返回 404，
    // HTTPS 证书又与域名不匹配（浏览器会直接拦截），而同一路径在 static.kivo.wiki 上可用。
    // 这里统一把主机名迁移到可用域名，避免 259 名学生头像全部退化成首字母兜底图。
    u = u.replace(/^\/\/static\.kivo\.fun\//i, '//static.kivo.wiki/')
        .replace(/^https?:\/\/static\.kivo\.fun\//i, 'https://static.kivo.wiki/');
    if (u.startsWith('//')) {
        return (location.protocol === 'https:' ? 'https:' : 'http:') + u;
    }
    if (location.protocol === 'https:' && /^http:\/\//i.test(u)) {
        u = 'https://' + u.slice(7);
    }
    return u;
}

// 学生库里有 3 条 introduction 带 HTML（<br>、<span class="md-hover-text">），
// 直接 escapeHtml 会把标签原样显示成文字，这里先转成纯文本。
function stripHtml(s) {
    return String(s == null ? '' : s)
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p\s*>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/gi, '&');
}

function pickAvatarUrl() {
    for (let i = 0; i < arguments.length; i++) {
        const u = normalizeAvatar(arguments[i]);

}

// students.json 的 gallery 里保存了学生的「立绘差分 / 表情差分」等图片，按标题分组
function normalizeGallery(rawGallery) {
    if (!Array.isArray(rawGallery)) return [];
    const all = [];
    const preferred = [];
    rawGallery.forEach(entry => {
        if (!entry || typeof entry !== 'object') return;
        const title = pickString(entry.title) || T('diffUntitled', null, '立绘差分');
        const images = [];
        const seen = new Set();
        (Array.isArray(entry.images) ? entry.images : []).forEach(u => {
            const src = normalizeAvatar(u);
            if (src && !seen.has(src)) {
                seen.add(src);
                images.push(src);
            }
        });
        if (!images.length) return;
        const item = { title: title, images: images };
        all.push(item);
        // 「表情差分」优先取标题里带“差分/表情”的图集；没有这类图集时回退到全部图集
        if (/差分|表情/.test(title)) preferred.push(item);
    });
    return preferred.length ? preferred : all;
}

function pickDescription(raw) {
    if (!raw || typeof raw !== 'object') return '';
    const keys = [
        'introduction', 'Introduction',
        'description', 'Description',
        'profile', 'Profile',
        'intro', 'Intro',
        'desc', 'Desc',
        'bio', 'Bio'
    ];
    for (let i = 0; i < keys.length; i++) {
        if (raw[keys[i]] != null) {
            const t = pickString(raw[keys[i]]);
            if (t) return stripHtml(t);
        }
    }
    return '';
}

const _fallbackCache = new Map();
function fallbackAvatar(name) {
    const key = String(name || '?');
    if (_fallbackCache.has(key)) return _fallbackCache.get(key);
    const ch = key.charAt(0) || '?';
    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">` +
        `<rect width="64" height="64" fill="#e8e8e8"/>` +
        `<text x="32" y="41" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#999">${escapeHtml(ch)}</text>` +
        `</svg>`;
    const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    _fallbackCache.set(key, uri);
    return uri;
}

function brokenImage() {

}

document.addEventListener('error', function (e) {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;

    const curSrc = img.getAttribute('src') || '';
    if (!curSrc || curSrc.startsWith('data:')) return;

    const fallback = img.dataset.fallback;
    if (fallback && curSrc === fallback) return;

    let retries = parseInt(img.dataset.retries || '0', 10);

    if (retries === 0) {
        img.dataset.retries = '1';
        let newSrc = curSrc;

        newSrc = newSrc.replace(/\/resources\/resources\//gi, '/resources/');

        if (!/^(http|\/\/|data:|blob:)/i.test(newSrc)) {
            if (!newSrc.includes('/resources/') && !newSrc.includes('resources/')) {
                try {
                    newSrc = new URL(newSrc, studentsBaseUrl).href;
                } catch (err) {}
            }
        }

        if (newSrc !== curSrc) {
            img.setAttribute('src', newSrc);
            return;
        }

        const curPolicy = img.getAttribute('referrerpolicy');
        const newPolicy = curPolicy === 'no-referrer' ? 'no-referrer-when-downgrade' : 'unsafe-url';
        img.setAttribute('referrerpolicy', newPolicy);

        img.removeAttribute('src');
        setTimeout(() => { img.setAttribute('src', curSrc); }, 10);
        return;
    }

    if (retries >= 1 && fallback) {
        img.removeAttribute('data-fallback');
        img.setAttribute('src', fallback);

        if (!reportedImageErrors.has(curSrc) && !once_wrong) {
            once_wrong = true;
            reportedImageErrors.add(curSrc);

            showModal(T('imgErrorTitle', null, '图片加载失败'), `
                <div style="font-size:14px;color:#d85c76;margin-bottom:12px;font-weight:bold;word-break:break-all;">
                    ${escapeHtml(T('imgErrorRes', null, '错误资源：'))}${escapeHtml(curSrc)}
                </div>
                <div style="font-size:13px;color:#666;line-height:1.6;text-align:left;">
                    ${escapeHtml(T('imgErrorReasons', null, '可能的原因：服务器文件不存在、路径配置错误、跨域限制或图片损坏。'))}
                </div>
            `, [
                { text: T('imgErrorOk', null, '知道了'), class: 'confirm', onClick: closeModal }
            ]);
        }
    }
}, true);

function isImageUrl(text) {
    if (!text) return false;
    let t = text.trim();
    if (t.startsWith('data:image/')) return true;
    // students.json 里的头像大量使用协议相对 URL（//host/path.png），
    // 这里与 normalizeAvatar 保持一致：先补全协议再判断，否则粘贴这类链接会被当成纯文本。
    if (t.startsWith('//')) t = 'https:' + t;
    if (!/^https?:\/\//i.test(t)) return false;
    return /\.(jpe?g|gif|png|webp|svg|bmp|ico)(\?.*)?(#.*)?$/i.test(t);
}

function renderCredits(credits) {
    if (!Array.isArray(credits) || !credits.length) return '';
    return credits.map(member => {
        if (!member || typeof member !== 'object') return '';
        const name = pickString(member.name || member.developerName);
        if (!name) return '';
        const role = pickString(member.role || member.job || member.contribution);
        const avatar = normalizeAvatar(member.avatar || member.avatarUrl) || fallbackAvatar(name);
        const url = safeUrl(member.url || member.link);
        const inner = `
            <img class="credit-avatar" src="${escapeHtml(avatar)}"
                 data-fallback="${escapeHtml(fallbackAvatar(name))}"
                 referrerpolicy="no-referrer" alt="">
            <div class="credit-info">
                <div class="credit-name">${escapeHtml(name)}</div>
                ${role ? `<div class="credit-role">${escapeHtml(role)}</div>` : ''}
            </div>
            ${url ? '<span class="more-arrow">›</span>' : ''}`;
        if (!url) return `<div class="credit-item">${inner}</div>`;
        return `<a class="credit-item" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }).join('');
}

function settingsKey() { return (CONFIG.storage && CONFIG.storage.settingsKey) || 'momotalk_settings_v1'; }

function normalizeVideoSite(v) {
    return VIDEO_SITES.indexOf(v) >= 0 ? v : 'channels';
}

function defaultVideoSite() {
    const d = CONFIG.tutorial && CONFIG.tutorial.defaultSite;
    return VIDEO_SITES.indexOf(d) >= 0 ? d : 'channels';
}

function clampAnimationTime(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return 1000;
    return Math.max(700, Math.min(2000, Math.round(n / 50) * 50));
}

function loadSettings() {
    settings = {
        defaultVideoSite: defaultVideoSite(),
        animationTime: 1000,
        autoBackup: false
    };
    try {
        const raw = localStorage.getItem(settingsKey());
        if (!raw) return;
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
            if (obj.defaultVideoSite) settings.defaultVideoSite = normalizeVideoSite(obj.defaultVideoSite);
            if (obj.animationTime != null) settings.animationTime = clampAnimationTime(obj.animationTime);
            settings.autoBackup = !!obj.autoBackup;
        }
    } catch (e) { console.error('读取设置失败：', e); }
}

function saveSettings() {
    try {
        localStorage.setItem(settingsKey(), JSON.stringify(settings));
        return true;
    } catch (e) {
        console.error('保存设置失败：', e);
        return false;
    }
}

function updateSettingsUI() {
    const range = document.getElementById('anim-time-range');
    const val = document.getElementById('anim-time-value');
    const num = document.getElementById('anim-time-input');
    if (range) range.value = String(settings.animationTime);
    if (val) val.textContent = settings.animationTime + 'ms';
    if (num) num.value = String(settings.animationTime);

    const preview = document.getElementById('anim-preview');
    if (preview) preview.style.setProperty('--typing-dur', settings.animationTime + 'ms');

    const sw = document.getElementById('auto-backup-switch');
    if (sw) sw.checked = !!settings.autoBackup;
}

function setAnimationTime(v) {
    settings.animationTime = clampAnimationTime(v);
    saveSettings();
    updateSettingsUI();
}

// 学生设置里允许直接用键盘输入动画速度（失焦/回车时生效并夹到 700~2000）
function setAnimationTimeFromInput(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) {
        updateSettingsUI();
        return;
    }
    setAnimationTime(n);
}

function setAutoBackup(on) {
    const prev = settings.autoBackup;
    settings.autoBackup = !!on;
    if (!saveSettings()) {
        settings.autoBackup = prev;
        updateSettingsUI();
        return;
    }
    updateSettingsUI();
}

                // 2) 顺带清掉所有 momotalk_ 前缀的历史遗留 key
                const leftovers = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && /^momotalk_/i.test(k)) leftovers.push(k);
                }
                leftovers.forEach(k => localStorage.removeItem(k));
            } catch (e) {
                console.error('删除本地数据失败：', e);
            }
            location.reload();
        });
}

/* ================= 教程视频（resources/video.json） ================= */
function tutorialUrl() {
    return (CONFIG.tutorial && CONFIG.tutorial.url) || './resources/video.json';
}

// 只放行 http(s) / 协议相对链接，避免 video.json / 配置里出现 javascript: 之类的地址
function safeUrl(u) {
    let s = pickString(u);
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    if (s.startsWith('//')) {
        return (location.protocol === 'https:' ? 'https:' : 'http:') + s;
    }
    return '';
}

function normalizeVideos(data) {
    let list = [];
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object' && Array.isArray(data.videos)) list = data.videos;

    const out = [];
    list.forEach((item, i) => {
        if (!item || typeof item !== 'object') return;
        const links = (item.links && typeof item.links === 'object') ? item.links : item;
        const channels = safeUrl(links.channels || links.wechat || links.shipinhao || links.videoAccount);
        const xhs = safeUrl(links.xiaohongshu || links.redbook || links.xhs || links.red);
        let title = pickString(item.title || item.name);
        let description = pickString(item.description || item.desc || item.text || item.intro);
        if (!description) description = title;
        // 只有 title 没有 description 时，避免同一段文字渲染两遍
        if (title && title === description) title = '';
        if (!description) return;
        out.push({
            id: pickString(item.id) || ('video-' + (i + 1)),
            title: title,
            description: description,
            links: { channels: channels, xiaohongshu: xhs }
        });
    });
    return out;
}

async function loadVideos(force) {
    if (videosLoading) return;
    if (videosLoaded && !force) return;
    videosLoading = true;
    videosError = null;
    renderTutorialList();
    try {
        const res = await fetch(tutorialUrl(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        videos = normalizeVideos(await res.json());
        videosLoaded = true;
    } catch (e) {
        console.error('video.json 加载失败：', e);
        videos = [];
        videosError = e;
    } finally {
        videosLoading = false;
        renderTutorialList();
    }
}

// 按「默认跳转视频网站」选链接；当前网站没有该视频时自动回退到另一个网站
function pickVideoLink(v) {
    const first = settings.defaultVideoSite;
    const second = first === 'channels' ? 'xiaohongshu' : 'channels';
    if (v.links[first]) return { url: v.links[first], site: first };
    if (v.links[second]) return { url: v.links[second], site: second };
    return { url: '', site: '' };
}

function renderTutorialList() {
    const box = document.getElementById('tutorial-list');
    const empty = document.getElementById('tutorial-empty');
    if (!box || !empty) return;

    if (videosLoading) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `<div class="loading-tip" style="height:auto;padding:24px 0;">
            <div class="spinner"></div><span>${escapeHtml(T('tutorialLoading', null, '正在读取教程…'))}</span></div>`;
        return;
    }
    if (videosError) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `
            <div style="font-size:14px;color:#666;margin-bottom:8px;">${escapeHtml(T('tutorialErrorTitle', null, '无法读取教程内容'))}</div>
            <div style="font-size:12px;color:#aaa;line-height:1.7;">${escapeHtml(T('tutorialErrorHint', null, '请确认 resources/video.json 存在且可访问。'))}<br>${escapeHtml(tutorialUrl())}</div>
            <button onclick="loadVideos(true)">${escapeHtml(T('tutorialReload', null, '重新读取'))}</button>`;
        return;
    }
    if (!videos.length) {
        box.innerHTML = '';
        box.style.display = 'none';
        empty.style.display = '';
        empty.innerHTML = `${escapeHtml(T('tutorialEmpty', null, '暂无教程内容'))}<br><span style="font-size:12px;color:#c4c4c4;">${escapeHtml(T('tutorialEmptyHint', null, '在 resources/video.json 中填入视频后刷新即可显示'))}</span>`;
        return;
    }

    empty.style.display = 'none';
    box.style.display = '';
    const missing = escapeHtml(T('tutorialLinkMissing', null, '暂无链接'));
    box.innerHTML = videos.map(v => {
        const link = pickVideoLink(v);
        const title = v.title ? `<div class="tutorial-title">${escapeHtml(v.title)}</div>` : '';
        const desc = `<div class="tutorial-desc">${escapeHtml(v.description)}</div>`;
        if (!link.url) {
            return `<div class="tutorial-item disabled">
                <div class="tutorial-info">${title}${desc}</div>
                <span class="tutorial-site muted">${missing}</span>
            </div>`;
        }
        // 只展示默认视频网站的那一个链接，点击文字介绍即跳转
        return `<a class="tutorial-item" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
            <div class="tutorial-info">${title}${desc}</div>
            <span class="tutorial-site">${escapeHtml(siteLabel(link.site))}</span>
            <span class="tutorial-arrow">›</span>
        </a>`;
    }).join('');
}

function expandStudents(rawList) {
    const result = [];
    const usedIds = new Set();

    rawList.forEach(raw => {
        const baseId = Number(raw && raw.id);
        if (!Number.isFinite(baseId)) return;

        const givenCn = (raw.givenName && (raw.givenName.cn || raw.givenName.nm)) || '';
        const familyCn = (raw.familyName && (raw.familyName.cn || raw.familyName.nm)) || '';
        const fullName = buildDisplayName(familyCn, givenCn) || ('学生#' + baseId);
        const shortName = givenCn || familyCn || fullName;

        const introduction = pickDescription(raw);
        const gallery = normalizeGallery(raw.gallery);

        const familyName = raw.familyName || {};
        const givenName = raw.givenName || {};

        const baseAvatar = pickAvatarUrl(
            raw.avatar, raw.avatarUrl, raw.avatar_url, raw.avatarURL,
            raw.portrait, raw.portraitUrl,
            raw.image, raw.imageUrl,
            raw.icon, raw.iconUrl
        );

        const skinList = Array.isArray(raw.skinList) ? raw.skinList : [];

        let mainSkinIndex = -1;
        for (let i = 0; i < skinList.length; i++) {
            const s = skinList[i];
            const skinName = String((s && (s.skin_cn || s.skin)) || '').trim();
            if (!skinName) { mainSkinIndex = i; break; }
        }

        let mainAvatar = baseAvatar;
        if (mainSkinIndex >= 0) {
            const ms = skinList[mainSkinIndex];
            mainAvatar = pickAvatarUrl(
                ms && ms.avatar, ms && ms.avatarUrl, ms && ms.avatar_url,
                ms && ms.portrait, ms && ms.portraitUrl,
                ms && ms.image, ms && ms.imageUrl,
                baseAvatar
            ) || baseAvatar;
        }

        let mainId = baseId;
        while (usedIds.has(mainId)) mainId = mainId * 100 + 1;
        usedIds.add(mainId);

        result.push({
            id: mainId,
            baseId: baseId,
            skinIndex: mainSkinIndex,
            displayName: fullName,
            shortName: shortName,
            avatar: mainAvatar,
            introduction: introduction,
            familyName: familyName,
            givenName: givenName,
            gallery: gallery,
            skinName: '',
            searchText: [fullName, familyCn, givenCn].filter(Boolean).join(' ').toLowerCase()
        });

        skinList.forEach((skin, idx) => {
            if (idx === mainSkinIndex) return;
            const skinName = String((skin && (skin.skin_cn || skin.skin)) || '').trim();
            if (!skinName) return;

            let entryId = baseId * 100 + idx;
            let guard = 0;
            while ((usedIds.has(entryId) || entryId === mainId) && guard < 20) {
                entryId = entryId * 100 + 1;
                guard++;
            }
            if (usedIds.has(entryId)) return;
            usedIds.add(entryId);

            const skinAvatar = pickAvatarUrl(
                skin && skin.avatar, skin && skin.avatarUrl, skin && skin.avatar_url,
                skin && skin.portrait, skin && skin.portraitUrl,
                skin && skin.image, skin && skin.imageUrl,
                baseAvatar
            ) || baseAvatar;
            const displayName = fullName + '（' + skinName + '）';

            result.push({
                id: entryId,
                baseId: baseId,
                skinIndex: idx,
                displayName: displayName,
                shortName: shortName,
                avatar: skinAvatar,
                introduction: introduction,
                familyName: familyName,
                givenName: givenName,
                gallery: gallery,
                skinName: skinName,
                searchText: [fullName, skinName, familyCn, givenCn].filter(Boolean).join(' ').toLowerCase()
            });
        });
    });

    // 学生库里存在同名条目（例如两个「？？？」占位角色），列表/选择器里无法区分，
    // 这里给重名的条目补上 #id 后缀（只影响重名项）。
    const nameCount = {};
    result.forEach(s => { nameCount[s.displayName] = (nameCount[s.displayName] || 0) + 1; });
    result.forEach(s => {
        if (nameCount[s.displayName] > 1) {
            s.displayName = s.displayName + '（#' + s.id + '）';
            s.searchText = (s.searchText + ' #' + s.id).toLowerCase();
        }
    });

    return result;
}

/* ================= 自定义学生（学生设置里添加） ================= */

function customStudentsKey() { return (CONFIG.storage && CONFIG.storage.customStudentsKey) || 'momotalk_custom_students_v1'; }

function normalizeCustomStudents(raw) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    const used = new Set();
    raw.forEach(item => {
        if (!item || typeof item !== 'object') return;
        const id = Number(item.id);
        const name = pickString(item.name != null ? item.name : item.displayName);
        if (!Number.isFinite(id) || id <= 0 || !name || used.has(id)) return;
        used.add(id);

        // 表情差分：按编号保存（编号方式「学生姓名/001.jpg … xxx.jpg」，从 001 开始）
        const diffs = [];
        if (Array.isArray(item.diffs)) {
            item.diffs.forEach(d => {
                if (!d || typeof d !== 'object') return;
                const n = Number(d.n);
                const src = pickString(d.src);
                if (!Number.isFinite(n) || n < 1 || !src) return;
                if (diffs.some(x => x.n === n)) return;
                diffs.push({ n: n, src: src });
            });
            diffs.sort((a, b) => a.n - b.n);
        }

        let diffRange = null;
        if (item.diffRange && typeof item.diffRange === 'object') {
            const s = Number(item.diffRange.start);
            const e = Number(item.diffRange.end);
            if (Number.isFinite(s) && Number.isFinite(e) && s >= 1 && e >= s) {
                diffRange = { start: s, end: e };
            }
        }
        if (!diffRange && diffs.length) {
            diffRange = { start: diffs[0].n, end: diffs[diffs.length - 1].n };
        }

        out.push({
            id: id,
            name: name,
            avatar: pickString(item.avatar),
            diffs: diffs,
            diffRange: diffRange
        });
    });
    return out;
}

function loadCustomStudents() {
    try {
        const raw = localStorage.getItem(customStudentsKey());
        customStudents = raw ? normalizeCustomStudents(JSON.parse(raw)) : [];
    } catch (e) {
        console.error('读取自定义学生失败：', e);
        customStudents = [];
    }
}

function saveCustomStudents() {
    try {
        localStorage.setItem(customStudentsKey(), JSON.stringify(customStudents));
        return true;
    } catch (e) {
        console.error('保存自定义学生失败：', e);
        showToast(T('customStudentSaveFail', null, '自定义学生保存失败，本地存储空间可能不足'));
        return false;
    }
}

function customStudentToLibraryItem(rec) {
    const name = rec.name;
    const diffs = Array.isArray(rec.diffs) ? rec.diffs.slice().sort((a, b) => a.n - b.n) : [];
    const gallery = diffs.length
        ? [{ title: T('customDiffTitle', null, '表情差分'), images: diffs.map(d => d.src) }]
        : [];
    return {
        id: rec.id,
        baseId: rec.id,
        skinIndex: -1,
        displayName: name,
        shortName: name,
        avatar: rec.avatar || fallbackAvatar(name),
        introduction: '',
        familyName: {},
        givenName: {},
        gallery: gallery,
        skinName: '',
        custom: true,
        diffRange: rec.diffRange || null,
        searchText: name.toLowerCase()
    };
}

function mergeCustomStudentsIntoLibrary() {
    if (!Array.isArray(library)) return;
    library = library.filter(s => !s.custom);
    customStudents.forEach(rec => {

        if (library.some(s => s.id === entry.id)) return;
        library.push(entry);
    });

}

function nextCustomStudentId() {
    let max = 900000;

}

/* ---------- 表情差分（编号方式：学生姓名/001.jpg … xxx.jpg） ---------- */

function padDiffNum(n) {
    // 编号规则：从 001 开始（最小 1，三位补零）
    const v = Math.max(1, Math.floor(Number(n) || 1));
    return String(v).padStart(3, '0');
}

function diffExtFromDataUrl(src) {
    const m = /^data:image\/([a-z0-9.+-]+)/i.exec(String(src || ''));
    if (!m) return 'jpg';
    const sub = m[1].toLowerCase();
    if (sub === 'jpeg' || sub === 'jpg') return 'jpg';
    if (sub === 'svg+xml') return 'svg';
    if (sub === 'x-icon' || sub === 'vnd.microsoft.icon') return 'ico';
    return sub.replace(/[^a-z0-9]/g, '') || 'jpg';
}

function diffFolderName(name) {
    const s = String(name == null ? '' : name).replace(/[\\/:*?"<>|\u0000-\u001F]/g, '_').trim();
    return s || 'student';
}

function readFileDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(String(e.target.result || ''));
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.readAsDataURL(file);
    });
}

/** 编号范围输入：起始编号固定为 001，只需要填写「结束编号」 */
function onDiffRangeInput(commit) {
    const endEl = document.getElementById('custom-diff-end');
    const hintEl = document.getElementById('custom-diff-range-hint');
    if (!endEl) return;
    let raw = String(endEl.value).trim();

    // 失焦/修改结束时把 0、负数纠正为 1（编号必须从 001 开始）
    if (commit && raw !== '') {
        const n0 = parseInt(raw, 10);
        if (!Number.isFinite(n0) || n0 < 1) {
            endEl.value = 1;
            raw = '1';
        }
    }

    const n = parseInt(raw, 10);
    const invalid = raw !== '' && (!Number.isFinite(n) || n < 1);
    endEl.classList.toggle('invalid', invalid);
    if (hintEl) {
        hintEl.classList.toggle('invalid', invalid);
        hintEl.textContent = invalid
            ? T('customDiffEndInvalid', null, '结束编号必须是不小于 1 的整数（编号从 001 开始）')
            : T('customDiffRangeHint', null, '起始编号固定为 001，只需填写结束编号（≥1）');
    }
}

/** 读取「编号范围」：返回 { start, end } 或 { error } */
function pendingDiffRange() {
    const sEl = document.getElementById('custom-diff-start');
    const eEl = document.getElementById('custom-diff-end');
    const sRaw = sEl ? String(sEl.value).trim() : '';
    const eRaw = eEl ? String(eEl.value).trim() : '';
    if (sRaw === '' || eRaw === '') return { error: 'required' };
    const start = parseInt(sRaw, 10);
    const end = parseInt(eRaw, 10);
    if (!Number.isFinite(start) || !Number.isFinite(end)) return { error: 'invalid' };
    // 编号必须从 001 开始
    if (start < 1 || end < 1) return { error: 'start' };
    if (end < start) return { error: 'invalid' };
    return { start: start, end: end };
}

function renderPendingDiffPreview() {
    const box = document.getElementById('custom-diff-preview');
    const detected = document.getElementById('custom-diff-detected');
    const clearBtn = document.getElementById('custom-diff-clear');
    if (!box) return;
    if (!pendingCustomDiffs.length) {
        box.innerHTML = '';
        if (detected) detected.textContent = '';
        if (clearBtn) clearBtn.style.display = 'none';
        return;
    }
    const nums = pendingCustomDiffs.map(d => d.n);
    const start = Math.min.apply(null, nums);
    const end = Math.max.apply(null, nums);
    const sizeMb = (pendingCustomDiffs.reduce((n, d) => n + String(d.src || '').length, 0) * 0.75 / 1024 / 1024);
    const thumbs = pendingCustomDiffs.slice(0, 6).map(d =>
        `<img class="diff-thumb" src="${escapeHtml(d.src)}" alt="" referrerpolicy="no-referrer">`).join('');
    box.innerHTML = `<div class="diff-thumb-row">${thumbs}<span class="diff-count">${escapeHtml(
        T('customDiffFound', { n: pendingCustomDiffs.length, start: padDiffNum(start), end: padDiffNum(end) },
            '已读取 {n} 张差分（{start}-{end}）'))}</span></div>`;
    if (detected) detected.textContent = sizeMb.toFixed(1) + ' MB';
    if (clearBtn) clearBtn.style.display = '';
    if (sizeMb > 3.5) {
        showToast(T('customDiffTooLarge', { size: sizeMb.toFixed(1) + ' MB' }, '差分图片较大（约 {size}）'));
    }
}

function clearPendingCustomDiffs() {
    pendingCustomDiffs = [];
    const startEl = document.getElementById('custom-diff-start');
    const endEl = document.getElementById('custom-diff-end');
    if (startEl) startEl.value = 1;   // 起始编号固定 001
    if (endEl) { endEl.value = ''; endEl.classList.remove('invalid'); }
    onDiffRangeInput();
    renderPendingDiffPreview();
}

async function compressDiffFiles(picked) {
    const out = [];
    for (let i = 0; i < picked.length; i++) {
        let src = '';
        try {
            src = await readFileDataUrl(picked[i].file);
        } catch (e) {
            console.error('读取差分图片失败：', e);
            continue;
        }
        try {
            src = await compressImage(src, 720, 0.68);
        } catch (e) {
            // 压缩失败时保留原图（可能是 svg 等 canvas 画不了的格式）
        }
        out.push({ n: picked[i].n, src: src });
    }
    out.sort((a, b) => a.n - b.n);
    pendingCustomDiffs = out;
    renderPendingDiffPreview();
}

function onCustomDiffFiles(event) {
    const input = event && event.target;
    const files = Array.prototype.slice.call((input && input.files) || []);
    if (input) input.value = '';
    if (!files.length) return;

    const nameInput = document.getElementById('custom-student-name');
    const name = ((nameInput && nameInput.value) || '').trim();
    if (!name) {
        showToast(T('customDiffNeedName', null, '请先填写学生姓名，再选择差分文件夹'));
        return;
    }

    let folder = '';
    const picked = [];
    files.forEach(f => {
        const rel = String(f.webkitRelativePath || f.name || '').replace(/\\/g, '/');
        const parts = rel.split('/').filter(Boolean);
        if (parts.length >= 2 && !folder) folder = parts[0];
        const base = parts.length ? parts[parts.length - 1] : '';
        const m = /^(\d+)\.(jpe?g|png|webp|gif|bmp)$/i.exec(base);
        if (!m) return;
        const n = parseInt(m[1], 10);
        // 编号必须从 001 开始：000.jpg 之类的文件直接忽略
        if (!Number.isFinite(n) || n < 1) return;
        if (picked.some(x => x.n === n)) return;
        picked.push({ n: n, file: f });
    });

    if (!picked.length) {
        showToast(T('customDiffEmpty', null, '未选择差分图片（编号需从 001 开始）'));
        return;
    }
    if (folder && folder !== name) {
        showToast(T('customDiffNameMismatch', { folder: folder, name: name },
            '文件夹「{folder}」与当前学生姓名不同，图片会保存在「{name}」目录下'));
    }

    picked.sort((a, b) => a.n - b.n);
    const startEl = document.getElementById('custom-diff-start');
    const endEl = document.getElementById('custom-diff-end');
    // 编号从 001 开始：起始固定为 1；只回填结束编号（缺号在添加时提示）
    if (startEl) startEl.value = 1;
    if (endEl) endEl.value = picked[picked.length - 1].n;
    onDiffRangeInput();

    showToast(T('customDiffLoading', null, '正在处理差分图片…'));
    compressDiffFiles(picked);
}

function addCustomStudent() {
    if (!libraryReady) {
        showToast(T('notReadyTitle', null, '提示') + '：' + T('notReadyBody', null, '学生资料尚未加载完成，请稍候。'));
        return;
    }
    const nameInput = document.getElementById('custom-student-name');
    const name = (nameInput && nameInput.value || '').trim();
    if (!name) {
        showToast(T('customStudentNameRequired', null, '请输入学生姓名'));
        return;
    }

    // 表情差分：必须给出编号范围（0-n），只保留范围内的图片
    let diffs = [];
    let diffRange = null;
    if (pendingCustomDiffs.length) {
        const range = pendingDiffRange();
        if (range.error === 'required') {
            showToast(T('customDiffRangeRequired', null, '请填写编号范围的结束编号（起始编号固定为 001）'));
            return;
        }
        if (range.error === 'start') {
            showToast(T('customDiffStartFromOne', null, '编号必须从 001 开始（起始编号最小为 1）'));
            return;
        }
        if (range.error) {
            showToast(T('customDiffRangeInvalid', null, '编号范围无效：结束编号不能小于起始编号'));
            return;
        }
        const inRange = pendingCustomDiffs.filter(d => d.n >= range.start && d.n <= range.end);
        if (!inRange.length) {
            showToast(T('customDiffEmpty', null, '未选择差分图片'));
            return;
        }
        const present = new Set(inRange.map(d => d.n));
        let missing = 0;
        for (let n = range.start; n <= range.end; n++) {
            if (!present.has(n)) missing++;
        }
        if (missing) {
            showToast(T('customDiffMissing', { n: missing }, '编号范围内缺少 {n} 张图片'));
        }
        diffs = inRange;
        diffRange = { start: range.start, end: range.end };
    }

    const id = nextCustomStudentId();
    const rec = {
        id: id,
        name: name,
        avatar: pendingCustomAvatar || '',
        diffs: diffs,
        diffRange: diffRange
    };
    customStudents.push(rec);
    if (!saveCustomStudents()) {
        customStudents.pop();
        return;
    }
    mergeCustomStudentsIntoLibrary();
    addStudentToMyList(id);
    if (nameInput) nameInput.value = '';
    resetCustomAvatarPreview();
    clearPendingCustomDiffs();
    renderContactList();
    renderCustomStudentsUI();
    showToast(T('customStudentAdded', { name: name }, '已添加学生：{name}'));
}

function deleteCustomStudent(id) {
    const rec = customStudents.find(s => s.id === id);
    if (!rec) return;
    confirmModal(T('customStudentDeleteTitle', null, '删除自定义学生'),

/* ================= 自定义学生 .zip 导入 / 导出（含表情差分） ================= */

function ensureZip() {
    if (window.MomoZip && typeof window.MomoZip.create === 'function' && typeof window.MomoZip.read === 'function') {
        return true;
    }
    showToast(T('customStudentZipUnsupported', null, '当前环境不支持 zip 读写（需要较新的浏览器）'));

        return;

}

/**
 * zip 结构（编号方式：学生姓名/001.jpg … xxx.jpg）：
 *   student.json（或 students.json）: { name, avatarPath, diffs: [{n, path}], diffRange }
 *   学生姓名/avatar.jpg
 *   学生姓名/001.jpg …
 */
async function exportCustomStudentsZip(list, filename) {
    if (!ensureZip()) return null;
    try {
        const entries = [];
        const metas = [];
        list.forEach(rec => {
            const folder = diffFolderName(rec.name);
            const meta = { name: rec.name, avatarPath: '', diffs: [], diffRange: rec.diffRange || null };
            if (rec.avatar && /^data:/i.test(rec.avatar)) {
                const bytes = MomoZip.dataUrlToBytes(rec.avatar);
                if (bytes && bytes.length) {
                    const path = folder + '/avatar.' + diffExtFromDataUrl(rec.avatar);
                    meta.avatarPath = path;
                    entries.push({ path: path, data: bytes });
                }
            } else if (rec.avatar) {
                meta.avatarUrl = rec.avatar;
            }
            (Array.isArray(rec.diffs) ? rec.diffs : []).forEach(d => {
                const bytes = MomoZip.dataUrlToBytes(d.src);
                if (!bytes || !bytes.length) return;
                const path = folder + '/' + padDiffNum(d.n) + '.' + diffExtFromDataUrl(d.src);
                entries.push({ path: path, data: bytes });
                meta.diffs.push({ n: d.n, path: path });
            });
            metas.push(meta);
        });
        entries.push({
            path: list.length === 1 ? 'student.json' : 'students.json',
            data: JSON.stringify(list.length === 1 ? metas[0] : metas, null, 2)
        });
        const blob = await MomoZip.create(entries);
        downloadBlob(blob, filename);
        showToast(list.length === 1
            ? T('customStudentExportDone', { name: list[0].name }, '已导出学生「{name}」')
            : T('customStudentExportAllDone', { n: list.length }, '已导出 {n} 个自定义学生'));
        return blob;
    } catch (err) {
        console.error('导出自定义学生失败：', err);
        showModal(T('chatExportFail', null, '导出失败'),
            `<div style="font-size:13px;color:#666;line-height:1.7;word-break:break-all;">${escapeHtml(err && err.message ? err.message : String(err))}</div>`,
            [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
        return null;
    }
}

function findZipEntry(byPath, name) {
    const lower = String(name).toLowerCase();
    const keys = Object.keys(byPath);
    for (let i = 0; i < keys.length; i++) {
        const base = keys[i].split('/').pop().toLowerCase();
        if (base === lower) return byPath[keys[i]];
    }
    return null;
}

function zipEntryDataUrl(entry) {
    return MomoZip.bytesToDataUrl(entry.data, MomoZip.mimeForPath(entry.path));
}

function zipEntriesToStudentMetas(entries) {
    const byPath = {};
    entries.forEach(e => { byPath[e.path] = e; });

    let metas = null;
    const many = findZipEntry(byPath, 'students.json');
    const single = findZipEntry(byPath, 'student.json');
    try {
        if (many) {
            const parsed = JSON.parse(MomoZip.decodeText(many.data));
            metas = Array.isArray(parsed) ? parsed : [parsed];
        } else if (single) {
            const parsed = JSON.parse(MomoZip.decodeText(single.data));
            metas = Array.isArray(parsed) ? parsed : [parsed];
        }
    } catch (e) {
        metas = null;
    }
    if (metas && metas.length) return { metas: metas, byPath: byPath };

    // 兜底：没有索引文件时，按「学生姓名/001.jpg」目录结构推断
    const folders = {};
    entries.forEach(e => {
        const parts = e.path.split('/');
        if (parts.length < 2) return;
        const folder = parts[0];
        const base = parts[parts.length - 1];
        const m = /^(\d+)\.(jpe?g|png|webp|gif|bmp)$/i.exec(base);
        if (!m) return;
        if (!folders[folder]) folders[folder] = { name: folder, avatarPath: '', diffs: [] };
        folders[folder].diffs.push({ n: parseInt(m[1], 10), path: e.path });
    });
    metas = Object.keys(folders).map(k => folders[k]);
    return { metas: metas, byPath: byPath };
}

function importCustomStudentsZip(event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (input) input.value = '';
    if (!file) return;
    if (!ensureZip()) return;

    showToast(T('customStudentImporting', null, '正在读取 zip…'));
    MomoZip.read(file).then(entries => {
        if (!entries.length) throw new Error(T('customStudentZipInvalid', null, '不是有效的学生 zip 文件'));
        const parsed = zipEntriesToStudentMetas(entries);
        const metas = parsed.metas;
        const byPath = parsed.byPath;
        if (!metas.length) throw new Error(T('customStudentImportNoStudent', null, 'zip 中没有找到学生数据'));

        let nextId = nextCustomStudentId();
        let added = 0;
        let updated = 0;

        metas.forEach(meta => {
            if (!meta || typeof meta !== 'object') return;
            const name = Array.from(pickString(meta.name)).slice(0, 20).join('');
            if (!name) return;

            const avatarPath = pickString(meta.avatarPath);
            const avatarEntry = avatarPath ? (byPath[avatarPath] || findZipEntry(byPath, avatarPath.split('/').pop())) : null;
            const avatar = avatarEntry ? zipEntryDataUrl(avatarEntry) : pickString(meta.avatarUrl || meta.avatar);

            const diffs = [];
            (Array.isArray(meta.diffs) ? meta.diffs : []).forEach(item => {
                let n = NaN;
                let path = '';
                if (typeof item === 'number') { n = item; }
                else if (typeof item === 'string') { path = item; }
                else if (item && typeof item === 'object') {
                    n = Number(item.n);
                    path = pickString(item.path || item.src || item.file);
                }
                if (!Number.isFinite(n) && path) {
                    const m = /(\d+)\.[a-z0-9]+$/i.exec(path);
                    if (m) n = parseInt(m[1], 10);
                }
                if (!Number.isFinite(n) || n < 1) return;
                const entry = path ? (byPath[path] || findZipEntry(byPath, path.split('/').pop())) : null;
                if (!entry) return;
                const src = zipEntryDataUrl(entry);
                if (!src || diffs.some(d => d.n === n)) return;
                diffs.push({ n: n, src: src });
            });
            diffs.sort((a, b) => a.n - b.n);

            let diffRange = null;
            if (meta.diffRange && typeof meta.diffRange === 'object') {
                const s = Number(meta.diffRange.start);
                const e = Number(meta.diffRange.end);
                if (Number.isFinite(s) && Number.isFinite(e) && s >= 1 && e >= s) diffRange = { start: s, end: e };
            }
            if (!diffRange && diffs.length) {
                diffRange = { start: diffs[0].n, end: diffs[diffs.length - 1].n };
            }

            const exist = customStudents.find(s => s.name === name);
            if (exist) {
                if (avatar) exist.avatar = avatar;
                if (diffs.length) exist.diffs = diffs;
                if (diffRange) exist.diffRange = diffRange;
                updated++;
            } else {
                while (customStudents.some(s => s.id === nextId)) nextId++;
                customStudents.push({ id: nextId, name: name, avatar: avatar || '', diffs: diffs, diffRange: diffRange });
                nextId++;
                added++;
            }
        });

        saveCustomStudents();
        mergeCustomStudentsIntoLibrary();
        renderCustomStudentsUI();
        renderContactList();

        showModal(T('importDoneTitle', null, '导入结果'), `
            <div style="font-size:14px;color:#333;line-height:1.8;">
                ${escapeHtml(T('customStudentImportDone', { added: added, updated: updated },
                    '导入完成：新增 {added} 个学生，更新 {updated} 个。'))}
            </div>`, [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
    }).catch(err => {
        console.error('导入自定义学生失败：', err);
        showModal(T('customStudentImportFail', null, '导入失败'),
            `<div style="font-size:13px;color:#666;line-height:1.7;word-break:break-all;">${escapeHtml(err && err.message ? err.message : String(err))}</div>`,
            [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
    });
}

function matchStudent(s, q) {
    if (!q) return true;

async function loadLibrary() {

}

/* ================= 聊天条目扩展：备注 / 标签 / 分组 / 排序 / 置顶 / 模式 ================= */

const NOTE_MAX = 30;
const TAG_MAX = 8;

function groupsKey() { return (CONFIG.storage && CONFIG.storage.groupsKey) || 'momotalk_groups_v1'; }
function progressKey() { return (CONFIG.storage && CONFIG.storage.progressKey) || 'momotalk_progress_v1'; }

function normalizeNote(raw) {
    const s = pickString(raw).replace(/\s+/g, ' ');
    return Array.from(s).slice(0, NOTE_MAX).join('');
}

function normalizeTags(raw) {
    let list;
    if (Array.isArray(raw)) list = raw.slice();
    else list = String(raw == null ? '' : raw).split(/[,，、;；]+/);
    const out = [];
    list.forEach(t => {
        const v = pickString(t).replace(/^#+/, '').trim();
        if (v && out.indexOf(v) < 0 && out.length < TAG_MAX) out.push(v);
    });
    return out;
}

function normalizeChatMode(raw) {
    return raw === 'play' ? 'play' : 'edit';
}

function normalizeGroups(raw) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    const used = new Set();
    raw.forEach((item, i) => {
        if (!item || typeof item !== 'object') return;
        const name = Array.from(pickString(item.name)).slice(0, 20).join('');
        if (!name) return;
        let id = pickString(item.id) || ('g_' + (i + 1));
        while (used.has(id)) id = id + '_' + (used.size + 1);
        used.add(id);
        out.push({ id: id, name: name, order: Number(item.order) || out.length });
    });
    out.sort((a, b) => a.order - b.order);
    out.forEach((g, i) => { g.order = i; });
    return out;
}

function loadGroups() {
    try {
        const raw = localStorage.getItem(groupsKey());
        groups = raw ? normalizeGroups(JSON.parse(raw)) : [];
    } catch (e) {
        console.error('读取分组失败：', e);
        groups = [];
    }
}

function saveGroups() {
    try {
        localStorage.setItem(groupsKey(), JSON.stringify(groups));
        return true;
    } catch (e) {
        console.error('保存分组失败：', e);
        return false;
    }
}

function normalizeProgressEntry(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const choices = {};
    if (raw.choices && typeof raw.choices === 'object') {
        Object.keys(raw.choices).forEach(k => {
            const v = Number(raw.choices[k]);
            if (Number.isFinite(v) && v >= 0) choices[k] = v;
        });
    }
    const bi = Number(raw.boxIndex);
    const ii = Number(raw.itemIndex);
    return {
        boxIndex: Number.isFinite(bi) && bi >= 0 ? Math.floor(bi) : 0,
        itemIndex: Number.isFinite(ii) && ii >= 0 ? Math.floor(ii) : 0,
        choices: choices,
        finished: !!raw.finished,
        updatedAt: Number(raw.updatedAt) || 0
    };
}

function normalizeProgressMap(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    Object.keys(raw).forEach(k => {
        const entry = normalizeProgressEntry(raw[k]);
        if (entry) out[k] = entry;
    });
    return out;
}

function loadProgressMap() {
    try {
        const raw = localStorage.getItem(progressKey());
        progressMap = raw ? normalizeProgressMap(JSON.parse(raw)) : {};
    } catch (e) {
        console.error('读取播放进度失败：', e);
        progressMap = {};
    }
}

function saveProgressMap() {
    try {
        localStorage.setItem(progressKey(), JSON.stringify(progressMap));
        return true;
    } catch (e) {
        console.error('保存播放进度失败：', e);
        return false;
    }
}

/** 读取 / 写入单个会话的播放进度（播放模式自动保存用） */
function chatProgress(chatId) {
    return progressMap[String(chatId)] || null;
}

function setChatProgress(chatId, patch) {
    const key = String(chatId);
    const prev = progressMap[key] || { boxIndex: 0, itemIndex: 0, choices: {}, finished: false, updatedAt: 0 };
    const next = {
        boxIndex: patch.boxIndex != null ? Math.max(0, Math.floor(patch.boxIndex)) : prev.boxIndex,
        itemIndex: patch.itemIndex != null ? Math.max(0, Math.floor(patch.itemIndex)) : prev.itemIndex,
        choices: patch.choices ? Object.assign({}, patch.choices) : Object.assign({}, prev.choices),
        finished: patch.finished != null ? !!patch.finished : prev.finished,
        updatedAt: now()
    };
    progressMap[key] = next;
    return next;
}

function clearChatProgress(chatId) {
    delete progressMap[String(chatId)];
    saveProgressMap();
}

function entryOf(chatId) {
    const key = String(chatId);
    return myStudents.find(s => s.id === key) || null;
}

function chatModeOf(chatId) {
    const entry = entryOf(chatId);
    return entry ? normalizeChatMode(entry.mode) : 'edit';
}

function isPlayChat(chatId) {
    return chatModeOf(chatId) === 'play';
}

function groupById(id) {
    return groups.find(g => g.id === id) || null;
}

function lastTimeOfEntry(entry) {
    const last = getLastMsg(entry.chatId);
    if (last && Number(last.time)) return Number(last.time);
    return Number(entry.addedAt) || 0;
}

/** 已保存的手动顺序统一为 0..n-1；缺失 order 的条目按「最后消息时间」补到末尾 */
function ensureChatOrder() {
    let maxOrder = -1;
    let changed = false;
    myStudents.forEach(entry => {
        const v = Number(entry.order);
        if (Number.isFinite(v)) maxOrder = Math.max(maxOrder, v);
    });
    const missing = myStudents
        .map((entry, index) => ({ entry: entry, index: index }))
        .filter(x => !Number.isFinite(Number(x.entry.order)));
    if (!missing.length) return false;
    missing.sort((a, b) => lastTimeOfEntry(b.entry) - lastTimeOfEntry(a.entry) || a.index - b.index);
    missing.forEach((x, i) => { x.entry.order = maxOrder + 1 + i; changed = true; });
    return changed;
}

function minChatOrder() {
    let min = 0;
    myStudents.forEach(entry => {
        const v = Number(entry.order);
        if (Number.isFinite(v) && v < min) min = v;
    });
    return min;
}

/** 列表排序：置顶优先，其次手动顺序（拖动/新建），最后按最后消息时间 */
function sortContactEntries(entries) {
    return entries.sort((a, b) => {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        const oa = Number.isFinite(a.order) ? a.order : 0;
        const ob = Number.isFinite(b.order) ? b.order : 0;
        if (oa !== ob) return oa - ob;
        return (b.lastTime || 0) - (a.lastTime || 0);
    });
}

/** 搜索匹配：姓名 / 形态名 / 备注 / 标签 / 分组名 */
function matchContactEntry(s, q) {
    if (!q) return true;
    const hay = [s.displayName, s.skinName, s.note, (s.tags || []).join(' '), s.groupName, s.shortName]
        .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
}

function contactEntries() {
    return myStudents
        .map(entry => {
            const stu = libraryById[entry.studentId];
            if (!stu) return null;
            const group = entry.groupId ? groupById(entry.groupId) : null;
            return {
                chatId: entry.id,
                studentId: stu.id,
                displayName: stu.displayName,
                shortName: stu.shortName,
                avatar: stu.avatar,
                introduction: stu.introduction,
                skinName: stu.skinName,
                unread: entry.unread || 0,
                addedAt: entry.addedAt || 0,
                note: entry.note || '',
                tags: Array.isArray(entry.tags) ? entry.tags : [],
                groupId: (group ? group.id : ''),
                groupName: group ? group.name : '',
                pinned: !!entry.pinned,
                order: Number.isFinite(Number(entry.order)) ? Number(entry.order) : 0,
                mode: normalizeChatMode(entry.mode),
                lastTime: lastTimeOfEntry({ chatId: entry.id, addedAt: entry.addedAt })
            };
        })
        .filter(Boolean);
}

function contactItemHtml(s) {
    const name = s.displayName;
    const avatar = s.avatar || fallbackAvatar(name);
    const last = getLastMsg(s.chatId);
    // 同一角色可以存在多个会话：列表不显示编号，用淡灰字展示创建 / 最后修改时间
    const createdTs = Number(s.addedAt) || 0;
    const modifiedTs = last && Number(last.time) ? Number(last.time) : createdTs;
    const datesHtml = `<div class="contact-dates">${escapeHtml(T('contactCreated', null, '创建'))} ${escapeHtml(formatChatDate(createdTs))} · ${escapeHtml(T('contactModified', null, '修改'))} ${escapeHtml(formatChatDate(modifiedTs))}</div>`;

    let preview;
    if (last) {
        // 兜底：即使数据被外部改坏，也保证这里拿到的是字符串
        const rawText = typeof last.text === 'string' ? last.text : String(last.text == null ? '' : last.text);
        const isImg = isImageUrl(rawText);
        let text = isImg ? T('imagePlaceholder', null, '[图片]') : rawText.replace(/\n/g, ' ');
        if (text.length > 40) text = text.slice(0, 40) + '…';
        preview = last.role === 'sensei'
            ? `<span class="prefix-sensei">${escapeHtml(T('mePrefix', null, '[我]'))}</span> ${escapeHtml(text)}`
            : escapeHtml(text);
    } else if (s.skinName) {
        preview = `<span class="skin-tag">${escapeHtml(T('skinPreview', null, '暂无消息'))}</span>`;
    } else {
        const intro = (s.introduction || '').replace(/\n/g, ' ').trim();
        preview = intro
            ? escapeHtml(intro.length > 60 ? intro.slice(0, 60) + '…' : intro)
            : `<span style="color:#ccc;">${escapeHtml(T('startChat', { name: s.shortName }, '开始与 {name} 聊天吧'))}</span>`;
    }

    const unreadHtml = s.unread > 0
        ? `<div class="unread-badge">${s.unread > 99 ? '99+' : s.unread}</div>`
        : '';

    const noteHtml = s.note
        ? `<div class="contact-note">${escapeHtml(s.note)}</div>`
        : '';

    // 标签显示在聊天条后方（右侧）
    let tagsHtml = '';
    if (s.tags.length) {
        const shown = s.tags.slice(0, 2);
        const rest = s.tags.length - shown.length;
        tagsHtml = `<div class="contact-tags">${shown.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}${rest > 0 ? `<span class="tag-chip more">+${rest}</span>` : ''}</div>`;
    }

    const pinHtml = s.pinned
        ? `<span class="pin-chip" title="${escapeHtml(T('chatPinnedBadge', null, '置顶'))}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2 22 10l-2 2-1.6-.4-3.6 3.6.7 3.2-1.4 1.4-4.2-4.2L5 21l-2-2 5.4-4.9-4.2-4.2 1.4-1.4 3.2.7 3.6-3.6L12 3l2-1Z"/></svg></span>`
        : '';

    const modeHtml = s.mode === 'play'
        ? `<span class="mode-chip" title="${escapeHtml(T('chatModePlay', null, '播放模式'))}">${escapeHtml(T('chatModePlay', null, '播放模式'))}</span>`
        : '';

    return `<div class="contact-item${s.pinned ? ' pinned' : ''}${s.mode === 'play' ? ' play-chat' : ''}" data-id="${escapeHtml(s.chatId)}">
        <img class="contact-avatar" src="${escapeHtml(avatar)}"
             data-fallback="${escapeHtml(fallbackAvatar(name))}"
             referrerpolicy="no-referrer" alt="" loading="lazy">
        <div class="contact-info">
            <div class="contact-name-row">
                <div class="contact-name">${escapeHtml(name)}</div>
                ${modeHtml}
                ${pinHtml}
            </div>
            ${noteHtml}
            <div class="contact-preview">${preview}</div>
            ${datesHtml}
        </div>
        <div class="contact-side">
            ${tagsHtml}
            ${unreadHtml}
        </div>
        <div class="drag-handle" title="${escapeHtml(T('dragHandleTitle', null, '拖动排序'))}" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
        </div>
    </div>`;
}

function renderContactList() {
    const list = document.getElementById('contact-list');
    if (!libraryReady) return;

    let entries = contactEntries();
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        entries = entries.filter(s => matchContactEntry(s, q));
    }

    if (entries.length === 0) {
        list.innerHTML = `
            <div class="empty-tip">
                ${searchQuery
                    ? escapeHtml(T('emptySearch', null, '没有找到匹配的学生形态'))
                    : `${escapeHtml(T('emptyMyStudents', null, '还没有添加学生'))}<br><span style="font-size:12px;color:#c4c4c4;">${escapeHtml(T('emptyHint', null, '点击下方 + 从学生库中选择'))}</span>`}
            </div>`;
        return;
    }

    // 搜索时保持单列（不显示分组段），方便一眼看到所有命中项
    if (searchQuery || !groups.length) {
        list.innerHTML = sortContactEntries(entries).map(contactItemHtml).join('');
        return;
    }

    const sections = [];
    groups.forEach(g => {
        const items = sortContactEntries(entries.filter(s => s.groupId === g.id));
        if (!items.length) return;
        sections.push({ id: g.id, name: g.name, items: items });
    });
    const ungrouped = sortContactEntries(entries.filter(s => !s.groupId));
    if (ungrouped.length) {
        sections.push({ id: '', name: T('groupUngrouped', null, '未分组'), items: ungrouped });
    }

    list.innerHTML = sections.map(sec => `
        <div class="contact-section" data-group-id="${escapeHtml(sec.id)}">
            <div class="contact-section-head">
                <span class="contact-section-name">${escapeHtml(sec.name)}</span>
                <span class="contact-section-count">${sec.items.length}</span>
            </div>
            ${sec.items.map(contactItemHtml).join('')}
        </div>
    `).join('');
}


/** 列表里的淡灰日期：今年只显示 MM-DD HH:mm，跨年显示 YYYY-MM-DD HH:mm */
function formatChatDate(ts) {
    const n = Number(ts);
    if (!Number.isFinite(n) || n <= 0) return '—';
    const d = new Date(n);
    const p = v => String(v).padStart(2, '0');
    const datePart = d.getFullYear() === new Date().getFullYear()
        ? `${p(d.getMonth() + 1)}-${p(d.getDate())}`
        : `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    return `${datePart} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function onSearch() {
    searchQuery = document.getElementById('search-input').value.trim();
    renderContactList();
}

(function bindListEvents() {
    const list = document.getElementById('contact-list');

    const clearTimer = () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    let pressStart = null;
    let drag = null;

    // ---------- 拖动排序（只通过右侧拖动手柄触发，避免和点击 / 长按菜单冲突） ----------
    const onDragMove = e => {
        if (!drag) return;
        const section = drag.section;
        const y = e.clientY;
        const items = Array.from(section.querySelectorAll('.contact-item')).filter(el => el !== drag.item);
        let ref = null;
        for (let i = 0; i < items.length; i++) {
            const rect = items[i].getBoundingClientRect();
            if (y < rect.top + rect.height / 2) { ref = items[i]; break; }
        }
        if (ref) {
            if (drag.item.nextElementSibling !== ref) section.insertBefore(drag.item, ref);
        } else if (items.length) {
            const last = items[items.length - 1];
            if (last.nextElementSibling !== drag.item) section.appendChild(drag.item);
        }
        drag.moved = true;
        e.preventDefault();
    };

    const onDragEnd = () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        d.item.classList.remove('dragging');
        document.removeEventListener('pointermove', onDragMove, true);
        document.removeEventListener('pointerup', onDragEnd, true);
        document.removeEventListener('pointercancel', onDragEnd, true);
        if (d.moved) {
            longPressFired = true; // 松开后紧跟的 click 不要再打开聊天
            const orderItems = Array.from(d.section.querySelectorAll('.contact-item'));
            orderItems.forEach((el, i) => {
                const entry = entryOf(el.dataset.id);
                if (entry) entry.order = i;
            });
            saveMyStudents();
        }
        renderContactList();
    };

    list.addEventListener('pointerdown', e => {
        const handle = e.target.closest('.drag-handle');
        if (!handle) return;
        if (e.button !== undefined && e.button !== 0) return;
        const item = handle.closest('.contact-item');
        const section = item ? item.closest('.contact-section') : null;
        if (!item || !section) return; // 搜索态 / 单列没有分组段，不支持拖动
        clearTimer();
        e.preventDefault();
        drag = { item: item, section: section, moved: false, startY: e.clientY };
        item.classList.add('dragging');
        document.addEventListener('pointermove', onDragMove, true);
        document.addEventListener('pointerup', onDragEnd, true);
        document.addEventListener('pointercancel', onDragEnd, true);
    });

    list.addEventListener('pointerdown', e => {
        if (drag) return;
        if (e.target.closest('.drag-handle')) return;
        const item = e.target.closest('.contact-item');
        if (!item) return;
        // 只响应鼠标左键 / 触摸主指针
        if (e.button !== undefined && e.button !== 0) return;
        // 多指同时按下时先清掉上一个计时器，否则会对上一个学生误弹菜单
        clearTimer();
        longPressFired = false;
        pressStart = { x: e.clientX, y: e.clientY };
        const id = item.dataset.id;
        pressTimer = setTimeout(() => {
            pressTimer = null;
            pressStart = null;
            longPressFired = true;
            showListContextMenu(id);
        }, 600);
    });

    ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(ev => {
        list.addEventListener(ev, clearTimer, { passive: true });
    });

    // 原来的 pointermove 有任何抖动就取消长按，导致长按几乎按不出来；改为超过阈值才取消
    list.addEventListener('pointermove', e => {
        if (!pressStart) return;
        const dx = e.clientX - pressStart.x;
        const dy = e.clientY - pressStart.y;
        if (dx * dx + dy * dy > 100) clearTimer();
    }, { passive: true });

    list.addEventListener('click', e => {
        if (longPressFired) { longPressFired = false; return; }
        if (drag) return;
        if (e.target.closest('.drag-handle')) return;
        const item = e.target.closest('.contact-item');
        if (item) openChat(item.dataset.id);
    });

    list.addEventListener('contextmenu', e => {
        const item = e.target.closest('.contact-item');
        if (!item) return;
        e.preventDefault();
        showListContextMenu(item.dataset.id);
    });
})();

function showListContextMenu(chatId) {
