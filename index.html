function startPlayback() {
    if (!currentStudentId || playback) return;
    const boxes = chatBoxes();
    if (!boxes.length) {
        showToast(T('playEmpty', null, '还没有聊天内容可以播放'));
        return;
    }
    closeMorePanel();
    playback = { boxes: copyBoxes(boxes), index: 0, timer: null };

    const container = document.getElementById('chat-content');
    container.innerHTML = '';
    document.getElementById('playback-bar').classList.remove('hidden');
    document.getElementById('btn-play').classList.add('playing');
    document.getElementById('btn-play-text').textContent = T('playStopBtn', null, '停止');
    document.getElementById('chat-input-area').classList.add('disabled');
    document.getElementById('chat-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('append-btn').disabled = true;
    document.getElementById('btn-more').disabled = true;
    updatePlaybackProgress();
    playbackNext();
}

function copyBoxes(boxes) {
    return boxes.map(b => ({
        id: b.id,
        role: b.role,
        time: b.time,
        items: b.items.map(it => Object.assign({}, it))
    }));
}

function appendPlaybackBox(box) {
    const container = document.getElementById('chat-content');
    const wrap = document.createElement('div');
    wrap.innerHTML = boxHtml(box);
    container.appendChild(wrap.firstElementChild);
    scrollChatToBottom(container);
}

function playbackNext() {
    if (!playback) return;
    const pb = playback;
    if (pb.index >= pb.boxes.length) {
        finishPlayback();
        return;
    }
    const box = pb.boxes[pb.index];
    updatePlaybackProgress();

    if (box.role === 'student') {
        const container = document.getElementById('chat-content');
        const old = container.querySelector('.typing-box');
        if (old) old.remove();
        const wrap = document.createElement('div');
        wrap.innerHTML = typingBoxHtml();
        container.appendChild(wrap.firstElementChild);
        scrollChatToBottom(container);
        pb.timer = setTimeout(() => {
            if (!playback) return;
            const t = document.querySelector('#chat-content .typing-box');
            if (t) t.remove();
            appendPlaybackBox(box);
            pb.index++;
            updatePlaybackProgress();
            pb.timer = setTimeout(playbackNext, 240);
        }, settings.animationTime);
    } else {
        appendPlaybackBox(box);
        pb.index++;
        updatePlaybackProgress();
        pb.timer = setTimeout(playbackNext, 240);
    }
}

function finishPlayback() {
    stopPlayback(false);
}

function stopPlayback(silent) {
    if (playback) {
        if (playback.timer) clearTimeout(playback.timer);
        playback = null;
    }
    const old = document.querySelector('#chat-content .typing-box');
    if (old) old.remove();
    resetPlayButton();
    if (!silent) renderChat();
}

function togglePlayback() {
    if (playback) {
        stopPlayback(false);
    } else {
        startPlayback();
    }
}

/* ================= 截图 ================= */

function screenshotFilename() {
    return 'momotalk_chat_' + timestampForFile(new Date()) + '.png';
}

function takeScreenshot() {
    if (!currentStudentId) return;
    if (playback) stopPlayback(false);
    const stu = currentStudent();
    if (!stu) return;
    const boxes = chatBoxes();
    if (!boxes.length) {
        showToast(T('playEmpty', null, '还没有聊天内容可以截图'));
        return;
    }
    if (!window.ChatScreenshot || typeof window.ChatScreenshot.generate !== 'function') {
        showToast(T('screenshotUnavailable', null, '截图模块未加载，请检查 resources/chat_screenshot.js'));
        return;
    }
    const content = document.getElementById('chat-content');
    const width = Math.max(300, Math.min(460, (content ? content.clientWidth : 360)));
    showModal(T('screenshotTitle', null, '聊天截图'),
        `<div class="screenshot-loading"><div class="spinner"></div><span>${escapeHtml(T('screenshotCreating', null, '正在生成截图…'))}</span></div>`, []);

    window.ChatScreenshot.generate({
        boxes: copyBoxes(boxes),
        student: { name: stu.displayName, avatar: stu.avatar || fallbackAvatar(stu.displayName) },
        width: width,
        dpr: 2,
        texts: {
            reply: T('replyTitle', null, '回复'),
            story: T('storyTitle', null, '好感故事'),
            imageFail: T('imageLoadFail', null, '图片加载失败')
        }
    }).then(res => {
        const canvas = res && res.canvas ? res.canvas : res;
        if (!canvas || typeof canvas.toDataURL !== 'function') throw new Error('截图模块返回格式错误');
        const dataUrl = canvas.toDataURL('image/png');
        const html = `<div class="screenshot-wrap"><img id="screenshot-preview-img" src="${dataUrl}" alt=""></div>`;
        showModal(T('screenshotTitle', null, '聊天截图'), html, [
            {
                text: T('screenshotSave', null, '保存图片'), class: 'confirm',
                onClick: () => { downloadDataUrl(dataUrl, screenshotFilename()); closeModal(); }
            },
            { text: T('closeBtn', null, '关闭'), class: 'cancel', onClick: closeModal }
        ]);
    }).catch(err => {
        console.error('截图失败：', err);
        showModal(T('screenshotFailTitle', null, '截图失败'),
            `<div style="font-size:13px;color:#666;line-height:1.7;text-align:center;word-break:break-all;">
                ${escapeHtml(err && err.message ? err.message : String(err))}
            </div>`, [{ text: T('notReadyOk', null, '知道了'), class: 'confirm', onClick: closeModal }]);
    });
}

/* ================= 通用 UI 工具 ================= */

let toastTimer = null;

function showToast(msg) {
    let el = document.getElementById('app-toast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'app-toast';
        el.className = 'toast';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('show'));
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

function confirmModal(title, bodyHtml, onConfirm) {
    showModal(title, `<div style="font-size:13px;color:#666;line-height:1.8;text-align:center;">${bodyHtml}</div>`, [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: closeModal },
        {
            text: T('confirmDeleteBtn', null, '删除'), class: 'danger',
            onClick: () => { closeModal(); onConfirm(); }
        }
    ]);
}

function openImagePreview(src) {
    if (!src) return;
    showModal(T('imagePreviewTitle', null, '查看图片'),
        `<div class="screenshot-wrap" style="background:#f4f6f8;"><img src="${escapeHtml(src)}" alt=""></div>`,
        [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
}

function timestampForFile(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
        p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function downloadDataUrl(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function autoBackup() {
    if (!settings.autoBackup) return;
    if (!myStudents.length && !Object.keys(chats).length) return;
    try {
        const data = buildExportData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        downloadBlob(blob, 'momotalk_autobackup_' + timestampForFile(new Date()) + '.json');
    } catch (e) {
        console.error('自动备份失败：', e);
    }
}

/* ================= 长按 / 点击绑定（一次性） ================= */

function initChatInteractions() {
    const container = document.getElementById('chat-content');
    if (!container || container.dataset.bound) return;
    container.dataset.bound = '1';

    let press = null;
    let pressTimer = null;

    const clearPress = () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        press = null;
    };

    container.addEventListener('pointerdown', e => {
        if (playback) return;
        if (e.button !== undefined && e.button !== 0) return;
        if (morePanelOpen) { closeMorePanel(); return; }
        const boxEl = e.target.closest('.msg-box[data-box-id]');
        if (!boxEl) return;
        clearPress();
        longPressFired = false;
        press = { x: e.clientX, y: e.clientY, boxId: boxEl.dataset.boxId };
        pressTimer = setTimeout(() => {
            pressTimer = null;
            const id = press ? press.boxId : null;
            press = null;
            if (!id) return;
            longPressFired = true;
            openBoxEditor(id);
        }, 550);
    });

    container.addEventListener('pointermove', e => {
        if (!press) return;
        const dx = e.clientX - press.x;
        const dy = e.clientY - press.y;
        if (dx * dx + dy * dy > 64) clearPress();
    }, { passive: true });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
        container.addEventListener(ev, clearPress, { passive: true });
    });

    container.addEventListener('click', e => {
        if (longPressFired) { longPressFired = false; return; }
        const wrap = e.target.closest('.msg-image-wrapper');
        if (wrap) {
            const img = wrap.querySelector('img');
            if (img) openImagePreview(img.getAttribute('src'));
        }
    });

    container.addEventListener('contextmenu', e => {
        const boxEl = e.target.closest('.msg-box[data-box-id]');
        if (!boxEl) return;
        e.preventDefault();
        openBoxEditor(boxEl.dataset.boxId);
    });
}

function initMorePanelEvents() {
    const grid = document.getElementById('emoji-grid');
    if (grid && !grid.dataset.bound) {
        grid.dataset.bound = '1';
        grid.addEventListener('click', e => {
            const cell = e.target.closest('.emoji-cell');
            if (!cell) return;
            sendEmoji(cell.dataset.emoji);
        });
    }
    document.addEventListener('pointerdown', e => {
        if (!morePanelOpen) return;
        if (e.target.closest('.chat-input-area')) return;
        if (e.target.closest('.modal-content')) return;
        closeMorePanel();
    }, true);
}

/* ================= 下拉刷新 ================= */

function initPullRefresh() {
    const list = document.getElementById('contact-list');
    if (!list || list.dataset.pullBound) return;
    list.dataset.pullBound = '1';

    const indicator = document.createElement('div');
    indicator.className = 'pull-refresh';
    indicator.innerHTML = '<div class="spinner"></div><span id="pull-refresh-text"></span>';
    list.appendChild(indicator);
    const textEl = indicator.querySelector('span');

    let startY = 0;
    let pull = 0;
    let tracking = false;
    let refreshing = false;

    const setText = t => { if (textEl) textEl.textContent = t; };

    list.addEventListener('touchstart', e => {
        if (refreshing) return;
        if (document.getElementById('chat-page').classList.contains('slide-in')) return;
        if (list.scrollTop > 0) return;
        if (!e.touches || !e.touches.length) return;
        // 列表每次渲染都会重写 innerHTML，刷新指示器要重新挂回
        if (!indicator.isConnected) list.appendChild(indicator);
        startY = e.touches[0].clientY;
        pull = 0;
        tracking = true;
        indicator.classList.add('visible');
        indicator.style.transform = 'translateY(-52px)';
        setText(T('pullRefresh', null, '下拉刷新'));
    }, { passive: true });

    list.addEventListener('touchmove', e => {
        if (!tracking) return;
        if (list.scrollTop > 0) { tracking = false; indicator.classList.remove('visible'); indicator.style.transform = ''; return; }
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) {
            pull = 0;
            indicator.style.transform = 'translateY(-52px)';
            setText(T('pullRefresh', null, '下拉刷新'));
            return;
        }
        pull = Math.min(dy * 0.5, 82);
        indicator.style.transform = 'translateY(' + Math.round(pull - 52) + 'px)';
        setText(pull >= 52 ? T('releaseRefresh', null, '释放以刷新') : T('pullRefresh', null, '下拉刷新'));
    }, { passive: true });

    const finish = () => {
        if (!tracking) return;
        tracking = false;
        indicator.classList.remove('visible');
        if (pull < 52) {
            indicator.style.transform = '';
            pull = 0;
            return;
        }
        refreshing = true;
        indicator.style.transform = 'translateY(0)';
        setText(T('refreshing', null, '刷新中…'));
        const started = Date.now();
        Promise.resolve(loadLibrary()).then(() => {
            renderContactList();
            const wait = Math.max(0, 500 - (Date.now() - started));
            setTimeout(() => {
                refreshing = false;
                pull = 0;
                indicator.style.transform = '';
                setText(T('refreshDone', null, '刷新完成'));
                showToast(T('refreshDone', null, '刷新完成'));
            }, wait);
        }).catch(() => {
            refreshing = false;
            pull = 0;
            indicator.style.transform = '';
        });
    };

    list.addEventListener('touchend', finish);
    list.addEventListener('touchcancel', finish);
}

/* ================= 右滑返回 ================= */

function bindSwipeBack(pageEl, onBack) {
    if (!pageEl || pageEl.dataset.swipeBound) return;
    pageEl.dataset.swipeBound = '1';

    let startX = 0, startY = 0, tracking = false, dx = 0, active = false;

    const ignoreTarget = target => !!(target && target.closest &&
        target.closest('textarea, input, .setting-range, .emoji-grid, .more-tiles, .screenshot-wrap, .box-edit-list'));

    pageEl.addEventListener('touchstart', e => {
        if (!e.touches || !e.touches.length) return;
        if (ignoreTarget(e.target)) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dx = 0;
        tracking = true;
        active = false;
    }, { passive: true });

    pageEl.addEventListener('touchmove', e => {
        if (!tracking) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        dx = x - startX;
        const dy = y - startY;
        if (!active) {
            if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
            if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
            if (dx <= 0) { tracking = false; return; }
            active = true;
            pageEl.classList.add('swiping');
        }
        const offset = Math.max(0, Math.min(dx, 200));
        pageEl.style.transform = 'translateX(' + offset + 'px)';
    }, { passive: true });

    const finish = () => {
        if (!tracking && !active) return;
        tracking = false;
        const moved = dx;
        pageEl.classList.remove('swiping');
        if (active && moved > 80) {
            pageEl.style.transform = '';
            onBack();
        } else {
            pageEl.style.transform = '';
        }
        active = false;
        dx = 0;
    };

    pageEl.addEventListener('touchend', finish);
    pageEl.addEventListener('touchcancel', finish);
}

function initSwipeGestures() {
    const chatPage = document.getElementById('chat-page');
    bindSwipeBack(chatPage, () => {
        if (modalOverlay.classList.contains('active')) return;
        if (morePanelOpen) { closeMorePanel(); return; }
        if (playback) { stopPlayback(false); return; }
        closeChat();
    });

    const morePage = document.getElementById('more-page');
    bindSwipeBack(morePage, () => {
        if (modalOverlay.classList.contains('active')) return;
        const backBtn = document.getElementById('more-back-btn');
        if (backBtn && backBtn.classList.contains('show')) backToMoreMain();
        else switchToList();
    });
}

function myKey() { return CONFIG.storage.myStudentsKey || 'momotalk_my_students_v7'; }
function chatsKey() { return CONFIG.storage.chatsKey || 'momotalk_chats_v8'; }
function legacyChatsKey() { return CONFIG.storage.legacyChatsKey || 'momotalk_chats_v7'; }

function saveMyStudents() {
    try { localStorage.setItem(myKey(), JSON.stringify(myStudents)); }
    catch (e) { console.error('保存我的学生失败：', e); }
}

let quotaWarned = false;

function isQuotaError(e) {
    return !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
        || e.code === 22 || e.code === 1014);
}

function saveChats() {
    try { localStorage.setItem(chatsKey(), JSON.stringify(chats)); }
    catch (e) {
        console.error('保存聊天记录失败：', e);
        // 配额写满时原实现只写 console，界面照常显示、刷新后消息却消失；这里明确提示一次
        if (isQuotaError(e) && !quotaWarned) {
            quotaWarned = true;
            showModal(T('storageFullTitle', null, '本地存储已满'), `
                <div style="font-size:13px;color:#666;line-height:1.7;text-align:left;">
                    ${escapeHtml(T('storageFullBody', null, '浏览器本地存储空间不足，最新消息可能没有保存成功。建议先点右上角"导出"备份数据，再清理不再需要的会话。'))}
                </div>
            `, [{ text: T('notReadyOk', null, '知道了'), class: 'confirm', onClick: closeModal }]);
        }
    }
}

function loadUserData() {
    try {
        const raw = localStorage.getItem(myKey());
        if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) {
                myStudents = arr
                    .map(x => {
                        // null / 非对象条目不能直接读 x.id：Number(null)=0 会通过校验，
                        // 随后读 x.unread 抛 TypeError，被外层 catch 捕获后整份列表被清空。
                        if (!x || typeof x !== 'object') return null;
                        const id = Number(x.id);
                        if (!Number.isFinite(id) || id <= 0) return null;
                        return {
                            id: id,
                            unread: Number(x.unread) > 0 ? Number(x.unread) : 0,
                            addedAt: Number(x.addedAt) || 0
                        };
                    })
                    .filter(Boolean);
            }
        }
    } catch (e) { myStudents = []; }

    try {
        let raw = localStorage.getItem(chatsKey());
        let migrated = false;
        if (!raw) {
            raw = localStorage.getItem(legacyChatsKey());
            migrated = !!raw;
        }
        if (raw) chats = sanitizeChats(JSON.parse(raw));
        // 旧版扁平数据迁移后立刻写入新 key，旧 key 保留不删
        if (migrated && Object.keys(chats).length) saveChats();
    } catch (e) { chats = {}; }
}

/* ---------- 导出 / 导入 ---------- */

function buildExportData() {
    return {
        version: 4,
        exportedAt: new Date().toISOString(),
        myStudents: myStudents,
        chats: chats
    };
}

function exportData() {
    const data = buildExportData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'momotalk_backup_' + timestampForFile(new Date()) + '.json');
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        try {
            const parsed = JSON.parse(e.target.result);
            let importedIds = [];
            let importedChats = null;

            const toStudentId = x => {
                if (typeof x === 'number') return x;
                if (typeof x === 'string') return Number(x);
                return Number(x && x.id);
            };

            if (Array.isArray(parsed)) {
                importedIds = parsed.map(toStudentId).filter(Number.isFinite);
            } else if (parsed && typeof parsed === 'object') {
                if (Array.isArray(parsed.myStudents)) {
                    importedIds = parsed.myStudents.map(toStudentId).filter(Number.isFinite);
                } else if (Array.isArray(parsed.students)) {
                    importedIds = parsed.students.map(toStudentId).filter(Number.isFinite);
                }
                if (parsed.chats && typeof parsed.chats === 'object' && !Array.isArray(parsed.chats)) {
                    importedChats = sanitizeChats(parsed.chats);
                }
            } else {
                throw new Error(T('importUnknown', null, '无法识别的文件格式'));
            }

            if (!libraryReady) throw new Error(T('importLibNotReady', null, '学生资料尚未加载完成'));

            const existing = new Set(myStudents.map(s => s.id));
            let added = 0, missing = 0;
            importedIds.forEach(id => {
                if (!libraryById[id]) { missing++; return; }
                if (existing.has(id)) return;
                myStudents.push({ id: id, unread: 0, addedAt: now() + added });
                existing.add(id);
                added++;
            });

            let chatMerged = 0;
            let addedBoxes = 0;
            if (importedChats) {
                Object.keys(importedChats).forEach(k => {
                    const incoming = importedChats[k];
                    const existingChat = Array.isArray(chats[k]) ? chats[k] : [];
                    // 按盒子内容签名去重：同一份备份重复导入时不会把消息再追加一遍
                    const seen = new Set(existingChat.map(boxSignature));
                    const incomingNew = [];
                    incoming.forEach(b => {
                        const sig = boxSignature(b);
                        if (seen.has(sig)) return;
                        seen.add(sig);
                        incomingNew.push(b);
                    });
                    if (incomingNew.length || existingChat.length) {
                        chats[k] = existingChat.concat(incomingNew).sort((a, b) => a.time - b.time);
                        addedBoxes += incomingNew.length;
                        // 学生库里已不存在的 id 照旧保留数据（日后库更新还能恢复），但不计入"合并会话"
                        if (libraryById[k] && incomingNew.length) chatMerged++;
                    }
                });
                saveChats();
            }

            saveMyStudents();
            renderContactList();

            let doneHtml = `<div style="font-size:14px;color:#333;line-height:1.8;">${escapeHtml(
                T('importDone', { added: added, merged: chatMerged },
                    `导入完成：新增 ${added} 个学生形态，合并 ${chatMerged} 个会话。`))}</div>`;
            if (addedBoxes) {
                doneHtml += `<div style="font-size:13px;color:#999;margin-top:6px;">${escapeHtml(
                    T('importBoxes', { n: addedBoxes }, `新增 ${addedBoxes} 个信息盒子。`))}</div>`;
            }
            if (missing) {
                doneHtml += `<div style="font-size:13px;color:#d85c76;margin-top:6px;">${escapeHtml(
                    T('importMissing', { n: missing }, `有 ${missing} 个 id 在当前学生库中不存在，已跳过。`))}</div>`;
            }
            showModal(T('importDoneTitle', null, '导入结果'), doneHtml, [
                { text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }
            ]);
        } catch (err) {
            const detail = (err && err.message) ? err.message : String(err);
            showModal(T('importFailTitle', null, '导入失败'),
                `<div style="font-size:13px;color:#666;line-height:1.7;word-break:break-all;">${escapeHtml(detail)}</div>`,
                [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const modalActions = document.getElementById('modal-actions');

function showModal(title, bodyHtml, actions) {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalActions.innerHTML = '';
    (actions || []).forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'modal-btn ' + a.class;
        btn.textContent = a.text;
        btn.onclick = a.onClick;
        modalActions.appendChild(btn);
    });
    modalOverlay.classList.add('active');
}

function closeModal() {
    modalOverlay.classList.remove('active');
}

modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('active')) closeModal();
        else if (morePanelOpen) closeMorePanel();
        else if (playback) stopPlayback(false);
        else if (currentStudentId) closeChat();
        else if (document.getElementById('more-page').classList.contains('active')) {
            if (document.getElementById('more-back-btn').classList.contains('show')) backToMoreMain();
            else switchToList();
        }
    }
});

/* ================= 调试 / 测试钩子 ================= */
window.__mm = {
    chats: () => chats,
    settings: () => settings,
    myStudents: () => myStudents,
    student: () => currentStudent(),
    openChat: openChat,
    closeChat: closeChat,
    renderChat: renderChat,
    sendMessage: sendMessage,
    startPlayback: startPlayback,
    stopPlayback: stopPlayback,
    boxText: boxText,
    saveChats: saveChats,
    saveSettings: saveSettings,
    exportData: exportData,
    buildExportData: buildExportData,
    autoBackup: autoBackup,
    takeScreenshot: takeScreenshot,
    openBoxEditor: openBoxEditor,
    openMoreSection: openMoreSection,
    isImageUrl: isImageUrl,
    escapeHtml: escapeHtml,
    setAnimationTime: setAnimationTime,
    setAutoBackup: setAutoBackup
};

(async function boot() {
    await loadConfig();
    loadSettings();
    loadUserData();
    updateRoleUI();
    updateGeneralUI();
    updateSettingsUI();
    renderTutorialList();
    initChatInteractions();
    initMorePanelEvents();
    initSwipeGestures();

    if (!configLoaded) {
        const list = document.getElementById('contact-list');
        list.innerHTML = `<div class="empty-tip">
            <div style="font-size:15px;color:#666;margin-bottom:10px;">${escapeHtml(T('configFailTitle', null, '无法读取配置文件'))}</div>
            <div style="font-size:12px;color:#aaa;line-height:1.7;">
                ${escapeHtml(T('configFailHint', null, '请确认 resources/running_datas.json 存在且可访问。'))}<br>${escapeHtml(DATAS_URL)}
            </div>
        </div>`;
        return;
    }

    loadLibrary();
    initPullRefresh();
})();
</script>
