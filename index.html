    const msgCount = (chats[chatId] || []).length;
    const groupOptions = groups.map(g =>
        `<option value="${escapeHtml(g.id)}"${entry.groupId === g.id ? ' selected' : ''}>${escapeHtml(g.name)}</option>`
    ).join('');
    const mode = normalizeChatMode(entry.mode);

    const html = `
        <div style="font-size:13px;color:#888;margin-bottom:12px;text-align:center;">
            ${escapeHtml(T('manageSubtitle', { name: stu.displayName, count: msgCount }, '{name} · 共 {count} 条消息'))}
        </div>
        <div class="manage-form">
            <div class="manage-row">
                <span class="manage-label">${escapeHtml(T('chatNoteLabel', null, '备注'))}</span>
                <input type="text" class="modal-input" id="manage-note" maxlength="${NOTE_MAX}"
                       value="${escapeHtml(entry.note || '')}"
                       placeholder="${escapeHtml(T('chatNotePlaceholder', null, '聊天备注（不超过 30 字）'))}">
            </div>
            <div class="manage-row">
                <span class="manage-label">${escapeHtml(T('chatTagsLabel', null, '标签'))}</span>
                <input type="text" class="modal-input" id="manage-tags"
                       value="${escapeHtml((entry.tags || []).join(', '))}"
                       placeholder="${escapeHtml(T('chatTagsPlaceholder', null, '标签，用逗号分隔，如：主线, 甜, 虐'))}">
            </div>
            <div class="manage-row">
                <span class="manage-label">${escapeHtml(T('chatGroupLabel', null, '分组'))}</span>
                <select class="modal-input" id="manage-group">
                    <option value=""${entry.groupId ? '' : ' selected'}>${escapeHtml(T('chatGroupNone', null, '不分组'))}</option>
                    ${groupOptions}
                    <option value="__new__">${escapeHtml(T('chatGroupNew', null, '＋ 新建分组'))}</option>
                </select>
            </div>
            <div class="manage-row" id="manage-group-new-row" style="display:none;">
                <span class="manage-label"></span>
                <input type="text" class="modal-input" id="manage-group-new" maxlength="20"
                       placeholder="${escapeHtml(T('chatGroupNewPlaceholder', null, '新分组名称'))}">
            </div>
            <div class="manage-row">
                <span class="manage-label">${escapeHtml(T('chatModeLabel', null, '模式'))}</span>
                <select class="modal-input" id="manage-mode">
                    <option value="edit"${mode === 'edit' ? ' selected' : ''}>${escapeHtml(T('chatModeEdit', null, '编辑模式'))}</option>
                    <option value="play"${mode === 'play' ? ' selected' : ''}>${escapeHtml(T('chatModePlay', null, '播放模式'))}</option>
                </select>
            </div>
            <div class="setting-hint" style="margin:-4px 0 10px;">${escapeHtml(T('chatModePlayHint', null, '播放模式：打开聊天后自动播放，不能修改聊天内容。'))}</div>
            <div class="manage-row manage-row-inline">
                <span class="manage-label">${escapeHtml(T('chatPinnedLabel', null, '置顶聊天'))}</span>
                <label class="switch">
                    <input type="checkbox" id="manage-pinned" class="switch-input"${entry.pinned ? ' checked' : ''}>
                    <span class="switch-track"></span>
                </label>
            </div>
            <div class="manage-row">
                <span class="manage-label">${escapeHtml(T('unreadPlaceholder', null, '未读'))}</span>
                <input type="number" class="modal-input" id="set-unread-input"
                       min="0" value="${entry.unread || 0}"
                       placeholder="${escapeHtml(T('unreadPlaceholder', null, '未读数量（仅列表显示）'))}">
            </div>
        </div>
    `;

    showModal(T('manageTitle', null, '管理会话'), html, [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: closeModal },
        {
            text: T('manageClear', null, '清空记录'), class: 'danger',
            onClick: () => {
                delete chats[chatId];
                entry.unread = 0; // 消息都清空了，未读角标不应该还留着
                saveMyStudents();
                saveChats();
                renderContactList();
                closeModal();
            }
        },
        {
            text: T('manageRemove', null, '移出列表'), class: 'danger',
            onClick: () => {
                myStudents = myStudents.filter(s => s.id !== chatId);
                delete chats[chatId];
                delete progressMap[chatId];
                saveProgressMap();
                saveMyStudents();
                saveChats();
                renderContactList();
                closeModal();
            }
        },
        {
            text: T('manageSave', null, '保存'), class: 'confirm',
            onClick: () => {
                const noteEl = document.getElementById('manage-note');
                const tagsEl = document.getElementById('manage-tags');
                const groupEl = document.getElementById('manage-group');
                const groupNewEl = document.getElementById('manage-group-new');
                const modeEl = document.getElementById('manage-mode');
                const pinnedEl = document.getElementById('manage-pinned');
                const unreadEl = document.getElementById('set-unread-input');

                // 分组：选了「新建分组」时创建并归入
                let groupId = groupEl ? groupEl.value : '';
                if (groupId === '__new__') {
                    const name = groupNewEl ? Array.from(groupNewEl.value.trim()).slice(0, 20).join('') : '';
                    if (!name) {
                        showToast(T('groupNameRequired', null, '请输入分组名称'));
                        return;
                    }
                    const exist = groups.find(g => g.name === name);
                    if (exist) {
                        groupId = exist.id;
                    } else {
                        groupId = 'g_' + Date.now().toString(36);
                        groups.push({ id: groupId, name: name, order: groups.length });
                        saveGroups();
                    }
                } else if (groupId && !groupById(groupId)) {
                    groupId = '';
                }

                entry.note = normalizeNote(noteEl ? noteEl.value : '');
                entry.tags = normalizeTags(tagsEl ? tagsEl.value : '');
                entry.groupId = groupId;
                entry.pinned = !!(pinnedEl && pinnedEl.checked);

                const newMode = normalizeChatMode(modeEl ? modeEl.value : 'edit');
                if (newMode !== normalizeChatMode(entry.mode)) {
                    entry.mode = newMode;
                    // 切换模式后旧的播放进度不再适用
                    delete progressMap[chatId];
                    saveProgressMap();
                } else {
                    entry.mode = newMode;
                }

                const v = unreadEl ? parseInt(unreadEl.value, 10) : 0;
                entry.unread = Number.isFinite(v) && v > 0 ? v : 0;

                saveMyStudents();
                renderContactList();
                closeModal();
                if (entry.mode === 'play') {
                    showToast(T('playModeNoEdit', null, '播放模式不允许修改聊天内容'));
                }
            }
        }
    ]);

    const sel = document.getElementById('manage-group');
    if (sel) {
        sel.addEventListener('change', () => {
            const row = document.getElementById('manage-group-new-row');
            if (row) row.style.display = sel.value === '__new__' ? '' : 'none';
            if (sel.value === '__new__') {
                const input = document.getElementById('manage-group-new');
                if (input) setTimeout(() => input.focus(), 50);
            }
        });
    }
}

/* ================= 分组管理 ================= */

function openGroupManager() {
    const render = () => {
        const rows = groups.length
            ? groups.map(g => `
                <div class="group-row" data-group-id="${escapeHtml(g.id)}">
                    <input type="text" class="modal-input group-name-input" maxlength="20" value="${escapeHtml(g.name)}">
                    <button type="button" class="box-edit-op" data-op="rename">${escapeHtml(T('groupRename', null, '重命名'))}</button>
                    <button type="button" class="box-edit-op danger" data-op="delete">${escapeHtml(T('groupDelete', null, '删除'))}</button>
                </div>`).join('')
            : `<div class="group-empty">${escapeHtml(T('groupManageEmpty', null, '还没有分组，先在下面新建一个吧'))}</div>`;
        return `
            <div class="group-manager">
                ${rows}
                <div class="group-add-row">
                    <input type="text" class="modal-input" id="group-add-name" maxlength="20"
                           placeholder="${escapeHtml(T('groupNamePlaceholder', null, '分组名称'))}">
                    <button type="button" class="box-action-btn" id="group-add-btn">${escapeHtml(T('groupManageAdd', null, '＋ 新建分组'))}</button>
                </div>
            </div>`;
    };

    showModal(T('groupManageTitle', null, '分组管理'), render(), [
        {
            text: T('closeBtn', null, '关闭'), class: 'confirm',
            onClick: () => { closeModal(); renderContactList(); }
        }
    ]);

    const body = document.getElementById('modal-body');
    const refresh = () => {
        const html = render();
        body.innerHTML = html;
    };

    // 注意：modal-body 是常驻元素，这里必须用 onclick 覆盖而不是 addEventListener，
    // 否则每次打开分组管理都会叠加一个监听器（点一次新建会建两个分组）
    body.onclick = e => {
        const addBtn = e.target.closest('#group-add-btn');
        if (addBtn) {
            const input = document.getElementById('group-add-name');
            const name = Array.from((input ? input.value : '').trim()).slice(0, 20).join('');
            if (!name) { showToast(T('groupNameRequired', null, '请输入分组名称')); return; }
            if (groups.some(g => g.name === name)) { showToast(T('groupNameExists', null, '已有同名分组')); return; }
            groups.push({ id: 'g_' + Date.now().toString(36), name: name, order: groups.length });
            saveGroups();
            refresh();
            return;
        }
        const row = e.target.closest('.group-row');
        if (!row) return;
        const id = row.dataset.groupId;
        const group = groupById(id);
        if (!group) return;
        const op = e.target.closest('[data-op]');
        if (!op) return;
        if (op.dataset.op === 'rename') {
            const input = row.querySelector('.group-name-input');
            const name = Array.from((input ? input.value.trim() : '')).slice(0, 20).join('');
            if (!name) { showToast(T('groupNameRequired', null, '请输入分组名称')); return; }
            if (groups.some(g => g.name === name && g.id !== id)) {
                showToast(T('groupNameExists', null, '已有同名分组'));
                return;
            }
            group.name = name;
            saveGroups();
            refresh();
            return;
        }
        if (op.dataset.op === 'delete') {
            const name = group.name;
            confirmModal(T('groupDelete', null, '删除'),
                escapeHtml(T('groupDeleteConfirm', { name: name }, '确定删除分组「{name}」吗？组内聊天会回到「未分组」。')),
                () => {
                    groups = groups.filter(g => g.id !== id);
                    myStudents.forEach(entry => {
                        if (entry.groupId === id) entry.groupId = '';
                    });
                    saveGroups();
                    saveMyStudents();
                    renderContactList();
                    openGroupManager();
                });
        }
    };
}

function openStudentPicker() {
    if (!libraryReady) {
        showModal(T('notReadyTitle', null, '提示'),
            `<div style="text-align:center;color:#888;font-size:14px;line-height:1.8;">${escapeHtml(T('notReadyBody', null, '学生资料尚未加载完成。'))}</div>`,
            [{ text: T('notReadyOk', null, '知道了'), class: 'confirm', onClick: closeModal }]);
        return;
    }

    const html = `
        <div class="picker-wrap">
            <input type="text" class="modal-input" id="picker-search"
                   placeholder="${escapeHtml(T('pickerPlaceholder', null, '搜索学生姓名或形态…'))}"
                   autocomplete="off" style="margin-bottom:8px;">
            <div class="picker-list" id="picker-list"></div>
        </div>
    `;

    showModal(T('pickerTitle', null, '选择学生形态'), html, [
        { text: T('pickerDone', null, '完成'), class: 'confirm', onClick: () => { closeModal(); renderContactList(); } }
    ]);

    renderPickerList('');

    const input = document.getElementById('picker-search');
    input.addEventListener('input', () => renderPickerList(input.value.trim()));
    setTimeout(() => {
        if (modalOverlay.classList.contains('active')) input.focus();
    }, 100);
}

function renderPickerList(query) {
    const box = document.getElementById('picker-list');
    if (!box) return;

    // 同一角色允许多个会话：这里按 studentId 标记「已添加过」，但点击仍可再添加一个新会话
    const addedSet = new Set(myStudents.map(s => s.studentId));
    const q = query.toLowerCase();

    let items = library;
    if (q) items = items.filter(s => matchStudent(s, q));

    const MAX = 400;
    const limited = items.slice(0, MAX);

    if (limited.length === 0) {
        box.innerHTML = `<div class="picker-empty">${escapeHtml(T('pickerEmpty', null, '没有匹配的学生形态'))}</div>`;
        return;
    }

    const addedTxt = T('pickerAdded', null, '已添加');
    const addTxt = T('pickerAdd', null, '＋ 添加');
    const readdTxt = T('pickerReadd', null, '＋ 再添加一个');

    box.innerHTML = limited.map(s => {
        const added = addedSet.has(s.id);
        const avatar = s.avatar || fallbackAvatar(s.displayName);
        return `<div class="picker-item ${added ? 'added' : ''}" data-id="${s.id}">
            <img class="picker-avatar" src="${escapeHtml(avatar)}"
                 data-fallback="${escapeHtml(fallbackAvatar(s.displayName))}"
                 referrerpolicy="no-referrer" alt="" loading="lazy">
            <div class="picker-name">${escapeHtml(s.displayName)}</div>
            <div class="picker-status">${added ? escapeHtml(readdTxt) : escapeHtml(addTxt)}</div>
        </div>`;
    }).join('') + (items.length > MAX
        ? `<div class="picker-empty">${escapeHtml(T('pickerMore', { n: items.length - MAX }, '还有 {n} 个形态未显示，请输入关键字搜索'))}</div>`
        : '');

    box.querySelectorAll('.picker-item').forEach(el => {
        el.addEventListener('click', () => {
            // 每次点击都新建一个独立会话（重复角色也可多次添加）
            addStudentToMyList(Number(el.dataset.id));
            el.classList.add('added');
            const status = el.querySelector('.picker-status');
            if (status) status.textContent = readdTxt;
            renderContactList();
        });
    });
}

/** 生成会话 id：时间戳 + 角色编号（同一毫秒重复时时间戳递增，保证唯一） */
function newChatId(studentId) {
    let ts = Date.now();
    let id = ts + '_' + studentId;
    while (myStudents.some(s => s.id === id) || Object.prototype.hasOwnProperty.call(chats, id)) {
        ts += 1;
        id = ts + '_' + studentId;
    }
    return id;
}

function addStudentToMyList(studentId) {
    const stuId = Number(studentId);
    if (!libraryById[stuId]) return null;
    const chatId = newChatId(stuId);
    // 新会话排在最前面（手动排序的最小 order - 1）
    myStudents.push({
        id: chatId,
        studentId: stuId,
        unread: 0,
        addedAt: now(),
        note: '',
        tags: [],
        groupId: '',
        pinned: false,
        order: minChatOrder() - 1,
        mode: 'edit'
    });
    if (!Array.isArray(chats[chatId])) chats[chatId] = [];
    saveMyStudents();
    saveChats();
    return chatId;
}

/* ================= 信息盒子：数据模型与工具 ================= */

let playback = null;
let morePanelOpen = false;

function uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const ITEM_TYPES = ['text', 'image', 'emoji', 'reply', 'story', 'narration1', 'narration2'];

function newItem(type, data) {
    const it = { id: uid('i'), type: type };
    data = data || {};
    if (type === 'text') {
        it.text = String(data.text == null ? '' : data.text);
    } else if (type === 'reply') {
        it.title = T('replyTitle', null, '回复');
        let options = Array.isArray(data.options)
            ? data.options.map(x => String(x == null ? '' : x).trim()).filter(Boolean)
            : [];
        if (!options.length && data.text) options = [String(data.text).trim()].filter(Boolean);
        it.options = options;
    } else if (type === 'story') {
        it.title = T('storyTitle', null, '好感故事');
        it.text = String(data.text == null ? '' : data.text);
    } else if (type === 'narration1' || type === 'narration2') {
        it.text = String(data.text == null ? '' : data.text);
    }
    if (type === 'image' || type === 'emoji') it.src = String(data.src == null ? '' : data.src);
    return it;
}

function getReplyOptions(it) {
    if (!it) return [];
    if (Array.isArray(it.options)) {
        const list = it.options.map(x => String(x == null ? '' : x).trim()).filter(Boolean);
        if (list.length) return list;
    }
    const text = String(it.text == null ? '' : it.text).trim();
    return text ? [text] : [];
}

function storyButtonText() {
    const stu = currentStudent();
    return T('storyDefaultBtn', { name: stu ? stu.displayName : '' }, '进入{name}的好感故事');
}

function emptyBox(role) {
    return { id: uid('b'), role: role === 'student' ? 'student' : 'sensei', time: now(), items: [] };
}

function itemSignature(it) {
    return (it.type || '') + ':' + (it.text || '') + ':' + (it.src || '') + ':' + (it.title || '') +
        ':' + (Array.isArray(it.options) ? it.options.join('\u0002') : '');
}

function boxSignature(box) {
    return (box.role || '') + '|' + Number(box.time || 0) + '|' +
        (box.items || []).map(itemSignature).join('\u0001');
}

function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    let type = ITEM_TYPES.indexOf(raw.type) >= 0 ? raw.type : '';
    if (!type) {
        const src = String(raw.src || raw.url || raw.path || '');
        type = src ? (src.indexOf('/emoji/') >= 0 ? 'emoji' : 'image') : 'text';
    }
    const it = { id: (typeof raw.id === 'string' && raw.id) ? raw.id : uid('i'), type: type };
    if (type === 'text') {
        const text = pickString(raw.text != null ? raw.text : raw.content);
        if (!text) return null;
        it.text = text;
    } else if (type === 'reply') {
        let options = Array.isArray(raw.options)
            ? raw.options.map(x => pickString(x)).filter(Boolean)
            : [];
        if (!options.length) {
            const text = pickString(raw.text != null ? raw.text : raw.content);
            if (text) options = [text];
        }
        if (!options.length) return null;
        it.title = T('replyTitle', null, '回复');
        it.options = options;
    } else if (type === 'story') {
        // 好感故事文案不保存自定义内容：渲染时按当前学生重新生成
        it.title = T('storyTitle', null, '好感故事');
        it.text = '';
    } else if (type === 'narration1' || type === 'narration2') {
        const text = pickString(raw.text != null ? raw.text : raw.content);
        if (!text) return null;
        it.text = text;
    } else {
        const src = pickString(raw.src || raw.url || raw.path);
        if (!src) return null;
        it.src = src;
    }
    return it;
}

function normalizeBox(raw, fallbackTime) {
    if (!raw || typeof raw !== 'object') return null;
    const role = raw.role === 'student' ? 'student' : (raw.role === 'sensei' ? 'sensei' : '');
    if (!role) return null;
    const items = (Array.isArray(raw.items) ? raw.items : []).map(normalizeItem).filter(Boolean);
    if (!items.length) return null;
    let t = Number(raw.time);
    if (!Number.isFinite(t) || t <= 0) t = fallbackTime || now();
    return {
        id: (typeof raw.id === 'string' && raw.id) ? raw.id : uid('b'),
        role: role,
        time: t,
        items: items
    };
}

// 旧版扁平消息数组 → 信息盒子（连续同角色合并）
function legacyMessagesToBoxes(arr) {
    const boxes = [];
    let cur = null;
    arr.forEach((m, i) => {
        if (!m || typeof m !== 'object') return;
        const role = m.role === 'student' ? 'student' : (m.role === 'sensei' ? 'sensei' : '');
        if (!role) return;
        const rawText = m.text == null ? '' : String(m.text);
        const text = rawText.trim();
        if (!text) return;
        const item = isImageUrl(text)
            ? { id: uid('i'), type: 'image', src: text }
            : { id: uid('i'), type: 'text', text: rawText };
        const rawTime = Number(m.time);
        const time = (Number.isFinite(rawTime) && rawTime > 0) ? rawTime : now() + i;
        if (!cur || cur.role !== role) {
            cur = { id: uid('b'), role: role, time: time, items: [] };
            boxes.push(cur);
        }
        cur.items.push(item);
        cur.time = time;
    });
    return boxes;
}

function sanitizeChats(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    const base = now();
    Object.keys(raw).forEach(k => {
        const arr = raw[k];
        if (!Array.isArray(arr)) return;
        const looksLikeBoxes = arr.some(x => x && typeof x === 'object' && Array.isArray(x.items));
        const boxes = looksLikeBoxes
            ? arr.map((b, i) => normalizeBox(b, base + i)).filter(Boolean)
            : legacyMessagesToBoxes(arr);
        if (boxes.length) {
            boxes.sort((a, b) => a.time - b.time);
            out[k] = boxes;
        }
    });
    return out;
}

function cloneBoxes(boxes) {
    try { return JSON.parse(JSON.stringify(boxes || [])); }
    catch (e) { return []; }
}

// 列表预览 / 排序
function getLastMsg(studentId) {
    const arr = chats[studentId];
    if (!arr || !arr.length) return null;
    const box = arr[arr.length - 1];
    return { role: box.role, text: boxText(box), time: box.time };
}

function boxText(box) {
    if (!box || !Array.isArray(box.items) || !box.items.length) return '';
    const it = box.items[box.items.length - 1];
    if (it.type === 'image') return T('imagePlaceholder', null, '[图片]');
    if (it.type === 'emoji') return T('emojiPlaceholder', null, '[表情]');
    if (it.type === 'reply') return getReplyOptions(it)[0] || T('replyTitle', null, '回复');
    if (it.type === 'story') return storyButtonText();
    if (it.type === 'narration1' || it.type === 'narration2') return it.text || '';
    return it.text || '';
}

function itemPreview(it) {
    if (it.type === 'image') return T('imagePlaceholder', null, '[图片]');
    if (it.type === 'emoji') return T('emojiPlaceholder', null, '[表情]');
    if (it.type === 'reply') return getReplyOptions(it).join(' / ');
    if (it.type === 'story') return storyButtonText();
    return it.text || '';
}

function itemTypeLabel(type) {
    const map = {
        text: T('itemTypeText', null, '文本'),
        image: T('itemTypeImage', null, '图片'),
        emoji: T('itemTypeEmoji', null, '表情'),
        reply: T('itemTypeReply', null, '回复'),
        story: T('itemTypeStory', null, '好感'),
        narration1: T('itemTypeNarration1', null, '旁白1'),
        narration2: T('itemTypeNarration2', null, '旁白2')
    };
    return map[type] || type;
}

function canEditItem(type) {
    // 回复可以编辑选项；好感故事固定为「进入{学生名}的好感故事」，不可编辑；
    // 旁白1 / 旁白2 是普通文本，可以编辑。
    return type === 'text' || type === 'reply' || type === 'narration1' || type === 'narration2';
}

// 需要整盒居中的信息类型：回复框、好感故事框、旁白1、旁白2
function isCenterItemType(type) {
    return type === 'reply' || type === 'story' || type === 'narration1' || type === 'narration2';
}

/* ---------- 追加限制：回复 / 好感故事 / 旁白 之后不允许追加信息 ---------- */

function boxLastItem(box) {
    if (!box || !Array.isArray(box.items) || !box.items.length) return null;
    return box.items[box.items.length - 1];
}

function canAppendToBox(box) {
    const it = boxLastItem(box);
    if (!it) return false;
    return !isCenterItemType(it.type);
}

function centerCardLabel(type) {
    if (type === 'reply') return T('itemTypeReply', null, '回复');
    if (type === 'story') return T('itemTypeStory', null, '好感故事');
    if (type === 'narration1' || type === 'narration2') return T('appendLabelNarration', null, '旁白');
    return '';
}

function notifyAppendBlocked(type) {
    showToast(T('appendBlockedAfterCard', { label: centerCardLabel(type) },
        '「{label}」后面不能追加信息，请用「发送」新建一条'));
}

/** 输入区「追加」按钮：卡片类消息后置灰并提示原因（点击会说明，不会静默失败） */
function updateAppendButtonState() {
    const btn = document.getElementById('append-btn');
    if (!btn) return;
    const playMode = !!(currentStudentId && isPlayChat(currentStudentId));
    const boxes = currentStudentId ? chatBoxes() : [];
    const last = boxes.length ? boxes[boxes.length - 1] : null;
    const ok = !playback && !playMode && !!currentStudentId && canAppendToBox(last);
    btn.classList.toggle('blocked', !ok);
    btn.title = ok
        ? T('appendBtn', null, '追加')
        : T('appendUnavailableHint', null, '「回复 / 好感故事 / 旁白」后面不能追加信息');
}

function currentStudent() {
    if (!currentStudentId) return null;
    // currentStudentId 现在是「会话 id」（时间戳_角色编号），学生资料要按 entry.studentId 查
    const entry = myStudents.find(s => s.id === currentStudentId);
    const stuId = entry ? entry.studentId : Number(currentStudentId);
    return libraryById[stuId] || null;
}

function chatBoxes() {
    if (!currentStudentId) return [];
    if (!Array.isArray(chats[currentStudentId])) chats[currentStudentId] = [];
    return chats[currentStudentId];
}

/* ================= 聊天页渲染 ================= */

function findChatEntry(chatId) {
    const key = String(chatId);
    return myStudents.find(s => s.id === key) || null;
}

function openChat(chatId) {
    let entry = findChatEntry(chatId);
    if (!entry) {
        // 兼容旧调用方（例如调试钩子/旧代码传学生 id）：打开该学生的第一个会话
        const stuId = Number(chatId);
        entry = myStudents.find(s => s.studentId === stuId) || null;
    }
    if (!entry) return;
    const stu = libraryById[entry.studentId];
    if (!stu) return;
    const actualChatId = entry.id;

    stopPlayback(true);
    closeMorePanel();

    currentStudentId = actualChatId;
    currentRole = 'sensei';
    updateRoleUI();

    const headerAvatar = document.getElementById('chat-header-avatar');
    headerAvatar.dataset.fallback = fallbackAvatar(stu.displayName);
    headerAvatar.removeAttribute('data-retries');
    headerAvatar.src = stu.avatar || fallbackAvatar(stu.displayName);
    document.getElementById('chat-header-name').textContent = stu.displayName;

    if (entry.unread) {
        entry.unread = 0;
        saveMyStudents();
    }

    document.getElementById('list-page').classList.add('slide-out');
    document.getElementById('chat-page').classList.add('slide-in');
    document.querySelector('.bottom-nav').classList.add('hidden');

    renderChat();
    applyChatModeUI();
    resetPlayButton();

    // 播放模式：打开聊天后立刻开始播放（有未播完的进度则接着播）
    if (isPlayChat(actualChatId)) {
        const prog = chatProgress(actualChatId);
        if (!prog || !prog.finished) {
            const openId = actualChatId;
            setTimeout(() => {
                if (currentStudentId === openId && !playback) startPlayback({ playMode: true });
            }, 40);
        }
    }
}

function closeChat() {
    if (!currentStudentId) return;

    // 需求 6：自动备份（默认关闭）
    if (settings.autoBackup) autoBackup();

    stopPlayback(true);
    closeMorePanel();
    resetPlayButton();

    const page = document.getElementById('chat-page');
    page.classList.remove('slide-in');
    page.style.transform = '';
    document.getElementById('list-page').classList.remove('slide-out');
    document.querySelector('.bottom-nav').classList.remove('hidden');

    // 清掉输入框：否则给 A 写的草稿会留在框里，打开 B 后一回车就发给了 B
    const input = document.getElementById('chat-input');
    if (input) { input.value = ''; input.style.height = 'auto'; }
    currentStudentId = null;
    applyChatModeUI();
    resetPlayButton();
    renderContactList();
}

function scrollChatToBottom(container) {
    const el = container || document.getElementById('chat-content');
    if (!el) return;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function boxHtml(box) {
    const stu = currentStudent();
    const isSensei = box.role === 'sensei';
    const studentName = stu ? stu.displayName : '';
    const avatar = stu ? (stu.avatar || fallbackAvatar(stu.displayName)) : fallbackAvatar('?');
    const avatarFallback = stu ? fallbackAvatar(stu.displayName) : fallbackAvatar('?');
    const hasCard = (box.items || []).some(it => isCenterItemType(it.type));

    const itemsHtml = (box.items || []).map(it =>
        `<div class="msg-item" data-item-id="${escapeHtml(it.id)}">${itemHtml(it)}</div>`
    ).join('');

    const avatarHtml = isSensei ? '' :
        `<img class="box-avatar" src="${escapeHtml(avatar)}" data-fallback="${escapeHtml(avatarFallback)}"
              referrerpolicy="no-referrer" alt="">`;
    // 老师消息不显示名字/标签（只有气泡）；学生消息显示名字
    const nameHtml = isSensei ? '' : `<div class="box-name">${escapeHtml(studentName)}</div>`;

    return `<div class="msg-box ${isSensei ? 'sensei' : 'student'}${hasCard ? ' card-box' : ''}" data-box-id="${escapeHtml(box.id)}">
        ${avatarHtml}
        <div class="box-body">
            ${nameHtml}
            <div class="box-items">${itemsHtml}</div>
        </div>
    </div>`;
}

function itemHtml(it) {
    if (it.type === 'image') {
        return `<div class="msg-image-wrapper">
            <img class="msg-image" src="${escapeHtml(it.src)}" data-fallback="${escapeHtml(brokenImage())}"
                 referrerpolicy="no-referrer" alt="img" loading="lazy">
        </div>`;
    }
    if (it.type === 'emoji') {
        return `<div class="emoji-bubble">
            <img class="emoji-img" src="${escapeHtml(it.src)}" data-fallback="${escapeHtml(brokenImage())}"
                 referrerpolicy="no-referrer" alt="" loading="lazy">
        </div>`;
    }
    if (it.type === 'reply') {
        const options = getReplyOptions(it);
        const optsHtml = options.map((opt, i) =>
            `<button type="button" class="reply-option" data-option-index="${i}">${escapeHtml(opt)}</button>`
        ).join('');
        return `<div class="reply-panel">
            <div class="reply-label"><span class="reply-bar"></span>${escapeHtml(T('replyTitle', null, '回复'))}</div>
            <div class="reply-options">${optsHtml}</div>
        </div>`;
    }
    if (it.type === 'story') {
        // 参考游戏原版：浅粉卡片 + 粉色竖条「好感故事」标题 + 粉色按钮
        return `<div class="story-panel">
            <svg class="story-heart" viewBox="0 0 32 28" aria-hidden="true"><path d="M16 28S0 18.7 0 9.5C0 4.3 3.8 0 8.6 0c3 0 5.7 1.6 7.4 4.1C17.7 1.6 20.4 0 23.4 0 28.2 0 32 4.3 32 9.5 32 18.7 16 28 16 28Z"/></svg>
            <div class="story-label"><span class="story-bar"></span>${escapeHtml(T('storyTitle', null, '好感故事'))}</div>
            <div class="story-btn">
                <span class="story-btn-text">${escapeHtml(storyButtonText())}</span>
            </div>
        </div>`;
    }
    if (it.type === 'narration1' || it.type === 'narration2') {
        return `<div class="narration ${it.type === 'narration2' ? 'narration2' : 'narration1'}">${escapeHtml(it.text || '')}</div>`;
    }
    return `<div class="msg-bubble">${escapeHtml(it.text)}</div>`;
}

function renderChat() {
    if (!currentStudentId) return;
    if (playback) return;
    const stu = currentStudent();
    if (!stu) return;

    const container = document.getElementById('chat-content');
    const rawBoxes = chatBoxes();
    // 播放模式：已选择过的回复直接显示为消息（结束后回复框不复原）
    const boxes = isPlayChat(currentStudentId)
        ? displayBoxesForPlayMode(currentStudentId, rawBoxes)
        : rawBoxes;

    if (!boxes.length) {
        const intro = (stu.introduction || '').trim();
        container.innerHTML = `<div class="empty-tip" style="margin-top:40px;">
            ${escapeHtml(T('chatEmpty', { name: stu.displayName }, '与 {name} 的聊天从这里开始'))}
            ${intro ? `<div style="margin-top:12px;font-size:13px;color:#bbb;line-height:1.7;white-space:pre-wrap;">${escapeHtml(intro)}</div>` : ''}
        </div>`;
        updateAppendButtonState();
        return;
    }

    container.innerHTML = boxes.map(boxHtml).join('');
    bindImageAutoScroll(container);
    scrollChatToBottom(container);
    updateAppendButtonState();
}

// 图片是懒加载/异步加载的：加载完成后如果用户仍在底部附近，就继续贴底，
// 否则（用户正在往上翻）不要打扰。
function bindImageAutoScroll(container) {
    container.querySelectorAll('img').forEach(img => {
        if (img.complete) return;
        img.addEventListener('load', () => {
            if (!currentStudentId || playback) return;
            const remain = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (remain < 200) container.scrollTop = container.scrollHeight;
        }, { once: true });
    });
}

/* ================= 发送 / 追加 ================= */

function commitSendText(text, append) {
    if (!currentStudentId) return;
    const boxes = chatBoxes();
    // 兜底：卡片类消息（回复 / 好感故事 / 旁白）之后不允许追加，退回「新建一条」
    if (append && boxes.length && !canAppendToBox(boxes[boxes.length - 1])) {
        append = false;
    }
    if (append && boxes.length) {
        const box = boxes[boxes.length - 1];
        box.items.push(newItem('text', { text: text }));
        box.time = now();
    } else {
        const box = emptyBox(currentRole);
        box.items.push(newItem('text', { text: text }));
        boxes.push(box);
    }
    saveChats();
    renderChat();
}

function sendMessage(mode) {
    if (!currentStudentId || playback) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    closeMorePanel();

    const boxes = chatBoxes();
    const append = mode === 'append';

    if (append && boxes.length) {
        const last = boxes[boxes.length - 1];
        const lastItem = boxLastItem(last);
        // 需求：「回复 / 好感故事 / 旁白」后面不允许追加信息
        if (lastItem && isCenterItemType(lastItem.type)) {
            notifyAppendBlocked(lastItem.type);
            return;
        }
        if (last.role !== currentRole) {
            const stu = currentStudent();
            const lastLabel = last.role === 'sensei'
                ? T('roleSensei', null, '老师')
                : (stu ? stu.shortName : T('roleStudent', null, '学生'));
            const curLabel = currentRole === 'sensei'
                ? T('roleSensei', null, '老师')
                : (stu ? stu.shortName : T('roleStudent', null, '学生'));
            showModal(T('appendMismatchTitle', null, '发送者不一致'),
                `<div style="font-size:13px;color:#666;line-height:1.8;text-align:left;">
                    ${escapeHtml(T('appendMismatchBody', { last: lastLabel, cur: curLabel },
                        '上一个信息盒子来自 {last}，当前身份是 {cur}。要怎么做？'))}
                </div>`, [
                    {
                        text: T('appendNewBox', null, '新建盒子'), class: 'cancel',
                        onClick: () => {
                            closeModal();
                            input.value = '';
                            input.style.height = 'auto';
                            commitSendText(text, false);
                        }
                    },
                    {
                        text: T('appendConvert', null, '改身份并追加'), class: 'confirm',
                        onClick: () => {
                            closeModal();
                            last.role = currentRole;
                            input.value = '';
                            input.style.height = 'auto';
                            commitSendText(text, true);
                        }
                    }
                ]);
            return;
        }
    }

    input.value = '';
    input.style.height = 'auto';
    commitSendText(text, append && boxes.length > 0);
}

function handleKeyDown(e) {
    // 中文/日文输入法组字过程中按回车是"确认候选词"，不能当作发送
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage('new');
    }
}

document.getElementById('chat-input').addEventListener('input', function () {
    this.style.height = 'auto';

});

function setMorePanel(open, sub) {
    morePanelOpen = !!open;
    const panel = document.getElementById('more-panel');
    const btn = document.getElementById('btn-more');
    if (!panel || !btn) return;
    panel.classList.toggle('open', morePanelOpen);
    btn.classList.toggle('open', morePanelOpen);

        panel.classList.remove('emoji-open');
        return;
    }
    if (sub === 'emoji') {
        panel.classList.add('emoji-open');

    } else {
        panel.classList.remove('emoji-open');
    }
}

function closeMorePanel() {
    if (morePanelOpen) setMorePanel(false);
}

function toggleMorePanel(ev) {
    if (ev) ev.stopPropagation();
    if (!currentStudentId || playback) return;
    if (morePanelOpen) {
        closeMorePanel();
    } else {
        setMorePanel(true);
    }
}

function onMoreAction(action) {
    if (!currentStudentId || playback) return;
    const panel = document.getElementById('more-panel');
    if (action === 'emoji') {
        if (!panel.classList.contains('open')) {
            setMorePanel(true, 'emoji');
            return;
        }
        const opened = panel.classList.toggle('emoji-open');
        if (opened) renderEmojiGrid();
        return;
    }
    if (action === 'image') {
        const fileInput = document.getElementById('file-image');
        if (fileInput) fileInput.click();
        return;
    }
    if (action === 'reply') {
        if (currentRole !== 'sensei') {
            showToast(T('onlySenseiReply', null, '「回复框」只有老师可以发送'));
            return;
        }
        openReplyEditor();
        return;
    }
    if (action === 'story') {
        if (currentRole !== 'sensei') {
            showToast(T('onlySenseiStory', null, '「好感故事框」只有老师可以发送'));
            return;
        }
        sendStoryItem();
        return;
    }
    if (action === 'narration1' || action === 'narration2') {
        openNarrationEditor(action);
        return;
    }
    if (action === 'diff') {
        if (currentRole !== 'student') {
            showToast(T('onlyStudentDiff', null, '「表情差分」只有学生可以发送'));
            return;
        }
        openDiffPicker();

function compressImage(dataUrl, maxSide, quality) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                let w = img.naturalWidth || img.width;
                let h = img.naturalHeight || img.height;
                if (!w || !h) throw new Error('图片尺寸无效');
                const scale = Math.min(1, maxSide / Math.max(w, h));
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('图片解析失败'));
        img.src = dataUrl;
    });
}

function onLocalImage(event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type || '')) {
        showToast(T('localImageInvalid', null, '请选择图片文件'));
        return;
    }
    const reader = new FileReader();
    reader.onload = function (e) {
        compressImage(String(e.target.result), 800, 0.72).then(dataUrl => {
            if (!currentStudentId) return;
            const box = emptyBox(currentRole);
            box.items.push(newItem('image', { src: dataUrl }));
            chatBoxes().push(box);
            saveChats();
            renderChat();
            closeMorePanel();
        }).catch(err => {
            console.error('图片处理失败：', err);
            showToast(T('localImageFail', null, '图片处理失败'));
        });
    };
    reader.onerror = () => showToast(T('localImageFail', null, '图片读取失败'));
    reader.readAsDataURL(file);
}

function sendSpecialItem(type, data) {
    if (!currentStudentId) return;
    const box = emptyBox(currentRole);
    box.items.push(newItem(type, data));
    chatBoxes().push(box);
    saveChats();
    renderChat();
}

function openReplyEditor(boxId, itemId) {
    const editing = !!(boxId && itemId);
    let box = null, item = null;
    if (editing) {
        box = findBox(boxId);
        item = box ? findItem(box, itemId) : null;
        if (!box || !item) return;
    }

    // 需求：打开回复框编辑器时默认是空白的，不再预填示例选项
    let options = editing ? getReplyOptions(item).slice() : [''];
    if (!options.length) options = [''];

    const renderRows = list => list.map((text, i) => `
        <div class="reply-option-row" data-row="${i}">
            <span class="reply-option-index">${i + 1}</span>
            <input type="text" class="form-input reply-option-input" maxlength="80"
                   value="${escapeHtml(text)}" placeholder="${escapeHtml(T('replyOptionPlaceholder', null, '输入一个回复选项…'))}">
            <button type="button" class="box-edit-op danger" data-remove-option="${i}">${escapeHtml(T('itemDelete', null, '删除'))}</button>
        </div>
    `).join('');

    const bodyHtml = () => `
        <div class="form-field">
            <label class="form-label">${escapeHtml(T('replyOptionsLabel', null, '回复选项（可添加多个）'))}</label>
            <div class="reply-option-editor" id="reply-option-editor">${renderRows(options)}</div>
            <button type="button" class="box-action-btn" id="reply-add-option" style="width:100%;margin-top:8px;">${escapeHtml(T('replyAddOption', null, '＋ 添加选项'))}</button>
        </div>
        <div class="setting-hint">${escapeHtml(T('replyOptionsHint', null, '玩家点击其中一个选项后，该选项会作为消息发出；播放模式中必须选择后才能继续。'))}</div>
    `;

    showModal(editing ? T('replyEditTitle', null, '编辑回复框') : T('replySendTitle', null, '发送回复框'), bodyHtml(), [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: closeModal },
        {
            text: editing ? T('editSave', null, '保存') : T('sendBtn', null, '发送'),
            class: 'confirm',
            onClick: () => {
                const inputs = Array.from(document.querySelectorAll('#reply-option-editor .reply-option-input'));
                const values = inputs.map(el => el.value.trim()).filter(Boolean);
                if (!values.length) {
                    showToast(T('replyEmpty', null, '至少填写一个回复选项'));
                    return;
                }
                closeModal();
                if (editing) {
                    box = findBox(boxId);
                    item = box ? findItem(box, itemId) : null;
                    if (!item) return;
                    item.options = values;
                    item.title = T('replyTitle', null, '回复');
                    delete item.text;
                    box.time = now();
                    saveChats();
                    renderChat();
                } else {
                    const newBox = emptyBox(currentRole);
                    newBox.items.push(newItem('reply', { options: values }));
                    chatBoxes().push(newBox);
                    saveChats();
                    renderChat();
                    closeMorePanel();
                }
            }
        }
    ]);

    const body = document.getElementById('modal-body');
    body.onclick = e => {
        const remove = e.target.closest('[data-remove-option]');
        if (remove) {
            const current = Array.from(body.querySelectorAll('.reply-option-input')).map(el => el.value);
            if (current.length <= 1) {
                showToast(T('replyAtLeastOne', null, '至少保留一个回复选项'));
                return;
            }
            current.splice(Number(remove.dataset.removeOption), 1);
            options = current;
            document.getElementById('reply-option-editor').innerHTML = renderRows(options);
            return;
        }
        if (e.target.closest('#reply-add-option')) {
            const current = Array.from(body.querySelectorAll('.reply-option-input')).map(el => el.value);
            if (current.length >= 6) {
                showToast(T('replyMaxOptions', null, '最多添加 6 个选项'));
                return;
            }
            current.push('');
            options = current;
            document.getElementById('reply-option-editor').innerHTML = renderRows(options);
            const inputs = body.querySelectorAll('.reply-option-input');
            if (inputs.length) inputs[inputs.length - 1].focus();
        }
    };
}

// 旁白1 / 旁白2：居中显示的说明文字（旁白1 淡灰小字，旁白2 灰底黑字）
function openNarrationEditor(type, boxId, itemId) {
    if (!currentStudentId) return;
    const isType2 = type === 'narration2';
    const editing = !!(boxId && itemId);
    let item = null;

    const hint = isType2
        ? T('narrationHint2', null, '旁白2：居中灰底黑字，适合系统提示、时间说明等。')
        : T('narrationHint1', null, '旁白1：居中淡灰色小字，适合场景或心理描写。');

        },
        {
            text: editing ? T('editSave', null, '保存') : T('sendBtn', null, '发送'),

                    closeModal();

/* ================= 表情差分（仅学生身份可发送，图片来自 students.json 的 gallery） ================= */

function openDiffPicker() {
    if (!currentStudentId) return;
    if (currentRole !== 'student') {
        showToast(T('onlyStudentDiff', null, '「表情差分」只有学生可以发送'));
        return;
    }
    const stu = currentStudent();
    const groups = (stu && Array.isArray(stu.gallery)) ? stu.gallery : [];
    if (!groups.length) {
        showToast(T('noDiff', null, '该学生暂无表情差分'));
        return;
    }
    let active = 0;

    const renderBody = () => {
        const group = groups[active];
        const chips = groups.map((g, i) =>
            `<button type="button" class="diff-chip${i === active ? ' active' : ''}" data-index="${i}">${escapeHtml(g.title)}</button>`
        ).join('');
        const cells = group.images.map(src =>
            `<button type="button" class="diff-cell" data-src="${escapeHtml(src)}">
                <img src="${escapeHtml(src)}" data-fallback="${escapeHtml(brokenImage())}"
                     referrerpolicy="no-referrer" alt="" loading="lazy">
            </button>`
        ).join('');
        return `<div class="diff-wrap"><div class="diff-chips">${chips}</div><div class="diff-grid">${cells}</div></div>`;
    };

    showModal(T('diffTitle', { name: stu.displayName }, '表情差分 · {name}'), renderBody(), [
        { text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }
    ]);

    const body = document.getElementById('modal-body');
    const bind = () => {
        body.querySelectorAll('.diff-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                active = Number(chip.dataset.index) || 0;
                body.innerHTML = renderBody();
                bind();
            });
        });
        body.querySelectorAll('.diff-cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const src = cell.dataset.src;
                if (!src) return;
                closeModal();
                sendDiffImage(src);
            });
        });
    };
    bind();
}

function sendDiffImage(src) {
    if (!currentStudentId || currentRole !== 'student') return;

function focusFormInput(id) {
    if (!modalOverlay.classList.contains('active')) return;

    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* ================= 长按信息盒子：编辑面板 ================= */

function findBox(boxId) {
    return chatBoxes().find(b => b.id === boxId) || null;
}

function findItem(box, itemId) {
    return box ? (box.items.find(it => it.id === itemId) || null) : null;
}

function chooseReplyOption(btn) {
    const boxEl = btn.closest('.msg-box[data-box-id]');
    const itemEl = btn.closest('.msg-item[data-item-id]');
    if (!boxEl || !itemEl) return;
    const boxId = boxEl.dataset.boxId;
    const itemId = itemEl.dataset.itemId;
    const index = Number(btn.dataset.optionIndex) || 0;

    if (playback) {
        resolvePlaybackReply(boxId, itemId, index);
        return;
    }

    // 需求：非播放模式不允许点击回复框。回复框只在播放模式里选择，
    // 否则会把回复选择框永久替换成一条消息，破坏原始聊天数据。
    showToast(T('replyPlayOnly', null, '回复框只能在播放模式中选择'));
}

function openBoxEditor(boxId) {
    if (!currentStudentId || playback) return;
    // 播放模式不允许修改聊天内容（需求 6）
    if (isPlayChat(currentStudentId)) {
        showToast(T('playModeNoEdit', null, '播放模式不允许修改聊天内容'));
        return;
    }
    const boxes = chatBoxes();
    const idx = boxes.findIndex(b => b.id === boxId);
    if (idx < 0) return;
    const box = boxes[idx];
    const stu = currentStudent();
    const isSensei = box.role === 'sensei';
    const senderName = isSensei
        ? T('roleSensei', null, '老师')
        : (stu ? stu.displayName : T('roleStudent', null, '学生'));

    // 「与上一个信息盒子合并」：只有存在上一个盒子、且发送者相同才可用
    const prevBox = idx > 0 ? boxes[idx - 1] : null;
    const canMerge = !!(prevBox && prevBox.role === box.role);
    const mergeDisabled = canMerge ? '' : 'disabled';
    const mergeTitle = canMerge
        ? T('boxMergePrev', null, '与上一个信息盒子合并')
        : (idx === 0
            ? T('boxMergeFirst', null, '这是第一个信息盒子，没有可合并的上一个')
            : T('boxMergeRole', null, '上一个信息盒子发送者不同，无法合并'));

    const itemsHtml = box.items.map((it, i) => `
        <div class="box-edit-row" data-item-id="${escapeHtml(it.id)}">
            <input type="checkbox" class="box-edit-check" data-index="${i}" title="${escapeHtml(T('boxSplitSelect', null, '勾选后可独立为新的信息盒子'))}">
            <span class="box-edit-type">${escapeHtml(itemTypeLabel(it.type))}</span>
            <span class="box-edit-preview">${escapeHtml(itemPreview(it))}</span>
            ${canEditItem(it.type)
                ? `<button class="box-edit-op" type="button" data-op="edit" data-index="${i}">${escapeHtml(T('itemEdit', null, '编辑'))}</button>`
                : ''}
            <button class="box-edit-op danger" type="button" data-op="del" data-index="${i}">${escapeHtml(T('itemDelete', null, '删除'))}</button>
        </div>
    `).join('');

    const html = `
        <div class="box-edit-meta">
            ${escapeHtml(senderName)} · ${escapeHtml(T('boxItemCount', { n: box.items.length }, '共 {n} 条信息'))}
        </div>
        <div class="box-edit-list" id="box-edit-list">${itemsHtml}</div>
        <div class="box-edit-hint">${escapeHtml(T('boxSplitHint', null, '勾选消息后，可把它们独立为另一个信息盒子；未勾选的消息保留在原盒子'))}</div>
        <div class="box-edit-actions">
            <button class="box-action-btn${canAppendToBox(box) ? '' : ' blocked'}" type="button" data-action="append"${canAppendToBox(box) ? '' : ` title="${escapeHtml(T('appendUnavailableHint', null, '「回复 / 好感故事 / 旁白」后面不能追加信息'))}"`}>＋ ${escapeHtml(T('boxAppend', null, '追加信息'))}</button>
            <button class="box-action-btn" type="button" data-action="sender">${escapeHtml(T('boxChangeSender', null, '更换发送者'))}</button>
            <button class="box-action-btn" type="button" data-action="up" ${idx === 0 ? 'disabled' : ''}>↑ ${escapeHtml(T('boxMoveUp', null, '上移'))}</button>
            <button class="box-action-btn" type="button" data-action="down" ${idx === boxes.length - 1 ? 'disabled' : ''}>↓ ${escapeHtml(T('boxMoveDown', null, '下移'))}</button>
            <button class="box-action-btn" type="button" data-action="split" style="grid-column:1 / -1;" disabled>${escapeHtml(T('boxSplit', null, '独立为一个信息盒子'))}</button>
            <button class="box-action-btn" type="button" data-action="merge" style="grid-column:1 / -1;" ${mergeDisabled} title="${escapeHtml(mergeTitle)}">${escapeHtml(T('boxMergePrev', null, '与上一个信息盒子合并'))}</button>
            <button class="box-action-btn danger" type="button" data-action="delete" style="grid-column:1 / -1;">${escapeHtml(T('boxDelete', null, '删除信息盒子'))}</button>
        </div>`;

    showModal(T('boxEditTitle', null, '信息盒子'), html, [
        { text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }
    ]);

    const body = document.getElementById('modal-body');
    body.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => {
            const i = Number(btn.dataset.index);
            const it = box.items[i];
            if (!it) return;
            if (btn.dataset.op === 'edit') {
                if (it.type === 'reply') openReplyEditor(box.id, it.id);
                else if (it.type === 'narration1' || it.type === 'narration2') openNarrationEditor(it.type, box.id, it.id);
                else openTextItemEditor(box.id, it.id);
            } else {
                confirmModal(T('itemDeleteTitle', null, '删除信息'),
                    escapeHtml(T('itemDeleteConfirm', null, '确定删除这条信息吗？')),
                    () => {
                        const realBox = findBox(box.id);
                        if (!realBox) { closeModal(); return; }
                        const at = realBox.items.findIndex(x => x.id === it.id);
                        if (at >= 0) realBox.items.splice(at, 1);
                        if (!realBox.items.length) {
                            const arr = chatBoxes();
                            const bi = arr.findIndex(b => b.id === realBox.id);
                            if (bi >= 0) arr.splice(bi, 1);
                            saveChats();
                            renderChat();
                            closeModal();
                            return;
                        }
                        realBox.time = now();
                        saveChats();
                        renderChat();
                        openBoxEditor(realBox.id);
                    });
            }
        });
    });
    // 多选消息 → 启用「独立为一个信息盒子」
    const splitBtn = body.querySelector('[data-action="split"]');
    const splitChecks = Array.from(body.querySelectorAll('.box-edit-check'));
    const refreshSplit = () => {
        if (!splitBtn) return;
        splitBtn.disabled = !splitChecks.some(c => c.checked);
    };
    splitChecks.forEach(c => c.addEventListener('change', refreshSplit));
    refreshSplit();

    body.querySelectorAll('[data-action]').forEach(btn => {
        const action = btn.dataset.action;
        btn.addEventListener('click', () => {
            const arr = chatBoxes();
            const bi = arr.findIndex(b => b.id === box.id);
            if (bi < 0) { closeModal(); return; }
            const b = arr[bi];
            if (action === 'append') {
                openAppendEditor(b.id);
            } else if (action === 'sender') {
                b.role = b.role === 'sensei' ? 'student' : 'sensei';
                b.time = now();
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'up' && bi > 0) {
                arr.splice(bi - 1, 0, arr.splice(bi, 1)[0]);
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'down' && bi < arr.length - 1) {
                arr.splice(bi + 1, 0, arr.splice(bi, 1)[0]);
                saveChats();
                renderChat();
                openBoxEditor(b.id);
            } else if (action === 'split') {
                const picked = splitChecks
                    .filter(c => c.checked)
                    .map(c => Number(c.dataset.index))
                    .filter(i => Number.isFinite(i) && i >= 0 && i < b.items.length)
                    .sort((x, y) => x - y);
                if (!picked.length) return;
                const pickedSet = new Set(picked);
                const kept = b.items.filter((it, i) => !pickedSet.has(i));
                const moved = b.items.filter((it, i) => pickedSet.has(i));
                if (!moved.length) return;
                const newBox = { id: uid('b'), role: b.role, time: now(), items: moved };
                arr.splice(bi + 1, 0, newBox);
                let targetId = b.id;
                if (!kept.length) {
                    // 全部消息都被独立出去：不留下空盒子，新盒子占据原位置
                    arr.splice(bi, 1);
                    targetId = newBox.id;
                } else {
                    b.items = kept;
                    b.time = now();
                }
                saveChats();
                renderChat();
                showToast(T('boxSplitDone', null, '已独立为一个信息盒子'));
                openBoxEditor(targetId);
            } else if (action === 'merge') {
                if (bi <= 0) return;
                const prev = arr[bi - 1];
                if (!prev || prev.role !== b.role) {
                    showToast(T('boxMergeRole', null, '上一个信息盒子发送者不同，无法合并'));
                    return;
                }
                prev.items = prev.items.concat(b.items);
                prev.time = now();
                arr.splice(bi, 1);
                saveChats();
                renderChat();
                showToast(T('boxMerged', null, '已合并到上一个信息盒子'));
                openBoxEditor(prev.id);
            } else if (action === 'delete') {
                confirmModal(T('boxDeleteTitle', null, '删除信息盒子'),
                    escapeHtml(T('boxDeleteConfirm', null, '确定删除这个信息盒子吗？')),
                    () => {
                        const realArr = chatBoxes();
                        const at = realArr.findIndex(x => x.id === box.id);
                        if (at >= 0) realArr.splice(at, 1);
                        saveChats();
                        renderChat();
                        closeModal();
                    });
            }
        });
    });
}

function openTextItemEditor(boxId, itemId) {
    const box = findBox(boxId);
    const item = box ? findItem(box, itemId) : null;
    if (!box || !item) return;
    const html = `<textarea class="modal-input" id="item-text-input">${escapeHtml(item.text || '')}</textarea>`;
    showModal(T('itemEditTitle', null, '编辑信息'), html, [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: () => openBoxEditor(boxId) },
        {
            text: T('editSave', null, '保存'), class: 'confirm',
            onClick: () => {
                const val = document.getElementById('item-text-input').value.trim();
                if (!val) { showToast(T('replyEmpty', null, '内容不能为空')); return; }
                const realBox = findBox(boxId);
                const realItem = realBox ? findItem(realBox, itemId) : null;
                if (realItem) {
                    realItem.text = val;
                    realBox.time = now();
                    saveChats();
                    renderChat();
                }
                closeModal();
            }
        }
    ]);
    setTimeout(() => focusFormInput('item-text-input'), 100);
}

function openAppendEditor(boxId) {
    const box = findBox(boxId);
    if (!box) return;
    const lastItem = boxLastItem(box);
    if (lastItem && isCenterItemType(lastItem.type)) {
        notifyAppendBlocked(lastItem.type);
        return;
    }
    const html = `<textarea class="modal-input" id="append-text-input" placeholder="${escapeHtml(T('chatPlaceholder', null, '输入消息或图片链接...'))}"></textarea>`;
    showModal(T('boxAppend', null, '追加信息'), html, [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: () => openBoxEditor(boxId) },
        {
            text: T('boxAppendConfirm', null, '追加'), class: 'confirm',
            onClick: () => {
                const val = document.getElementById('append-text-input').value.trim();
                if (!val) { showToast(T('replyEmpty', null, '内容不能为空')); return; }
                const realBox = findBox(boxId);
                if (!realBox) { closeModal(); return; }
                const tail = boxLastItem(realBox);
                if (tail && isCenterItemType(tail.type)) {
                    notifyAppendBlocked(tail.type);
                    return;
                }
                if (realBox) {
                    realBox.items.push(newItem('text', { text: val }));
                    realBox.time = now();
                    saveChats();
                    renderChat();
                }
                closeModal();
            }
        }
    ]);
    setTimeout(() => focusFormInput('append-text-input'), 100);
}

/* ================= 播放（打字动画 / 播放模式） ================= */

function updatePlaybackProgress() {
    const el = document.getElementById('playback-progress');
    if (!el || !playback) return;
    // 需求：播放模式不显示播放进度
    if (playback.playMode) {
        el.textContent = '';
        return;
    }
    if (playback.waitingReply) {
        el.textContent = T('playSelectReply', null, '请选择一个回复以继续');
        return;
    }
    const total = playback.boxes.length;
    const current = Math.min(playback.boxIndex + 1, total);
    el.textContent = T('playbackProgress', { current: current, total: total }, '播放中 {current}/{total}');
}

function resetPlayButton() {
    const btn = document.getElementById('btn-play');
    const txt = document.getElementById('btn-play-text');
    if (btn) btn.classList.remove('playing');
    if (txt) {
        const playMode = !!(currentStudentId && isPlayChat(currentStudentId));
        txt.textContent = playMode ? T('replayBtn', null, '重新播放') : T('playBtn', null, '播放');
    }
    const bar = document.getElementById('playback-bar');
    if (bar) bar.classList.add('hidden');
    const area = document.getElementById('chat-input-area');
    if (area) area.classList.remove('disabled');
    const content = document.getElementById('chat-content');
    if (content) content.classList.remove('playing');
    const page = document.getElementById('chat-page');
    // 需求 7：播放时隐藏发送栏 —— 播放结束后恢复（播放模式由 .play-mode 保持隐藏）
    if (page) page.classList.remove('playing');
    const input = document.getElementById('chat-input');
    if (input) input.disabled = false;
    ['send-btn', 'append-btn', 'btn-more'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
    });
    updateAppendButtonState();
}

function typingBoxHtml() {
    const stu = currentStudent();
    const name = stu ? stu.displayName : '';
    const avatar = stu ? (stu.avatar || fallbackAvatar(stu.displayName)) : '';
    return `<div class="msg-box student typing-box" style="--typing-dur:${settings.animationTime}ms">
        <img class="box-avatar" src="${escapeHtml(avatar)}" referrerpolicy="no-referrer" alt="">
        <div class="box-body">
            <div class="box-name">${escapeHtml(name)}</div>
            <div class="box-items">
                <div class="msg-bubble typing-bubble">
                    <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
                </div>
            </div>
        </div>
    </div>`;
}

let playbackSaveTimer = null;

/** 当前聊天是否处于「播放模式」（打开后自动播放、不允许修改内容） */
function isPlaybackModeChat() {
    return !!(currentStudentId && isPlayChat(currentStudentId));
}

function applyChatModeUI() {
    const page = document.getElementById('chat-page');
    if (!page) return;
    const playMode = isPlaybackModeChat();
    page.classList.toggle('play-mode', playMode);
    const badge = document.getElementById('chat-mode-badge');
    if (badge) {
        badge.textContent = playMode ? T('chatModePlay', null, '播放模式') : '';
        badge.style.display = playMode ? '' : 'none';
    }
    // 播放模式不允许修改聊天内容：发送栏始终隐藏（需求 6 / 7）
    if (playMode && !playback) {
        const area = document.getElementById('chat-input-area');
        if (area) area.classList.add('disabled');
    }
}

/** 把已选过的「回复」替换成普通消息：播放模式结束后回复框不复原（需求 6） */
function applyChoicesToBoxes(boxes, choices) {
    if (!choices || !Object.keys(choices).length) return boxes;
    return boxes.map(box => {
        let changed = false;
        const items = (box.items || []).map(it => {
            if (it.type !== 'reply') return it;
            const idx = choices[it.id];
            if (idx == null) return it;
            const options = getReplyOptions(it);
            const text = options[idx];
            if (!text) return it;
            changed = true;
            return { id: it.id, type: 'text', text: text };
        });
        return changed ? { id: box.id, role: box.role, time: box.time, items: items } : box;
    });
}

/** 播放模式的展示数据（已选择过的回复显示为消息） */
function displayBoxesForPlayMode(chatId, boxes) {
    const prog = chatProgress(chatId);
    if (!prog) return boxes;
    return applyChoicesToBoxes(boxes, prog.choices);
}

function persistPlaybackProgress() {
    if (!playback || !playback.playMode || !playback.chatId) return;
    const existing = progressMap[playback.chatId];
    setChatProgress(playback.chatId, {
        boxIndex: playback.boxIndex,
        itemIndex: playback.itemIndex,
        choices: playback.choices,
        finished: existing ? !!existing.finished : false
    });
    saveProgressMap();
}

/** 自动保存播放进度（防抖：连续快进时不要每条消息都写 localStorage） */
function schedulePersistPlaybackProgress() {
    if (!playback || !playback.playMode) return;
    if (playbackSaveTimer) clearTimeout(playbackSaveTimer);
    playbackSaveTimer = setTimeout(() => {
        playbackSaveTimer = null;
        persistPlaybackProgress();
    }, 120);
}

function startPlayback(opts) {
    opts = opts || {};
    if (!currentStudentId || playback) return;
    const entry = entryOf(currentStudentId);
    const playMode = !!(entry && normalizeChatMode(entry.mode) === 'play') || !!opts.playMode;
    const boxes = chatBoxes();
    if (!boxes.length) {
        showToast(T('playEmpty', null, '还没有聊天内容可以播放'));
        return;
    }
    closeMorePanel();
    const saved = playMode ? chatProgress(currentStudentId) : null;
    playback = {
        chatId: currentStudentId,
        boxes: copyBoxes(boxes),
        boxIndex: 0,
        itemIndex: 0,
        timer: null,
        boxEl: null,
        playMode: playMode,
        choices: saved ? Object.assign({}, saved.choices) : {}
    };
    // 已选择过的回复：在播放副本里直接显示成消息
    playback.boxes = applyChoicesToBoxes(playback.boxes, playback.choices);

    const container = document.getElementById('chat-content');
    container.innerHTML = '';
    container.classList.add('playing');
    const page = document.getElementById('chat-page');
    if (page) {
        page.classList.toggle('play-mode', playMode);
        page.classList.add('playing'); // 需求 7：播放时隐藏发送栏
    }
    // 需求 6：播放模式不显示播放进度（整条进度栏都不显示）
    document.getElementById('playback-bar').classList.toggle('hidden', playMode);
    document.getElementById('btn-play').classList.add('playing');
    document.getElementById('btn-play-text').textContent = T('playStopBtn', null, '停止');
    document.getElementById('chat-input-area').classList.add('disabled');
    document.getElementById('chat-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('append-btn').disabled = true;
    document.getElementById('btn-more').disabled = true;
    updatePlaybackProgress();

    // 继续上次进度：先把已播放内容一次性铺好，再接着播
    if (playMode && saved && !saved.finished && (saved.boxIndex > 0 || saved.itemIndex > 0)) {
        const total = playback.boxes.length;
        let bi = Math.min(saved.boxIndex, total);
        let ii = saved.itemIndex;
        if (bi >= total) { bi = total - 1; ii = (playback.boxes[bi].items || []).length; }
        renderPlaybackUpTo(bi, ii);
        playback.boxIndex = bi;
        playback.itemIndex = ii;
        updatePlaybackProgress();
        playback.timer = setTimeout(playbackNext, 240);
        return;
    }
    playbackNext();
}

/** 立即渲染 0..bi 盒子的内容（播放进度恢复用，无打字动画） */
function renderPlaybackUpTo(bi, ii) {
    if (!playback) return;
    const container = document.getElementById('chat-content');
    container.innerHTML = '';
    playback.boxEl = null;
    for (let b = 0; b < bi && b < playback.boxes.length; b++) {
        const box = playback.boxes[b];
        playback.boxEl = null;
        ensurePlaybackBox(box);
        (box.items || []).forEach(it => playbackAppendItem(box, it, true));
    }
    if (bi < playback.boxes.length) {
        const box = playback.boxes[bi];
        playback.boxEl = null;
        ensurePlaybackBox(box);
        const items = box.items || [];
        for (let i = 0; i < ii && i < items.length; i++) {
            playbackAppendItem(box, items[i], true);
        }
    }
    scrollChatToBottom(container);
}

function copyBoxes(boxes) {
    return boxes.map(b => ({
        id: b.id,
        role: b.role,
        time: b.time,
        items: b.items.map(it => Object.assign({}, it))
    }));
}

function ensurePlaybackBox(box) {
    const pb = playback;
    if (pb && pb.boxEl && pb.boxEl.isConnected) return pb.boxEl;
    const container = document.getElementById('chat-content');
    const stu = currentStudent();
    const isSensei = box.role === 'sensei';
    const studentName = stu ? stu.displayName : '';
    const avatar = stu ? (stu.avatar || fallbackAvatar(stu.displayName)) : fallbackAvatar('?');
    const avatarHtml = isSensei ? '' :
        `<img class="box-avatar" src="${escapeHtml(avatar)}" data-fallback="${escapeHtml(fallbackAvatar(studentName || '?'))}" referrerpolicy="no-referrer" alt="">`;
    const hasCard = (box.items || []).some(it => isCenterItemType(it.type));
    // 老师消息不显示名字（与 boxHtml 一致）
    const nameHtml = isSensei ? '' : `<div class="box-name">${escapeHtml(studentName)}</div>`;
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="msg-box ${isSensei ? 'sensei' : 'student'}${hasCard ? ' card-box' : ''}" data-box-id="${escapeHtml(box.id)}">
        ${avatarHtml}
        <div class="box-body">
            ${nameHtml}
            <div class="box-items"></div>
        </div>
    </div>`;
    const el = wrap.firstElementChild;
    container.appendChild(el);
    if (pb) pb.boxEl = el;
    return el;
}

function playbackAppendItem(box, item, skipScroll) {
    const boxEl = ensurePlaybackBox(box);
    const itemsEl = boxEl.querySelector('.box-items');
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="msg-item" data-item-id="${escapeHtml(item.id)}">${itemHtml(item)}</div>`;
    itemsEl.appendChild(wrap.firstElementChild);
    if (!skipScroll) scrollChatToBottom(document.getElementById('chat-content'));
}

// 学生消息前的打字动画：每条学生消息播放一次，一次动画周期内完成
function playbackShowTyping(standalone) {
    const container = document.getElementById('chat-content');
    if (standalone) {
        const old = container.querySelector('.typing-box');
        if (old) old.remove();
        const wrap = document.createElement('div');
        wrap.innerHTML = typingBoxHtml();
        container.appendChild(wrap.firstElementChild);
    } else if (playback && playback.boxEl && playback.boxEl.isConnected) {
        const itemsEl = playback.boxEl.querySelector('.box-items');
        const old = itemsEl.querySelector('.typing-item');
        if (old) old.remove();
        const wrap = document.createElement('div');
        wrap.innerHTML = `<div class="msg-item typing-item">
            <div class="msg-bubble typing-bubble" style="--typing-dur:${settings.animationTime}ms">
                <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
            </div>
        </div>`;
        itemsEl.appendChild(wrap.firstElementChild);
    }
    scrollChatToBottom(container);
}

function removePlaybackTyping() {
    const container = document.getElementById('chat-content');
    if (!container) return;
    const standalone = container.querySelector('.typing-box');
    if (standalone) standalone.remove();
    container.querySelectorAll('.typing-item').forEach(el => el.remove());
}

function playbackNext() {
    if (!playback) return;
    const pb = playback;
    if (pb.boxIndex >= pb.boxes.length) {
        finishPlayback();
        return;
    }
    const box = pb.boxes[pb.boxIndex];
    updatePlaybackProgress();

    // 每个盒子里的每一条信息都逐条播放
    const item = box.items[pb.itemIndex];
    if (!item) {
        pb.boxIndex++;
        pb.itemIndex = 0;
        pb.boxEl = null;
        if (pb.boxIndex >= pb.boxes.length) { finishPlayback(); return; }
        updatePlaybackProgress();
        pb.timer = setTimeout(playbackNext, 360);
        return;
    }

    const isFirst = pb.itemIndex === 0;

    // 回复框需要用户选择一个选项后才能继续播放
    if (item.type === 'reply') {
        removePlaybackTyping();
        playbackAppendItem(box, item);
        pb.waitingReply = { boxId: box.id, itemId: item.id };
        updatePlaybackProgress();
        return;
    }

    const advance = () => {
        if (!playback) return;
        pb.itemIndex++;
        schedulePersistPlaybackProgress();
        if (pb.itemIndex >= box.items.length) {
            pb.boxIndex++;
            pb.itemIndex = 0;
            pb.boxEl = null;
            if (pb.boxIndex >= pb.boxes.length) {
                // 留一点时间让最后一条信息完整出现，再恢复完整聊天
                pb.timer = setTimeout(finishPlayback, 260);
                return;
            }
            updatePlaybackProgress();
            pb.timer = setTimeout(playbackNext, 360);
        } else {
            pb.timer = setTimeout(playbackNext, 300);
        }
    };

    if (box.role === 'student') {
        playbackShowTyping(isFirst);
        pb.timer = setTimeout(() => {
            if (!playback) return;
            removePlaybackTyping();
            playbackAppendItem(box, item);
            advance();
        }, settings.animationTime);
    } else {
        playbackAppendItem(box, item);
        advance();
    }
}

function resolvePlaybackReply(boxId, itemId, optionIndex) {
    if (!playback || !playback.waitingReply) return;
    const pb = playback;
    const pBox = pb.boxes.find(b => b.id === boxId);
    const pItem = pBox ? pBox.items.find(it => it.id === itemId) : null;
    if (!pBox || !pItem) return;
    const options = getReplyOptions(pItem);
    const text = options[optionIndex];
    if (!text) return;

    // 只在播放副本里把回复框替换成消息；绝不写回真实聊天数据。
    // 播放模式（分享出去的聊天）下把选择记进播放进度，结束后「回复」框不复原。
    pItem.type = 'text';
    pItem.text = text;
    delete pItem.options;
    if (pb.playMode) {
        pb.choices = pb.choices || {};
        pb.choices[itemId] = optionIndex;
        persistPlaybackProgress();
    }

    // 播放视图里把回复选择框替换成普通消息气泡
    const container = document.getElementById('chat-content');
    const itemEls = container.querySelectorAll('.msg-item[data-item-id]');
    for (let i = 0; i < itemEls.length; i++) {
        if (itemEls[i].dataset.itemId === itemId) {
            itemEls[i].innerHTML = itemHtml(pItem);
            break;
        }
    }
    // 回复选择框变成普通消息后，取消整盒居中（改回普通的左右对齐）
    if (!pBox.items.some(it => isCenterItemType(it.type))) {
        const boxEls = container.querySelectorAll('.msg-box[data-box-id]');
        for (let i = 0; i < boxEls.length; i++) {
            if (boxEls[i].dataset.boxId === boxId) { boxEls[i].classList.remove('card-box'); break; }
        }
    }

    pb.waitingReply = null;
    pb.itemIndex++;
    schedulePersistPlaybackProgress();
    if (pb.itemIndex >= pBox.items.length) {
        pb.boxIndex++;
        pb.itemIndex = 0;
        pb.boxEl = null;
        if (pb.boxIndex >= pb.boxes.length) {
            updatePlaybackProgress();
            pb.timer = setTimeout(finishPlayback, 260);
            return;
        }
        updatePlaybackProgress();
        pb.timer = setTimeout(playbackNext, 360);
    } else {
        updatePlaybackProgress();
        pb.timer = setTimeout(playbackNext, 320);
    }
}

function finishPlayback() {
    // 播放模式：标记「已看完」，并把已选回复写进进度（结束后回复框不复原）
    if (playback && playback.playMode && playback.chatId) {
        if (playbackSaveTimer) { clearTimeout(playbackSaveTimer); playbackSaveTimer = null; }
        setChatProgress(playback.chatId, {
            boxIndex: playback.boxIndex,
            itemIndex: playback.itemIndex,
            choices: playback.choices,
            finished: true
        });
        saveProgressMap();
    }
    stopPlayback(false);
}

function stopPlayback(silent) {
    if (playback) {
        if (playback.timer) clearTimeout(playback.timer);
        if (playbackSaveTimer) { clearTimeout(playbackSaveTimer); playbackSaveTimer = null; }
        // 需求 6：播放模式自动保存播放进度
        if (playback.playMode) persistPlaybackProgress();
        playback = null;
    }
    removePlaybackTyping();
    resetPlayButton();
    if (!silent) renderChat();
}

function togglePlayback() {
    if (playback) {
        stopPlayback(false);
        return;
    }
    // 播放模式：点播放键 = 重新播放（清空已保存的进度与已选回复）
    if (isPlaybackModeChat()) {
        delete progressMap[currentStudentId];
        saveProgressMap();
        startPlayback({ playMode: true });
        return;
    }
    startPlayback();
}

// 切后台 / 关页面时把播放进度落盘，避免防抖窗口内丢进度
window.addEventListener('pagehide', () => {
    if (playback && playback.playMode) persistPlaybackProgress();
});
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && playback && playback.playMode) persistPlaybackProgress();
});
