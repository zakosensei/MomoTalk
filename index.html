function screenshotFilename() {
    return 'momotalk_chat_' + timestampForFile(new Date()) + '.png';
}

function prepareBoxesForScreenshot(boxes) {
    const stu = currentStudent();
    const name = stu ? stu.displayName : '';
    return copyBoxes(boxes).map(b => ({
        id: b.id,
        role: b.role,
        time: b.time,
        items: b.items.map(it => {
            if (it.type === 'story') {
                return Object.assign({}, it, {
                    title: T('storyTitle', null, '好感故事'),
                    text: T('storyDefaultBtn', { name: name }, '进入{name}的好感故事')
                });
            }
            if (it.type === 'reply') {
                return Object.assign({}, it, {
                    title: T('replyTitle', null, '回复'),
                    options: getReplyOptions(it)
                });
            }
            return it;
        })
    }));
}

function screenshotImageProxy() {
    // 可选：远程图片（学生头像等）没有 CORS 头，canvas 直连加载会失败，
    // 通过图片代理转成带 CORS 的地址才能在截图里画出来。配置在
    // running_datas.json 的 screenshot.imageProxy（{url} 为占位符，留空则关闭）。
    const sc = CONFIG.screenshot || {};
    return typeof sc.imageProxy === 'string' ? sc.imageProxy.trim() : '';
}

function takeScreenshot() {
    if (!currentStudentId) return;
    if (playback) stopPlayback(false);
    const stu = currentStudent();
    if (!stu) return;
    // 播放模式：截图也使用「已选回复」的展示数据
    const boxes = isPlayChat(currentStudentId)
        ? displayBoxesForPlayMode(currentStudentId, chatBoxes())
        : chatBoxes();
    if (!boxes.length) {
        showToast(T('playEmpty', null, '还没有聊天内容可以截图'));
        return;
    }
    if (!window.ChatScreenshot || typeof window.ChatScreenshot.generate !== 'function') {
        showToast(T('screenshotUnavailable', null, '截图模块未加载，请检查 resources/chat_screenshot.js'));
        return;
    }
    const content = document.getElementById('chat-content');
    const width = Math.max(300, Math.min(460, (content ? content.clientWidth : 360)));
    showModal(T('screenshotTitle', null, '聊天截图'),
        `<div class="screenshot-loading"><div class="spinner"></div><span>${escapeHtml(T('screenshotCreating', null, '正在生成截图…'))}</span></div>`, []);

    window.ChatScreenshot.generate({
        boxes: prepareBoxesForScreenshot(boxes),
        student: { name: stu.displayName, avatar: stu.avatar || fallbackAvatar(stu.displayName) },
        width: width,
        dpr: 2,
        imageProxy: screenshotImageProxy(),
        texts: {
            reply: T('replyTitle', null, '回复'),
            story: T('storyTitle', null, '好感故事'),
            imageFail: T('imageLoadFail', null, '图片加载失败')
        }
    }).then(res => {
        const canvas = res && res.canvas ? res.canvas : res;
        if (!canvas || typeof canvas.toDataURL !== 'function') throw new Error('截图模块返回格式错误');
        const dataUrl = canvas.toDataURL('image/png');
        const html = `<div class="screenshot-wrap"><img id="screenshot-preview-img" src="${dataUrl}" alt=""></div>`;
        showModal(T('screenshotTitle', null, '聊天截图'), html, [
            {
                text: T('screenshotSave', null, '保存图片'), class: 'confirm',
                onClick: () => { downloadDataUrl(dataUrl, screenshotFilename()); closeModal(); }
            },
            { text: T('closeBtn', null, '关闭'), class: 'cancel', onClick: closeModal }
        ]);
    }).catch(err => {
        console.error('截图失败：', err);
        showModal(T('screenshotFailTitle', null, '截图失败'),
            `<div style="font-size:13px;color:#666;line-height:1.7;text-align:center;word-break:break-all;">
                ${escapeHtml(err && err.message ? err.message : String(err))}
            </div>`, [{ text: T('notReadyOk', null, '知道了'), class: 'confirm', onClick: closeModal }]);
    });
}

let toastTimer = null;

function showToast(msg) {
    let el = document.getElementById('app-toast');
    if (!el) {
        el = document.createElement('div');
        el.id = 'app-toast';
        el.className = 'toast';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('show'));
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

function confirmModal(title, bodyHtml, onConfirm) {
    showModal(title, `<div style="font-size:13px;color:#666;line-height:1.8;text-align:center;">${bodyHtml}</div>`, [
        { text: T('manageCancel', null, '取消'), class: 'cancel', onClick: closeModal },
        {
            text: T('confirmDeleteBtn', null, '删除'), class: 'danger',
            onClick: () => { closeModal(); onConfirm(); }
        }
    ]);
}

function openImagePreview(src) {
    if (!src) return;
    showModal(T('imagePreviewTitle', null, '查看图片'),
        `<div class="screenshot-wrap" style="background:#f4f6f8;"><img src="${escapeHtml(src)}" alt=""></div>`,
        [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
}

function timestampForFile(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
        p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function downloadDataUrl(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function autoBackup() {
    if (!settings.autoBackup) return;
    if (!myStudents.length && !Object.keys(chats).length) return;
    try {
        const data = buildExportData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        downloadBlob(blob, 'momotalk_autobackup_' + timestampForFile(new Date()) + '.json');
    } catch (e) {
        console.error('自动备份失败：', e);
    }
}

/* ================= 长按 / 点击绑定（一次性） ================= */

function initChatInteractions() {
    const container = document.getElementById('chat-content');
    if (!container || container.dataset.bound) return;
    container.dataset.bound = '1';

    let press = null;
    let pressTimer = null;

    const clearPress = () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        press = null;
    };

    container.addEventListener('pointerdown', e => {
        if (playback) return;
        if (currentStudentId && isPlayChat(currentStudentId)) return; // 播放模式不允许编辑
        if (e.button !== undefined && e.button !== 0) return;
        if (morePanelOpen) { closeMorePanel(); return; }
        const boxEl = e.target.closest('.msg-box[data-box-id]');
        if (!boxEl) return;
        clearPress();
        longPressFired = false;
        press = { x: e.clientX, y: e.clientY, boxId: boxEl.dataset.boxId };
        pressTimer = setTimeout(() => {
            pressTimer = null;
            const id = press ? press.boxId : null;
            press = null;
            if (!id) return;
            longPressFired = true;
            openBoxEditor(id);
        }, 550);
    });

    container.addEventListener('pointermove', e => {
        if (!press) return;
        const dx = e.clientX - press.x;
        const dy = e.clientY - press.y;
        if (dx * dx + dy * dy > 64) clearPress();
    }, { passive: true });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
        container.addEventListener(ev, clearPress, { passive: true });
    });

    container.addEventListener('click', e => {
        if (longPressFired) { longPressFired = false; return; }
        const optionBtn = e.target.closest('.reply-option');
        if (optionBtn) {
            chooseReplyOption(optionBtn);
            return;
        }
        const wrap = e.target.closest('.msg-image-wrapper');
        if (wrap) {
            const img = wrap.querySelector('img');
            if (img) openImagePreview(img.getAttribute('src'));
        }
    });

    container.addEventListener('contextmenu', e => {
        if (currentStudentId && isPlayChat(currentStudentId)) { e.preventDefault(); return; }
        const boxEl = e.target.closest('.msg-box[data-box-id]');
        if (!boxEl) return;
        e.preventDefault();
        openBoxEditor(boxEl.dataset.boxId);
    });
}

function initMorePanelEvents() {

/* ================= 下拉刷新 ================= */

function initPullRefresh() {
    const list = document.getElementById('contact-list');
    if (!list || list.dataset.pullBound) return;
    list.dataset.pullBound = '1';

    const indicator = document.createElement('div');
    indicator.className = 'pull-refresh';
    indicator.innerHTML = '<div class="spinner"></div><span id="pull-refresh-text"></span>';
    list.appendChild(indicator);
    const textEl = indicator.querySelector('span');

    let startY = 0;
    let pull = 0;
    let tracking = false;
    let refreshing = false;

    const setText = t => { if (textEl) textEl.textContent = t; };

    list.addEventListener('touchstart', e => {
        if (refreshing) return;
        if (document.getElementById('chat-page').classList.contains('slide-in')) return;
        if (list.scrollTop > 0) return;
        if (!e.touches || !e.touches.length) return;
        // 列表每次渲染都会重写 innerHTML，刷新指示器要重新挂回
        if (!indicator.isConnected) list.appendChild(indicator);
        startY = e.touches[0].clientY;
        pull = 0;
        tracking = true;
        indicator.classList.add('visible');
        indicator.style.transform = 'translateY(-52px)';
        setText(T('pullRefresh', null, '下拉刷新'));
    }, { passive: true });

    list.addEventListener('touchmove', e => {
        if (!tracking) return;
        if (list.scrollTop > 0) { tracking = false; indicator.classList.remove('visible'); indicator.style.transform = ''; return; }
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) {
            pull = 0;
            indicator.style.transform = 'translateY(-52px)';
            setText(T('pullRefresh', null, '下拉刷新'));
            return;
        }
        pull = Math.min(dy * 0.5, 82);
        indicator.style.transform = 'translateY(' + Math.round(pull - 52) + 'px)';
        setText(pull >= 52 ? T('releaseRefresh', null, '释放以刷新') : T('pullRefresh', null, '下拉刷新'));
    }, { passive: true });

    const finish = () => {
        if (!tracking) return;
        tracking = false;
        indicator.classList.remove('visible');
        if (pull < 52) {
            indicator.style.transform = '';
            pull = 0;
            return;
        }
        refreshing = true;
        indicator.style.transform = 'translateY(0)';
        setText(T('refreshing', null, '刷新中…'));
        const started = Date.now();
        Promise.resolve(loadLibrary()).then(() => {
            renderContactList();
            const wait = Math.max(0, 500 - (Date.now() - started));
            setTimeout(() => {
                refreshing = false;
                pull = 0;
                indicator.style.transform = '';
                setText(T('refreshDone', null, '刷新完成'));
                showToast(T('refreshDone', null, '刷新完成'));
            }, wait);
        }).catch(() => {
            refreshing = false;
            pull = 0;
            indicator.style.transform = '';
        });
    };

    list.addEventListener('touchend', finish);
    list.addEventListener('touchcancel', finish);
}

/* ================= 右滑返回 ================= */

function bindSwipeBack(pageEl, onBack) {
    if (!pageEl || pageEl.dataset.swipeBound) return;
    pageEl.dataset.swipeBound = '1';

    let startX = 0, startY = 0, tracking = false, dx = 0, active = false;

    const ignoreTarget = target => !!(target && target.closest &&
        target.closest('textarea, input, .setting-range, .emoji-grid, .more-tiles, .screenshot-wrap, .box-edit-list'));

    pageEl.addEventListener('touchstart', e => {
        if (!e.touches || !e.touches.length) return;
        if (ignoreTarget(e.target)) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dx = 0;
        tracking = true;
        active = false;
    }, { passive: true });

    pageEl.addEventListener('touchmove', e => {
        if (!tracking) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        dx = x - startX;
        const dy = y - startY;
        if (!active) {
            if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
            if (Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
            if (dx <= 0) { tracking = false; return; }
            active = true;
            pageEl.classList.add('swiping');
        }
        const offset = Math.max(0, Math.min(dx, 200));
        pageEl.style.transform = 'translateX(' + offset + 'px)';
    }, { passive: true });

    const finish = () => {
        if (!tracking && !active) return;
        tracking = false;
        const moved = dx;
        pageEl.classList.remove('swiping');
        if (active && moved > 80) {
            pageEl.style.transform = '';
            onBack();
        } else {
            pageEl.style.transform = '';
        }
        active = false;
        dx = 0;
    };

    pageEl.addEventListener('touchend', finish);
    pageEl.addEventListener('touchcancel', finish);
}

function initSwipeGestures() {
    const chatPage = document.getElementById('chat-page');
    bindSwipeBack(chatPage, () => {
        if (modalOverlay.classList.contains('active')) return;
        if (morePanelOpen) { closeMorePanel(); return; }
        if (playback) { stopPlayback(false); return; }
        closeChat();
    });

    const morePage = document.getElementById('more-page');
    bindSwipeBack(morePage, () => {
        if (modalOverlay.classList.contains('active')) return;
        const backBtn = document.getElementById('more-back-btn');
        if (backBtn && backBtn.classList.contains('show')) backToMoreMain();
        else switchToList();
    });
}

function myKey() { return CONFIG.storage.myStudentsKey || 'momotalk_my_students_v7'; }
function chatsKey() { return CONFIG.storage.chatsKey || 'momotalk_chats_v8'; }
function legacyChatsKey() { return CONFIG.storage.legacyChatsKey || 'momotalk_chats_v7'; }

function saveMyStudents() {
    try { localStorage.setItem(myKey(), JSON.stringify(myStudents)); }
    catch (e) { console.error('保存我的学生失败：', e); }
}

let quotaWarned = false;

function isQuotaError(e) {
    return !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
        || e.code === 22 || e.code === 1014);
}

function saveChats() {
    try { localStorage.setItem(chatsKey(), JSON.stringify(chats)); }
    catch (e) {
        console.error('保存聊天记录失败：', e);
        // 配额写满时原实现只写 console，界面照常显示、刷新后消息却消失；这里明确提示一次
        if (isQuotaError(e) && !quotaWarned) {
            quotaWarned = true;
            showModal(T('storageFullTitle', null, '本地存储已满'), `
                <div style="font-size:13px;color:#666;line-height:1.7;text-align:left;">
                    ${escapeHtml(T('storageFullBody', null, '浏览器本地存储空间不足，最新消息可能没有保存成功。建议先点右上角"导出"备份数据，再清理不再需要的会话。'))}
                </div>
            `, [{ text: T('notReadyOk', null, '知道了'), class: 'confirm', onClick: closeModal }]);
        }
    }
}

function loadUserData() {
    try {
        const raw = localStorage.getItem(myKey());
        if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) {
                const usedChatIds = new Set();
                myStudents = arr
                    .map(x => {
                        // null / 非对象条目不能直接读 x.id：Number(null)=0 会通过校验，
                        // 随后读 x.unread 抛 TypeError，被外层 catch 捕获后整份列表被清空。
                        if (!x || typeof x !== 'object') return null;
                        // 新格式：{ id: chatId, studentId }；旧格式：{ id: studentId }（自动迁移成 chatId）
                        const stuId = Number(x.studentId != null ? x.studentId : x.id);
                        if (!Number.isFinite(stuId) || stuId <= 0) return null;
                        let chatId;
                        if (typeof x.id === 'string' && x.id && String(Number(x.id)) !== x.id) {
                            chatId = x.id;
                        } else {
                            chatId = String(stuId);
                        }
                        if (usedChatIds.has(chatId)) return null;
                        usedChatIds.add(chatId);
                        return {
                            id: chatId,
                            studentId: stuId,
                            unread: Number(x.unread) > 0 ? Number(x.unread) : 0,
                            addedAt: Number(x.addedAt) || 0,
                            note: normalizeNote(x.note),
                            tags: normalizeTags(x.tags),
                            groupId: pickString(x.groupId),
                            pinned: !!x.pinned,
                            order: Number.isFinite(Number(x.order)) ? Number(x.order) : undefined,
                            mode: normalizeChatMode(x.mode)
                        };
                    })
                    .filter(Boolean);
            }
        }
    } catch (e) { myStudents = []; }

    try {
        let raw = localStorage.getItem(chatsKey());
        let migrated = false;
        if (!raw) {
            raw = localStorage.getItem(legacyChatsKey());
            migrated = !!raw;
        }
        if (raw) chats = sanitizeChats(JSON.parse(raw));
        // 旧版扁平数据迁移后立刻写入新 key，旧 key 保留不删
        if (migrated && Object.keys(chats).length) saveChats();
    } catch (e) { chats = {}; }

    // 分组 / 播放进度 / 手动排序：在 chats 之后加载（排序需要最后消息时间）
    loadGroups();
    loadProgressMap();
    if (ensureChatOrder()) saveMyStudents();
}

function bindExportModeHint() {
    const update = () => {
        const hint = document.getElementById('export-mode-hint');
        if (!hint) return;

        document.querySelectorAll('input[name="export-mode"]').forEach(el => { if (el.checked) picked = el.value; });

            ? T('chatModePlayHint', null, '播放模式：打开聊天后自动播放，不能修改聊天内容。')
            : T('chatModeEditHint', null, '编辑模式：收到后可以继续编辑聊天内容。');
    };
    document.querySelectorAll('input[name="export-mode"]').forEach(el => el.addEventListener('change', update));
    update();
}

function chatExportFilename(entry) {
    const stu = libraryById[entry.studentId];
    const name = diffFolderName(stu ? stu.displayName : 'chat');
    return T('chatExportFileName', null, 'momotalk_chat') + '_' + name + '_' + timestampForFile(new Date()) + '.json';
}

function buildSingleChatExport(entry, mode, note) {

    const boxes = cloneBoxes(chats[entry.id] || []);
    const custom = (stu && stu.custom) ? (customStudents.find(s => s.id === entry.studentId) || null) : null;
    return {
        type: 'momotalk-chat',
        version: 1,
        appVersion: (CONFIG.about && CONFIG.about.version) || '',
        exportedAt: new Date().toISOString(),
        mode: normalizeChatMode(mode),
        note: normalizeNote(note),
        student: stu ? {
            id: stu.id,
            baseId: stu.baseId,
            name: stu.displayName,
            shortName: stu.shortName,
            skinName: stu.skinName || '',
            avatar: stu.avatar || ''
        } : null,
        customStudent: custom ? {
            id: custom.id,
            name: custom.name,
            avatar: custom.avatar || '',
            diffs: Array.isArray(custom.diffs) ? custom.diffs.slice() : [],
            diffRange: custom.diffRange || null
        } : null,
        chat: {
            id: entry.id,
            tags: Array.isArray(entry.tags) ? entry.tags.slice() : [],
            boxes: boxes
        }
    };
}

function importCustomStudentFromChatFile(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const name = Array.from(pickString(raw.name)).slice(0, 20).join('');
    if (!name) return null;
    const exist = customStudents.find(s => s.name === name);
    if (exist) return exist;
    const diffs = [];
    (Array.isArray(raw.diffs) ? raw.diffs : []).forEach(d => {
        if (!d || typeof d !== 'object') return;
        const n = Number(d.n);
        const src = pickString(d.src);
        if (!Number.isFinite(n) || n < 1 || !src) return;
        diffs.push({ n: n, src: src });
    });
    diffs.sort((a, b) => a.n - b.n);
    let diffRange = null;
    if (raw.diffRange && typeof raw.diffRange === 'object') {
        const s = Number(raw.diffRange.start);
        const e = Number(raw.diffRange.end);
        if (Number.isFinite(s) && Number.isFinite(e) && s >= 1 && e >= s) diffRange = { start: s, end: e };
    }
    let id = nextCustomStudentId();
    while (customStudents.some(s => s.id === id)) id++;
    const rec = { id: id, name: name, avatar: pickString(raw.avatar), diffs: diffs, diffRange: diffRange };
    customStudents.push(rec);
    saveCustomStudents();
    mergeCustomStudentsIntoLibrary();
    return rec;
}

/** 导入「单个聊天」文件；成功返回 { entry, boxes }，找不到学生时抛错 */
function importSingleChatFile(parsed) {
    let stuId = null;
    const sid = parsed.student ? Number(parsed.student.id) : NaN;
    if (Number.isFinite(sid) && libraryById[sid]) stuId = sid;

    if (!stuId && parsed.student && pickString(parsed.student.name)) {
        const name = pickString(parsed.student.name);
        const found = library.find(s => s.displayName === name || s.shortName === name);
        if (found) stuId = found.id;
    }
    if (!stuId && parsed.customStudent) {
        const rec = importCustomStudentFromChatFile(parsed.customStudent);
        if (rec) stuId = rec.id;
    }
    if (!stuId) {
        const name = parsed.student ? pickString(parsed.student.name) : '';
        if (name) {
            // 学生库里没有这位学生（例如内置学生库更新前）：直接建一个自定义学生兜底
            const rec = importCustomStudentFromChatFile({
                name: name,
                avatar: parsed.student.avatar,
                diffs: [],
                diffRange: null
            });
            if (rec) stuId = rec.id;
        }
    }
    if (!stuId) throw new Error(T('importChatBlocked', null, '该聊天所在的学生不在学生库中，且文件未包含学生信息，已跳过。'));

    const chatId = newChatId(stuId);
    const boxesRaw = parsed.chat && Array.isArray(parsed.chat.boxes) ? parsed.chat.boxes : [];
    const sanitized = sanitizeChats({ [chatId]: boxesRaw });
    const boxes = sanitized[chatId] || [];
    const mode = normalizeChatMode(parsed.mode);

    const entry = {
        id: chatId,
        studentId: stuId,
        unread: 0,
        addedAt: now(),
        note: normalizeNote(parsed.note || ''),
        tags: normalizeTags(parsed.chat && parsed.chat.tags),
        groupId: '',
        pinned: false,
        order: minChatOrder() - 1,
        mode: mode
    };
    myStudents.push(entry);
    chats[chatId] = boxes;
    if (mode === 'play') {
        delete progressMap[chatId];
        saveProgressMap();
    }
    saveMyStudents();
    saveChats();
    if (libraryReady) renderContactList();
    return { entry: entry, boxes: boxes };
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        try {
            const parsed = JSON.parse(e.target.result);
            let importedEntries = [];
            let importedChats = null;
            let importedCustomStudents = null;
            let importedGroups = null;
            let importedProgress = null;

            // 「导出聊天」生成的单聊文件：只导入这一个聊天
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && parsed.type === 'momotalk-chat') {
                if (!libraryReady) throw new Error(T('importLibNotReady', null, '学生资料尚未加载完成'));
                const res = importSingleChatFile(parsed);
                const stu = libraryById[res.entry.studentId];
                const modeLabel = res.entry.mode === 'play'
                    ? T('chatModePlay', null, '播放模式')
                    : T('chatModeEdit', null, '编辑模式');
                showModal(T('importDoneTitle', null, '导入结果'), `
                    <div style="font-size:14px;color:#333;line-height:1.8;">
                        ${escapeHtml(T('importChatDone', { name: stu ? stu.displayName : '', mode: modeLabel }, '已导入聊天：{name}（{mode}）'))}
                    </div>`, [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
                return;
            }

            // 兼容三种输入：数字/字符串学生 id、旧格式 { id: studentId }、新格式 { id: chatId, studentId }
            const toEntry = x => {
                if (x == null) return null;
                if (typeof x === 'number' || typeof x === 'string') {
                    const sid = Number(x);
                    if (!Number.isFinite(sid) || sid <= 0) return null;
                    return { chatId: String(sid), studentId: sid, unread: 0, addedAt: 0 };
                }
                if (typeof x !== 'object') return null;
                const sid = Number(x.studentId != null ? x.studentId : x.id);
                if (!Number.isFinite(sid) || sid <= 0) return null;
                const chatId = (typeof x.id === 'string' && x.id && String(Number(x.id)) !== x.id)
                    ? x.id : String(sid);
                return {
                    chatId: chatId,
                    studentId: sid,
                    unread: Number(x.unread) > 0 ? Number(x.unread) : 0,
                    addedAt: Number(x.addedAt) || 0,
                    note: normalizeNote(x.note),
                    tags: normalizeTags(x.tags),
                    groupId: pickString(x.groupId),
                    pinned: !!x.pinned,
                    order: Number.isFinite(Number(x.order)) ? Number(x.order) : undefined,
                    mode: normalizeChatMode(x.mode)
                };
            };

            if (Array.isArray(parsed)) {
                importedEntries = parsed.map(toEntry).filter(Boolean);
            } else if (parsed && typeof parsed === 'object') {
                if (Array.isArray(parsed.myStudents)) {
                    importedEntries = parsed.myStudents.map(toEntry).filter(Boolean);
                } else if (Array.isArray(parsed.students)) {
                    importedEntries = parsed.students.map(toEntry).filter(Boolean);
                }
                if (parsed.chats && typeof parsed.chats === 'object' && !Array.isArray(parsed.chats)) {
                    importedChats = sanitizeChats(parsed.chats);
                }
                if (Array.isArray(parsed.customStudents)) {
                    importedCustomStudents = normalizeCustomStudents(parsed.customStudents);
                }
                if (Array.isArray(parsed.groups)) {
                    importedGroups = normalizeGroups(parsed.groups);
                }
                if (parsed.progress && typeof parsed.progress === 'object' && !Array.isArray(parsed.progress)) {
                    importedProgress = normalizeProgressMap(parsed.progress);
                }
            } else {
                throw new Error(T('importUnknown', null, '无法识别的文件格式'));
            }

            if (!libraryReady) throw new Error(T('importLibNotReady', null, '学生资料尚未加载完成'));

            if (importedCustomStudents && importedCustomStudents.length) {
                const customIds = new Set(customStudents.map(s => s.id));
                importedCustomStudents.forEach(rec => {
                    if (customIds.has(rec.id)) return;
                    customStudents.push(rec);
                    customIds.add(rec.id);
                });
                saveCustomStudents();
                mergeCustomStudentsIntoLibrary();
            }

            // 分组：先并入（同 id 视为同一分组），再修正被导入会话的 groupId
            if (importedGroups && importedGroups.length) {
                importedGroups.forEach(g => {
                    if (groups.some(x => x.id === g.id)) return;
                    groups.push({ id: g.id, name: g.name, order: groups.length });
                });
                groups = normalizeGroups(groups);
                saveGroups();
            }

            const existing = new Set(myStudents.map(s => s.id));
            let added = 0, missing = 0;
            importedEntries.forEach(entry => {
                if (!libraryById[entry.studentId]) { missing++; return; }
                if (existing.has(entry.chatId)) return;
                const groupId = (entry.groupId && groups.some(g => g.id === entry.groupId)) ? entry.groupId : '';
                myStudents.push({
                    id: entry.chatId,
                    studentId: entry.studentId,
                    unread: entry.unread,
                    addedAt: entry.addedAt || now() + added,
                    note: entry.note || '',
                    tags: entry.tags || [],
                    groupId: groupId,
                    pinned: !!entry.pinned,
                    order: Number.isFinite(entry.order) ? entry.order : undefined,
                    mode: normalizeChatMode(entry.mode)
                });
                existing.add(entry.chatId);
                added++;
            });
            const knownChatIds = new Set(myStudents.map(s => s.id));

            // 播放进度：只保留属于已有会话、且更新的那一份
            if (importedProgress) {
                Object.keys(importedProgress).forEach(k => {
                    if (!knownChatIds.has(k)) return;
                    const incoming = importedProgress[k];
                    const cur = progressMap[k];
                    if (!cur || (Number(incoming.updatedAt) || 0) > (Number(cur.updatedAt) || 0)) {
                        progressMap[k] = incoming;
                    }
                });
                saveProgressMap();
            }

            let chatMerged = 0;
            let addedBoxes = 0;
            if (importedChats) {
                Object.keys(importedChats).forEach(k => {
                    const incoming = importedChats[k];
                    const existingChat = Array.isArray(chats[k]) ? chats[k] : [];
                    // 按盒子内容签名去重：同一份备份重复导入时不会把消息再追加一遍
                    const seen = new Set(existingChat.map(boxSignature));
                    const incomingNew = [];
                    incoming.forEach(b => {
                        const sig = boxSignature(b);
                        if (seen.has(sig)) return;
                        seen.add(sig);
                        incomingNew.push(b);
                    });
                    if (incomingNew.length || existingChat.length) {
                        chats[k] = existingChat.concat(incomingNew).sort((a, b) => a.time - b.time);
                        addedBoxes += incomingNew.length;
                        // 学生库里已不存在的 id 照旧保留数据（日后库更新还能恢复），但不计入"合并会话"
                        if (knownChatIds.has(k) && incomingNew.length) chatMerged++;
                    }
                });
                saveChats();
            }

            saveMyStudents();
            renderContactList();
            renderCustomStudentsUI();

            // 旧备份可能没有 order 字段：按最后消息时间补一遍，避免列表顺序随机
            if (ensureChatOrder()) saveMyStudents();

            let doneHtml = `<div style="font-size:14px;color:#333;line-height:1.8;">${escapeHtml(
                T('importDone', { added: added, merged: chatMerged },
                    `导入完成：新增 ${added} 个学生形态，合并 ${chatMerged} 个会话。`))}</div>`;
            if (addedBoxes) {
                doneHtml += `<div style="font-size:13px;color:#999;margin-top:6px;">${escapeHtml(
                    T('importBoxes', { n: addedBoxes }, `新增 ${addedBoxes} 个信息盒子。`))}</div>`;
            }
            if (missing) {
                doneHtml += `<div style="font-size:13px;color:#d85c76;margin-top:6px;">${escapeHtml(
                    T('importMissing', { n: missing }, `有 ${missing} 个 id 在当前学生库中不存在，已跳过。`))}</div>`;
            }
            showModal(T('importDoneTitle', null, '导入结果'), doneHtml, [
                { text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }
            ]);
        } catch (err) {
            const detail = (err && err.message) ? err.message : String(err);
            showModal(T('importFailTitle', null, '导入失败'),
                `<div style="font-size:13px;color:#666;line-height:1.7;word-break:break-all;">${escapeHtml(detail)}</div>`,
                [{ text: T('closeBtn', null, '关闭'), class: 'confirm', onClick: closeModal }]);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const modalActions = document.getElementById('modal-actions');

function showModal(title, bodyHtml, actions) {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    // modal-body 是常驻元素：每次打开弹窗先清掉上一次挂的点击处理器，
    // 否则多次打开同一类弹窗会重复触发（例如分组管理点一次建两个分组）
    modalBody.onclick = null;
    modalActions.innerHTML = '';
    (actions || []).forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'modal-btn ' + a.class;
        btn.textContent = a.text;
        btn.onclick = a.onClick;
        modalActions.appendChild(btn);
    });
    modalOverlay.classList.add('active');
}

function closeModal() {
    modalOverlay.classList.remove('active');
}

modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('active')) closeModal();
        else if (morePanelOpen) closeMorePanel();
        else if (playback) stopPlayback(false);
        else if (currentStudentId) closeChat();
        else if (document.getElementById('more-page').classList.contains('active')) {
            if (document.getElementById('more-back-btn').classList.contains('show')) backToMoreMain();
            else switchToList();
        }
    }
});
